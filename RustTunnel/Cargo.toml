[package]
name = "bufi-tunnel-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
base64 = "0.22.1"
bytes = "1.11.1"
gotatun = { git = "https://github.com/mullvad/gotatun.git", rev = "fdf5e909ffe5e12310b2fe72a5fb82ab17dcd2e8", default-features = false, features = ["device", "ring"] }
ipnetwork = "0.21.1"
libc = "0.2.180"
nix = { version = "0.31.1", default-features = false, features = ["fs", "uio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["io-util", "net", "rt-multi-thread", "sync"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zerocopy = { version = "0.8.27", features = ["std"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "debuginfo"
