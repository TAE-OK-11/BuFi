name: BuFi
options:
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: cloud.tae00217
  developmentLanguage: ko
  knownRegions:
    - ko
    - en
    - ja
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  projectFormat: xcode16_3
  createIntermediateGroups: true
settings:
  base:
    # Swift 6 language mode makes the complete-concurrency diagnostics below
    # enforceable instead of advisory. Keep this at the project level so the
    # app cannot silently drift onto a different language mode.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ALWAYS_SEARCH_USER_PATHS: false
    CLANG_ENABLE_MODULES: true
    SWIFT_ENABLE_EXPLICIT_MODULES: true
    COMPILATION_CACHE_ENABLE_CACHING: true
    COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS: false
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: incremental
      OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature NonisolatedNonsendingByDefault -enable-actor-data-race-checks"
      LLVM_LTO: NO
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
      OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature NonisolatedNonsendingByDefault"
      # Release favors final runtime/code-size optimization over build
      # latency. Monolithic LLVM LTO complements Swift whole-module -O and lets
      # the linker optimize across object-file boundaries.
      LLVM_LTO: YES
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: NO
      ENABLE_NS_ASSERTIONS: NO
      ENABLE_TESTABILITY: NO
      ENABLE_PREVIEWS: NO
      SWIFT_EMIT_LOC_STRINGS: NO
      ONLY_ACTIVE_ARCH: NO
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ASSETCATALOG_COMPILER_OPTIMIZATION: space
      COPY_PHASE_STRIP: NO
      # Keep unsigned CI artifacts free from aggressive post-link stripping;
      # normal Swift optimization and dead-code stripping remain enabled.
      STRIP_STYLE: non-global
      STRIP_INSTALLED_PRODUCT: NO
      STRIP_SWIFT_SYMBOLS: NO
      VALIDATE_PRODUCT: YES
packages:
  SwiftSonic:
    url: https://github.com/CassetteLab/swiftsonic.git
    exactVersion: 0.9.0
  Nuke:
    url: https://github.com/kean/Nuke.git
    exactVersion: 13.1.0
  Zstandard:
    url: https://github.com/facebook/zstd.git
    exactVersion: 1.5.7
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
targets:
  BuFi:
    type: application
    platform: iOS
    sources:
      - path: BuFi
        excludes:
          - Resources/Info.plist
          - Resources/PrivacyInfo.xcprivacy
          - Resources/ThirdPartyLicenses.txt
      - path: BuFi/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: BuFi/Resources/ThirdPartyLicenses.txt
        buildPhase: resources
    dependencies:
      - package: SwiftSonic
        product: SwiftSonic
      - package: Nuke
        product: Nuke
      - package: Zstandard
        product: libzstd
      - package: GRDB
        product: GRDB
    info:
      path: BuFi/Resources/Info.plist
      properties:
        CFBundleDisplayName: BuFi
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - ko
          - en
          - ja
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - Unbounded.ttf
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.tae00217.BuFi
        PRODUCT_NAME: BuFi
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: ""
        COREML_CODEGEN_LANGUAGE: None
    scheme:
      gatherCoverageData: false
