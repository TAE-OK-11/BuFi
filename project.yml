name: BuFi
options:
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: cloud.tae00217
  developmentLanguage: ko
  knownRegions:
    - ko
    - en
    - ja
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  projectFormat: xcode16_3
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ALWAYS_SEARCH_USER_PATHS: false
    CLANG_ENABLE_MODULES: true
    SWIFT_ENABLE_EXPLICIT_MODULES: true
    COMPILATION_CACHE_ENABLE_CACHING: true
    COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS: false
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: incremental
      LLVM_LTO: NO
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
      LLVM_LTO: YES
      DEAD_CODE_STRIPPING: YES
      DEPLOYMENT_POSTPROCESSING: YES
      ENABLE_NS_ASSERTIONS: NO
      ENABLE_TESTABILITY: NO
      ENABLE_PREVIEWS: NO
      SWIFT_EMIT_LOC_STRINGS: NO
      ONLY_ACTIVE_ARCH: NO
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ASSETCATALOG_COMPILER_OPTIMIZATION: space
      COPY_PHASE_STRIP: YES
      # Xcode 26.3-27 beta strip -S -T can corrupt dyld chained fixups in
      # Swift 6 binaries (FB23528109). Keep safe non-global stripping until
      # the affected toolchains are retired.
      STRIP_STYLE: non-global
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: NO
      VALIDATE_PRODUCT: YES
packages:
  SwiftSonic:
    url: https://github.com/CassetteLab/swiftsonic.git
    exactVersion: 0.9.0
  Nuke:
    url: https://github.com/kean/Nuke.git
    exactVersion: 13.0.6
  Zstandard:
    url: https://github.com/facebook/zstd.git
    exactVersion: 1.5.7
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
targets:
  BuFi:
    type: application
    platform: iOS
    sources:
      - path: BuFi
        excludes:
          - Resources/Info.plist
          - Resources/PrivacyInfo.xcprivacy
          - Resources/ThirdPartyLicenses.txt
      - path: BuFi/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: BuFi/Resources/ThirdPartyLicenses.txt
        buildPhase: resources
    dependencies:
      - package: SwiftSonic
        product: SwiftSonic
      - package: Nuke
        product: Nuke
      - package: Zstandard
        product: libzstd
      - package: GRDB
        product: GRDB
    info:
      path: BuFi/Resources/Info.plist
      properties:
        CFBundleDisplayName: BuFi
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleLocalizations:
          - ko
          - en
          - ja
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - Unbounded.ttf
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.tae00217.BuFi
        PRODUCT_NAME: BuFi
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: ""
    scheme:
      testTargets:
        - BuFiTests
      gatherCoverageData: false
  BuFiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BuFiTests
    dependencies:
      - target: BuFi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
