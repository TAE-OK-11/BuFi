name: BuFi
options:
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: cloud.tae00217
  developmentLanguage: ko
  knownRegions:
    - ko
    - en
    - ja
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  projectFormat: xcode16_3
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: incremental
      LLVM_LTO: NO
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      LLVM_LTO: YES
      DEAD_CODE_STRIPPING: YES
      ENABLE_TESTABILITY: NO
      ONLY_ACTIVE_ARCH: NO
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ASSETCATALOG_COMPILER_OPTIMIZATION: space
packages:
  SwiftSonic:
    url: https://github.com/CassetteLab/swiftsonic.git
    exactVersion: 0.8.3
  Nuke:
    url: https://github.com/kean/Nuke.git
    exactVersion: 13.0.6
  Zstandard:
    url: https://github.com/facebook/zstd.git
    exactVersion: 1.5.7
targets:
  BuFi:
    type: application
    platform: iOS
    sources:
      - path: BuFi
        excludes:
          - Resources/Info.plist
          - Resources/ThirdPartyLicenses.txt
      - path: BuFi/Resources/ThirdPartyLicenses.txt
        buildPhase: resources
    dependencies:
      - package: SwiftSonic
        product: SwiftSonic
      - package: Nuke
        product: Nuke
      - package: Zstandard
        product: libzstd
    info:
      path: BuFi/Resources/Info.plist
      properties:
        CFBundleDisplayName: BuFi
        CFBundleShortVersionString: "1.4.0"
        CFBundleVersion: "15"
        CFBundleLocalizations:
          - ko
          - en
          - ja
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - audio
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.tae00217.BuFi
        PRODUCT_NAME: BuFi
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "15"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: ""
    scheme:
      testTargets: []
      gatherCoverageData: false
