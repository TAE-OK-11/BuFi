name: Run lyric prompt and editor patch

on:
  push:
    branches:
      - agent/smarter-recommendations
    paths:
      - '.github/workflows/one-shot-run-lyric-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/smarter-recommendations
      - name: Execute staged patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/one-shot-lyric-prompt-editor.yml').read_text()
          marker = "python3 <<'PY'\n"
          script = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), 'lyric_patch.py', 'exec'))
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-lyric-prompt-editor.yml
          git rm .github/workflows/one-shot-run-lyric-patch.yml
          git add BuFi/Core/LyricDetailProfile.swift BuFi/Core/LyricModelFamily.swift BuFi/Core/LyricIntelligence.swift BuFi/UI/SettingsView.swift
          git commit -m 'Refine lyric intelligence and add analysis editor'
          git push origin HEAD:agent/smarter-recommendations
