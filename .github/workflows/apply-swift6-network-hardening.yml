name: Apply Swift 6 network hardening

"on":
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - .github/workflows/apply-swift6-network-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 1

      - name: Apply source patch
        run: python3 Scripts/apply_swift6_network_hardening.py

      - name: Validate patch
        run: git diff --check

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/Core/OpenSubsonicClient.swift BuFi/Playback/AudioEngine.swift
          git commit -m "Harden API and streaming request identities"
          git push origin HEAD:agent/swift-6-concurrency
