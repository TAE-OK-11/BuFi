name: Apply Swift 6 network hardening

"on":
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - .github/workflows/apply-swift6-network-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 1

      - name: Repair and apply stream key patch
        run: python3 Scripts/repair_swift6_stream_key.py

      - name: Validate patch
        run: |
          git diff --check
          grep -F 'LaunchDiagnostics.mark("audio-runtime-ready")' BuFi/Playback/AudioEngine.swift
          grep -F ') -> PreparedPlaybackKey {' BuFi/Playback/AudioEngine.swift
          if grep -F 'audio-runtime-ready    private static func' BuFi/Playback/AudioEngine.swift; then
            exit 1
          fi

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/Playback/AudioEngine.swift
          git commit -m "Repair typed streaming request identity"
          git push origin HEAD:agent/swift-6-concurrency
