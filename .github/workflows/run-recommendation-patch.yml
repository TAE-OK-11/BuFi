name: Apply Recommendation Patch

on:
  push:
    branches:
      - agent/recommendation-accuracy-speed

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply exact source patch
        shell: bash
        run: |
          if grep -q 'private struct RecommendationCandidateMetadata' BuFi/Core/RecommendationEngine.swift; then
            exit 0
          fi
          python3 .github/scripts/apply_recommendation_patch.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'private struct RecommendationCandidateMetadata' BuFi/Core/RecommendationEngine.swift
          grep -q 'let candidates = unique(sourceLists)' BuFi/Core/RecommendationEngine.swift
          grep -q 'let serverScore = consensusScore' BuFi/Core/RecommendationEngine.swift
          grep -q 'var weightedTotal = 0.0' BuFi/Core/RecommendationEngine.swift
          grep -q 'private static func temporalProfiles' BuFi/Core/RecommendationEngine.swift
          grep -q 'value.score <= bestAdjustedScore' BuFi/Core/RecommendationEngine.swift
          grep -q 'let normalizedGenres: \[String: \[String\]\]' BuFi/Core/RecommendationEngine.swift
          grep -q 'testFavoriteIdentitySurvivesStaleCandidateMetadata' BuFiTests/RecommendationEngineTests.swift
          grep -q 'testLocalRecommendationConsensusOutranksSingleSourceSignal' BuFiTests/RecommendationEngineTests.swift

      - name: Commit optimized recommendation engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Core/RecommendationEngine.swift BuFiTests/RecommendationEngineTests.swift
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Optimize recommendation ranking speed and accuracy'
          git push origin HEAD:agent/recommendation-accuracy-speed
