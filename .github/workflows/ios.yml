name: iOS Build

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  BUFI_BUILD_NUMBER: ${{ github.run_number }}

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-ios:
    name: Swift 6.4 unified iOS build
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Show build toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/BuFiSourcePackages
          key: ${{ runner.os }}-xcode27-swift6.4-spm-${{ hashFiles('project.yml', 'Package.resolved') }}

      - name: Cache compilation artifacts
        uses: actions/cache@v6
        with:
          path: |
            build/DerivedData/CompilationCache.noindex
            build/DerivedData/ModuleCache.noindex
          key: ${{ runner.os }}-xcode27-compilation-${{ hashFiles('project.yml', 'Package.resolved', 'BuFi/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode27-compilation-

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen_version="$(xcodegen --version | sed -E 's/^Version:[[:space:]]*//')"
          printf 'XcodeGen %s\n' "$xcodegen_version"
          case "$xcodegen_version" in
            2.46.*) ;;
            *)
              printf 'Expected XcodeGen 2.46.x, found %s\n' "$xcodegen_version" >&2
              exit 1
              ;;
          esac

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios

      - name: Cache Rust tunnel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustTunnel/target
          key: ${{ runner.os }}-rust-1.95-bufi-tunnel-${{ hashFiles('RustTunnel/Cargo.lock', 'RustTunnel/Cargo.toml', 'RustTunnel/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.95-bufi-tunnel-

      - name: Verify local search behavior
        run: sh Scripts/verify-local-search.sh

      - name: Verify playback and request behavior
        run: sh Scripts/verify-playback-requests.sh

      - name: Verify dependency pins
        run: sh Scripts/verify-dependency-versions.sh

      - name: Prepare generated assets
        run: sh Scripts/prepare-assets.sh

      - name: Generate project
        run: |
          plutil -lint BuFi/Resources/PrivacyInfo.xcprivacy
          xcodegen generate
          sh Scripts/apply-package-lock.sh
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' BuFiTunnelExtension/Info.plist)" = "com.apple.networkextension.packet-tunnel"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' BuFiTunnelExtension/Info.plist)" = '$(PRODUCT_MODULE_NAME).PacketTunnelProvider'
          ! /usr/libexec/PlistBuddy -c 'Print :BuFiSharedKeychainAccessGroup' BuFi/Resources/Info.plist 2>/dev/null
          ! /usr/libexec/PlistBuddy -c 'Print :BuFiSharedKeychainAccessGroup' BuFiTunnelExtension/Info.plist 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.networking.networkextension:0' BuFi/Resources/BuFi.entitlements)" = "packet-tunnel-provider"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' BuFi/Resources/BuFi.entitlements)" = "group.cloud.tae00217.BuFi"
          test "$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' BuFi/Resources/BuFi.entitlements)" = '$(AppIdentifierPrefix)cloud.tae00217.BuFi.tunnel'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.networking.networkextension:0' BuFiTunnelExtension/BuFiTunnelExtension.entitlements)" = "packet-tunnel-provider"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' BuFiTunnelExtension/BuFiTunnelExtension.entitlements)" = "group.cloud.tae00217.BuFi"
          test "$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' BuFiTunnelExtension/BuFiTunnelExtension.entitlements)" = '$(AppIdentifierPrefix)cloud.tae00217.BuFi.tunnel'

      - name: Verify Swift 6.4 unified configuration
        run: Scripts/verify-swift6-language-mode.sh

      - name: Run tunnel configuration tests
        run: |
          set -o pipefail
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for values in d.values() for x in values if x.get("isAvailable") and x["name"].startswith("iPhone")))')"
          xcodebuild \
            -disableAutomaticPackageResolution \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath build/TestDerivedData \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFiSourcePackages" \
            test 2>&1 | tee build/xcode-tests.log

      - name: Build unsigned app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -disableAutomaticPackageResolution \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFiSourcePackages" \
            -parallelizeTargets \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            STRIP_SWIFT_SYMBOLS=NO \
            STRIP_STYLE=non-global \
            CURRENT_PROJECT_VERSION="$BUFI_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcode.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-swift6.4-failure-logs-${{ github.sha }}
          path: |
            build/xcode.log
            build/xcode-tests.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/BuFi.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")" = "17.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$BUFI_BUILD_NUMBER"
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/BuFi.app
          cd build
          zip -qry "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa" Payload
          shasum -a 256 "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa" > "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-build${{ github.run_number }}-unsigned-${{ github.sha }}
          path: |
            build/BuFi-1.0.0-build${{ github.run_number }}-unsigned.ipa
            build/BuFi-1.0.0-build${{ github.run_number }}-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
