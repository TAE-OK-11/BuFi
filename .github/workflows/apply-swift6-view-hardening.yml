name: Apply Swift 6 view hardening

on:
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - .github/workflows/apply-swift6-view-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 1

      - name: Apply Swift 6 view hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              print(f"{label}: {count} match(es)")
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          home = "BuFi/UI/HomeView.swift"
          replace_once(
              home,
              '''    @State private var presentation = HomePresentation.empty
              @State private var presentationInput: HomePresentationInput?
              @State private var presentationGeneration: UInt64 = 0
              @State private var presentationTask: Task<Void, Never>?
''',
              '''    @State private var presentation = HomePresentation.empty
              @State private var hasLoadedPresentation = false
''',
              "home presentation state",
          )
          replace_once(
              home,
              '''        .onAppear { updatePresentationIfNeeded() }
              .onChange(of: library.revision) { _, _ in
                  updatePresentationIfNeeded()
              }
              .onChange(of: selectedArtistMixes) { _, _ in
                  updatePresentationIfNeeded()
              }
              .onDisappear {
                  if presentationTask != nil {
                      presentationInput = nil
                  }
                  presentationTask?.cancel()
                  presentationTask = nil
              }
''',
              '''        .task(id: presentationTaskIdentity) {
                  await updatePresentation()
              }
''',
              "home view-owned task lifetime",
          )
          old_home_func = '''    private func updatePresentationIfNeeded() {
              let input = HomePresentationInput(
                  snapshot: library.snapshot,
                  revision: library.revision,
                  selectedArtists: ArtistMixPreferences.decode(selectedArtistMixes)
              )
              guard input != presentationInput else { return }
              let isInitialPresentation = presentationInput == nil
              presentationInput = input
              presentationGeneration &+= 1
              let generation = presentationGeneration
              presentationTask?.cancel()
              presentationTask = Task {
                  if !isInitialPresentation {
                      do {
                          try await Task.sleep(for: .milliseconds(120))
                      } catch {
                          return
                      }
                  }
                  let work = Task.detached(priority: .userInitiated) {
                      HomePresentation.make(input: input)
                  }
                  let next = await withTaskCancellationHandler {
                      await work.value
                  } onCancel: {
                      work.cancel()
                  }
                  guard !Task.isCancelled,
                        generation == presentationGeneration,
                        input == presentationInput else { return }
                  presentation = next
                  presentationTask = nil
              }
          }
'''
          new_home_func = '''    private var presentationTaskIdentity: HomePresentationTaskIdentity {
              HomePresentationTaskIdentity(
                  revision: library.revision,
                  selectedArtists: selectedArtistMixes
              )
          }

          @MainActor
          private func updatePresentation() async {
              let revision = library.revision
              let snapshot = library.snapshot
              let selectedArtistsStorage = selectedArtistMixes
              guard revision == library.revision else { return }

              let input = HomePresentationInput(
                  snapshot: snapshot,
                  revision: revision,
                  selectedArtists: ArtistMixPreferences.decode(selectedArtistsStorage)
              )

              if hasLoadedPresentation {
                  do {
                      try await Task.sleep(for: .milliseconds(120))
                  } catch {
                      return
                  }
                  guard revision == library.revision,
                        selectedArtistsStorage == selectedArtistMixes else { return }
              }

              let work = Task.detached(priority: .userInitiated) {
                  HomePresentation.make(input: input)
              }
              let next = await withTaskCancellationHandler {
                  await work.value
              } onCancel: {
                  work.cancel()
              }
              guard !Task.isCancelled,
                    revision == library.revision,
                    selectedArtistsStorage == selectedArtistMixes else { return }
              presentation = next
              hasLoadedPresentation = true
          }
'''
          replace_once(home, old_home_func, new_home_func, "home presentation worker")
          replace_once(
              home,
              '''struct HomePresentationInput: Equatable, Sendable {
''',
              '''private struct HomePresentationTaskIdentity: Hashable, Sendable {
              let revision: HomeSnapshotRevision
              let selectedArtists: String
          }

          struct HomePresentationInput: Equatable, Sendable {
''',
              "home task identity",
          )

          library = "BuFi/UI/LibraryView.swift"
          replace_once(
              library,
              '''    @State private var artistPresentation = LibraryArtistPresentation.empty
              @State private var artistPresentationInput: LibraryArtistPresentationInput?
              @State private var artistPresentationGeneration: UInt64 = 0
              @State private var artistPresentationTask: Task<Void, Never>?
''',
              '''    @State private var artistPresentation = LibraryArtistPresentation.empty
''',
              "library presentation state",
          )
          replace_once(
              library,
              '''        .onAppear { updateArtistPresentationIfNeeded() }
              .onChange(of: library.revision) { _, _ in
                  updateArtistPresentationIfNeeded()
              }
              .onDisappear {
                  if artistPresentationTask != nil {
                      artistPresentationInput = nil
                  }
                  artistPresentationTask?.cancel()
                  artistPresentationTask = nil
              }
''',
              '''        .task(id: library.revision) {
                  await updateArtistPresentation()
              }
''',
              "library view-owned task lifetime",
          )
          old_library_func = '''    private func updateArtistPresentationIfNeeded() {
              let input = LibraryArtistPresentationInput(
                  artists: library.snapshot.artists,
                  starredArtists: library.snapshot.starredArtists
              )
              guard input != artistPresentationInput else { return }
              artistPresentationInput = input
              artistPresentationGeneration &+= 1
              let generation = artistPresentationGeneration
              artistPresentationTask?.cancel()
              artistPresentationTask = Task {
                  let work = Task.detached(priority: .userInitiated) {
                      LibraryArtistPresentation.make(input: input)
                  }
                  let next = await withTaskCancellationHandler {
                      await work.value
                  } onCancel: {
                      work.cancel()
                  }
                  guard !Task.isCancelled,
                        generation == artistPresentationGeneration,
                        input == artistPresentationInput else { return }
                  artistPresentation = next
                  artistPresentationTask = nil
              }
          }
'''
          new_library_func = '''    @MainActor
          private func updateArtistPresentation() async {
              let revision = library.revision
              let snapshot = library.snapshot
              guard revision == library.revision else { return }

              let input = LibraryArtistPresentationInput(
                  artists: snapshot.artists,
                  starredArtists: snapshot.starredArtists
              )
              let work = Task.detached(priority: .userInitiated) {
                  LibraryArtistPresentation.make(input: input)
              }
              let next = await withTaskCancellationHandler {
                  await work.value
              } onCancel: {
                  work.cancel()
              }
              guard !Task.isCancelled,
                    revision == library.revision else { return }
              artistPresentation = next
          }
'''
          replace_once(library, old_library_func, new_library_func, "library presentation worker")

          root = "BuFi/UI/RootView.swift"
          replace_once(
              root,
              '''private struct PlayerPresentationSession: Identifiable {
              let id: UUID
          }
''',
              '''private struct PlayerPresentationSession: Identifiable {
              let id: UUID
          }

          private struct RootSyncTaskIdentity: Hashable, Sendable {
              let isReady: Bool
              let isSceneActive: Bool
              let syncInterval: TimeInterval
              let lowPowerMode: Bool
              let thermalKey: String
              let isPlaying: Bool
          }
''',
              "root typed sync identity",
          )
          replace_once(
              root,
              '''    private var syncTaskID: String {
              "\\(session.phase)-\\(scenePhase)-\\(syncInterval)-\\(lowPowerMode)-\\(thermalKey)"
          }
''',
              '''    private var syncTaskID: RootSyncTaskIdentity {
              RootSyncTaskIdentity(
                  isReady: session.phase == .ready,
                  isSceneActive: scenePhase == .active,
                  syncInterval: syncInterval,
                  lowPowerMode: lowPowerMode,
                  thermalKey: thermalKey,
                  isPlaying: playbackActivity.isPlaying
              )
          }
''',
              "root sync identity value",
          )

          search = "BuFi/UI/SearchView.swift"
          old_ranked = '''    private var rankedSongs: some View {
              Group {
                  if library.snapshot.mostPlayedSongs.isEmpty {
                      ContentUnavailableView(
                          "청취 순위가 아직 없습니다",
                          systemImage: "chart.bar"
                      )
                      .padding(.top, 32)
                  } else {
                      BuFiGroupedSurface {
                          LazyVStack(spacing: 0) {
                              ForEach(
                                  Array(library.snapshot.mostPlayedSongs.enumerated()),
                                  id: \\.offset
                              ) { index, song in
                                  HStack(spacing: 10) {
                                      Text("\\(index + 1)")
                                          .font(
                                              .system(
                                                  size: 14,
                                                  weight: index < 3 ? .bold : .medium,
                                                  design: .rounded
                                              )
                                          )
                                          .foregroundStyle(
                                              index < 3
                                                  ? BuFiTheme.accent
                                                  : Color.secondary
                                          )
                                          .monospacedDigit()
                                          .frame(width: 24, alignment: .trailing)
                                      SongRow(
                                          song: song,
                                          queue: library.snapshot.mostPlayedSongs,
                                          queueIndex: index,
                                          artworkSize: 52,
                                          textLineLimit: 2
                                      )
                                  }
                                  .padding(.horizontal, 12)
                                  if index < library.snapshot.mostPlayedSongs.count - 1 {
                                      Divider()
                                          .padding(.leading, 112)
                                          .opacity(0.50)
                                  }
                              }
                          }
                      }
                      .padding(.horizontal, 16)
                  }
              }
          }
'''
          new_ranked = '''    private var rankedSongs: some View {
              let songs = library.snapshot.mostPlayedSongs
              return Group {
                  if songs.isEmpty {
                      ContentUnavailableView(
                          "청취 순위가 아직 없습니다",
                          systemImage: "chart.bar"
                      )
                      .padding(.top, 32)
                  } else {
                      BuFiGroupedSurface {
                          LazyVStack(spacing: 0) {
                              ForEach(songs.indices, id: \\.self) { index in
                                  let song = songs[index]
                                  HStack(spacing: 10) {
                                      Text("\\(index + 1)")
                                          .font(
                                              .system(
                                                  size: 14,
                                                  weight: index < 3 ? .bold : .medium,
                                                  design: .rounded
                                              )
                                          )
                                          .foregroundStyle(
                                              index < 3
                                                  ? BuFiTheme.accent
                                                  : Color.secondary
                                          )
                                          .monospacedDigit()
                                          .frame(width: 24, alignment: .trailing)
                                      SongRow(
                                          song: song,
                                          queue: songs,
                                          queueIndex: index,
                                          artworkSize: 52,
                                          textLineLimit: 2
                                      )
                                  }
                                  .padding(.horizontal, 12)
                                  if index < songs.count - 1 {
                                      Divider()
                                          .padding(.leading, 112)
                                          .opacity(0.50)
                                  }
                              }
                          }
                      }
                      .padding(.horizontal, 16)
                  }
              }
          }
'''
          replace_once(search, old_ranked, new_ranked, "search ranked song snapshot")

          mixes = "BuFi/UI/PersonalizedMixView.swift"
          replace_once(
              mixes,
              '''                    ForEach(Array(mix.songs.enumerated()), id: \\.offset) {
                          index, song in
                          HStack(spacing: mix.showsRanking ? 10 : 2) {
''',
              '''                    ForEach(mix.songs.indices, id: \\.self) { index in
                          let song = mix.songs[index]
                          HStack(spacing: mix.showsRanking ? 10 : 2) {
''',
              "mix song indices without allocation",
          )

          for path in [home, library, root, search, mixes]:
              text = Path(path).read_text()
              if "Task<Void, Never>?" in text and path in [home, library]:
                  raise SystemExit(f"{path}: manual presentation task handle remains")
          PY

          git diff --check

      - name: Commit view hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/UI/HomeView.swift BuFi/UI/LibraryView.swift BuFi/UI/RootView.swift BuFi/UI/SearchView.swift BuFi/UI/PersonalizedMixView.swift
          git commit -m "Harden Swift 6 view task lifetimes"
          git push origin HEAD:agent/swift-6-concurrency
