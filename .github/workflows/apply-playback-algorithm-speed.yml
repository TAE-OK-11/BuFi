name: Apply Playback Algorithm Speed

on:
  push:
    branches:
      - agent/playback-algorithm-speed
    paths:
      - .github/scripts/apply-playback-algorithm-speed.py
      - .github/workflows/apply-playback-algorithm-speed.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-playback-algorithm-speed
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/playback-algorithm-speed
          fetch-depth: 0
      - name: Apply playback algorithm patch
        run: python3 .github/scripts/apply-playback-algorithm-speed.py
      - name: Validate patch shape
        run: |
          git diff --check
          ! grep -n --fixed-strings 'upcoming.sort {' BuFi/Playback/AudioEngine.swift
          grep -n --fixed-strings 'MainActor.assumeIsolated' BuFi/Playback/AudioEngine.swift
          grep -n --fixed-strings 'fastCandidateAttemptLimit' BuFi/Playback/AudioEngine.swift
          grep -n --fixed-strings 'songs: previous.songs' BuFi/Playback/AudioEngine.swift
          grep -n --fixed-strings 'hint: activeLyricIndex' BuFi/Playback/AudioEngine.swift
      - name: Commit playback algorithm optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Playback/AudioEngine.swift BuFiTests/PlaybackPrefetchPlanTests.swift
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Optimize playback hot-path algorithms'
          git push origin HEAD:agent/playback-algorithm-speed
