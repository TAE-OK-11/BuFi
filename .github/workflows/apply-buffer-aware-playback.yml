name: Apply Buffer Aware Playback

on:
  push:
    branches:
      - agent/swift6-playback-stability
    paths:
      - .github/scripts/apply-buffer-aware-playback.py
      - .github/workflows/apply-buffer-aware-playback.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-buffer-aware-playback
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift6-playback-stability
          fetch-depth: 0
      - name: Apply buffer-aware patch
        run: python3 .github/scripts/apply-buffer-aware-playback.py
      - name: Validate patch shape
        run: |
          git diff --check
          test "$(grep -c --fixed-strings 'playImmediately(atRate: 1)' BuFi/Playback/AudioEngine.swift)" -eq 1
          grep -n --fixed-strings 'shouldForceImmediatePlayback' BuFi/Playback/AudioEngine.swift
      - name: Commit playback policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Playback/AudioEngine.swift BuFiTests/PlaybackPrefetchPlanTests.swift
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use AVPlayer buffer-aware playback starts'
          git push origin HEAD:agent/swift6-playback-stability
