name: Apply Swift 6.4 storage refactor

on:
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - Scripts/apply_swift64_storage_refactor.py
      - Scripts/run_swift64_storage_refactor.py
      - .github/workflows/apply-swift64-storage-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 0
      - name: Apply storage and cache refactor
        run: python3 Scripts/run_swift64_storage_refactor.py
      - name: Validate patch shape
        run: |
          python3 -m py_compile Scripts/apply_swift64_storage_refactor.py Scripts/run_swift64_storage_refactor.py
          git diff --check
          git grep -n 'SwiftSonic' -- 'BuFi/**/*.swift'
          grep -q 'xcodeVersion: "27.0"' project.yml
          grep -q 'Swift version 6\\.4' Scripts/verify-swift6-language-mode.sh
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Modernize storage caches for Swift 6.4'
          git push origin HEAD:agent/swift-6-concurrency
