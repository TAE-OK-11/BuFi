name: BuFi Streaming Audit One-Time Patch

on:
  push:
    branches:
      - backend-core-lightweight

permissions:
  contents: write

jobs:
  apply-streaming-audit:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: backend-core-lightweight
          fetch-depth: 1

      - name: Apply bounded streaming and network fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          audio = Path('BuFi/Playback/AudioEngine.swift')

          replace_once(
              audio,
              '''    static func shouldRetry(_ error: Error) -> Bool {
                  if error is CancellationError { return false }
                  if let openSubsonicError = error as? OpenSubsonicError,
                     case .http(let status) = openSubsonicError {
                      return status == 408 || status == 429 || (500...599).contains(status)
                  }
                  guard let urlError = error as? URLError else { return false }
                  return [
                      .timedOut,
                      .cannotFindHost,
                      .cannotConnectToHost,
                      .networkConnectionLost,
                      .dnsLookupFailed,
                      .notConnectedToInternet,
                      .internationalRoamingOff,
                      .dataNotAllowed
                  ].contains(urlError.code)
              }
''',
              '''    static func shouldRetry(_ error: Error) -> Bool {
                  if error is CancellationError { return false }
                  if let openSubsonicError = error as? OpenSubsonicError,
                     case .http(let status) = openSubsonicError {
                      return NetworkResiliencePolicy.shouldRetryHTTPStatus(status)
                  }
                  return NetworkResiliencePolicy.shouldRetry(error)
              }
''',
              'playback telemetry retry policy'
          )

          replace_once(
              audio,
              '''        if let status = httpStatusCode(in: value) {
                      if status == 408 || status == 429 || (500...599).contains(status) {
                          return .retryTransport
                      }
                      if (400...499).contains(status) {
                          return .failPermanent
                      }
                  }
''',
              '''        if let status = httpStatusCode(in: value) {
                      if NetworkResiliencePolicy.shouldRetryHTTPStatus(status) {
                          return .retryTransport
                      }
                      if status == 406 || status == 415 || status == 501 {
                          return .tryCompatibilityFormat
                      }
                      if (400...599).contains(status) {
                          return .failPermanent
                      }
                  }
''',
              'playback HTTP failure classification'
          )

          replace_once(
              audio,
              '''        if value.domain == NSURLErrorDomain {
                      let code = URLError.Code(rawValue: value.code)
                      switch code {
                      case .timedOut, .cannotFindHost, .cannotConnectToHost,
                           .dnsLookupFailed, .networkConnectionLost, .notConnectedToInternet,
                           .internationalRoamingOff, .callIsActive, .dataNotAllowed,
                           .secureConnectionFailed, .cannotLoadFromNetwork:
                          return .retryTransport
                      case .fileDoesNotExist, .resourceUnavailable:
                          return .failPermanent
                      default:
                          break
                      }
                  }
''',
              '''        if value.domain == NSURLErrorDomain {
                      if NetworkResiliencePolicy.shouldRetry(value) {
                          return .retryTransport
                      }
                      let code = URLError.Code(rawValue: value.code)
                      if (-1206 ... -1200).contains(value.code) {
                          // TLS/certificate failures cannot be healed by retrying
                          // the same stream or by transcoding the media.
                          return .failPermanent
                      }
                      switch code {
                      case .internationalRoamingOff, .callIsActive, .dataNotAllowed,
                           .fileDoesNotExist:
                          return .failPermanent
                      default:
                          break
                      }
                  }
''',
              'playback transport failure classification'
          )

          replace_once(
              audio,
              '''            // TIDAL PE treats AVPlayer's own stall-minimization wait as
                      // healthy buffering, not a failed stream.
                      if PlaybackRecoveryPolicy.isManagedBufferingWait(
                          timeControlStatus: timeControlStatus,
                          waitingReason: waitingReason
                      ) {
                          return .ignore
                      }
                      return .arm(inStartupWindow ? .startup : .stall)
''',
              '''            // Managed buffering is normal, but it still needs a bounded
                      // watchdog. The recovery task gives AVPlayer its own grace period
                      // before nudging/reloading, preventing lossless streams from
                      // remaining in waitingToPlayAtSpecifiedRate indefinitely.
                      return .arm(inStartupWindow ? .startup : .stall)
''',
              'bounded managed buffering watchdog'
          )

          replace_once(
              audio,
              '''    static let startupForwardBuffer: TimeInterval = 0
              static let remoteForwardBuffer: TimeInterval = 16
              static let localForwardBuffer: TimeInterval = 4
              static let constrainedForwardBuffer: TimeInterval = 8
              static let successorLeadIn: TimeInterval = 30
''',
              '''    // Apple documents 0 as "let AVPlayer choose", not "buffer nothing".
              // Use an explicit small startup window so high-bitrate ALAC/M4A does not
              // inherit an unexpectedly large automatic startup buffer.
              static let startupForwardBuffer: TimeInterval = 1.5
              static let remoteForwardBuffer: TimeInterval = 16
              static let localForwardBuffer: TimeInterval = 4
              static let constrainedForwardBuffer: TimeInterval = 8
              static let successorLeadIn: TimeInterval = 8
''',
              'playback buffer sizing'
          )

          replace_once(
              audio,
              '''    static func shouldPrepare(
                  elapsed: TimeInterval,
                  duration: TimeInterval,
                  isBuffering: Bool,
                  isActivelyPlaying: Bool
              ) -> Bool {
                  guard isActivelyPlaying,
                        !isBuffering,
                        elapsed.isFinite else {
                      return false
                  }
                  if elapsed >= stablePlaybackWindow {
                      return true
                  }
                  guard duration.isFinite, duration > 0 else { return false }
                  let position = min(max(0, elapsed), duration)
                  let remaining = max(0, duration - position)
                  let leadTime = min(20, max(6, duration * 0.12))
                  return remaining <= leadTime
              }

              static func shouldStage(
                  elapsed: TimeInterval,
                  duration: TimeInterval,
                  isBuffering: Bool,
                  isActivelyPlaying: Bool
              ) -> Bool {
                  guard isActivelyPlaying,
                        !isBuffering,
                        elapsed.isFinite else {
                      return false
                  }
                  if elapsed >= stablePlaybackWindow {
                      return true
                  }
                  guard duration.isFinite, duration > 0 else { return false }
                  let position = min(max(0, elapsed), duration)
                  let remaining = max(0, duration - position)
                  let leadTime = min(8, max(3, duration * 0.04))
                  return remaining <= leadTime
              }
''',
              '''    static func shouldPrepare(
                  elapsed: TimeInterval,
                  duration: TimeInterval,
                  isBuffering: Bool,
                  isActivelyPlaying: Bool
              ) -> Bool {
                  guard isActivelyPlaying,
                        !isBuffering,
                        elapsed.isFinite,
                        elapsed >= stablePlaybackWindow,
                        duration.isFinite,
                        duration > 0 else {
                      return false
                  }
                  let position = min(max(0, elapsed), duration)
                  let remaining = max(0, duration - position)
                  let leadTime = min(20, max(6, duration * 0.12))
                  return remaining <= leadTime
              }

              static func shouldStage(
                  elapsed: TimeInterval,
                  duration: TimeInterval,
                  isBuffering: Bool,
                  isActivelyPlaying: Bool
              ) -> Bool {
                  guard isActivelyPlaying,
                        !isBuffering,
                        elapsed.isFinite,
                        elapsed >= stablePlaybackWindow,
                        duration.isFinite,
                        duration > 0 else {
                      return false
                  }
                  let position = min(max(0, elapsed), duration)
                  let remaining = max(0, duration - position)
                  let leadTime = min(8, max(3, duration * 0.04))
                  return remaining <= leadTime
              }
''',
              'gapless final-window policy'
          )

          replace_once(
              audio,
              '''        if let item = player.currentItem {
                      PlaybackBufferPolicy.configure(
                          item,
                          isLocalFile: false,
                          phase: .constrained
                      )
                  }
''',
              '''        if let item = player.currentItem {
                      let isLocal = (item.asset as? AVURLAsset)?.url.isFileURL == true
                      PlaybackBufferPolicy.configure(
                          item,
                          isLocalFile: isLocal,
                          phase: .constrained
                      )
                  }
''',
              'memory pressure local-media detection'
          )

          replace_once(
              audio,
              '''    private func confirmPossibleStall() {
                  guard wantsPlayback, stallConfirmTask == nil else { return }
                  if PlaybackRecoveryPolicy.isManagedBufferingWait(
                      timeControlStatus: player.timeControlStatus,
                      waitingReason: player.reasonForWaitingToPlay
                  ) {
                      isBuffering = true
                      return
                  }
                  if player.timeControlStatus != .playing {
                      isBuffering = true
                  }
                  stallConfirmTask = Task { [weak self] in
                      do {
                          try await Task.sleep(for: PlaybackBufferPolicy.stallConfirmDelay)
                      } catch {
                          return
                      }
                      guard let self,
                            !Task.isCancelled,
                            self.wantsPlayback,
                            self.player.timeControlStatus != .playing else {
                          self?.stallConfirmTask = nil
                          return
                      }
                      if PlaybackRecoveryPolicy.isManagedBufferingWait(
                          timeControlStatus: self.player.timeControlStatus,
                          waitingReason: self.player.reasonForWaitingToPlay
                      ) {
                          self.stallConfirmTask = nil
                          return
                      }
                      self.stallConfirmTask = nil
                      self.invalidateStagedSuccessor(removeFromPlayer: true)
                      self.suspendSpeculativePrefetch()
                      self.schedulePlaybackRecovery(mode: .stall)
                  }
              }
''',
              '''    private func confirmPossibleStall() {
                  guard wantsPlayback, stallConfirmTask == nil else { return }
                  if player.timeControlStatus != .playing {
                      isBuffering = true
                  }
                  stallConfirmTask = Task { [weak self] in
                      do {
                          try await Task.sleep(for: PlaybackBufferPolicy.stallConfirmDelay)
                      } catch {
                          return
                      }
                      guard let self,
                            !Task.isCancelled,
                            self.wantsPlayback,
                            self.player.timeControlStatus != .playing else {
                          self?.stallConfirmTask = nil
                          return
                      }
                      self.stallConfirmTask = nil
                      self.invalidateStagedSuccessor(removeFromPlayer: true)
                      self.suspendSpeculativePrefetch()
                      let mode: PlaybackWatchdogMode =
                          self.currentPlayerPosition() < PlaybackWatchdogPolicy.startupArmWindow
                              ? .startup
                              : .stall
                      self.schedulePlaybackRecovery(mode: mode)
                  }
              }
''',
              'stall confirmation bounded recovery'
          )

          modern = Path('BuFi/Core/ModernNetworkPolicy.swift')
          replace_once(
              modern,
              '''    static func prepareAnalysisMediaRequest(_ request: inout URLRequest) {
                  prepareTransport(&request, assumesHTTP3Capable: false)
                  request.cachePolicy = .reloadIgnoringLocalCacheData
                  request.networkServiceType = .background
                  request.setValue(
                      "audio/*, application/octet-stream;q=0.9, */*;q=0.1",
                      forHTTPHeaderField: "Accept"
                  )
                  request.setValue("identity", forHTTPHeaderField: "Accept-Encoding")
              }

              static func prepareMediaRequest(_ request: inout URLRequest) {
''',
              '''    static func prepareAnalysisMediaRequest(_ request: inout URLRequest) {
                  prepareTransport(&request, assumesHTTP3Capable: false)
                  request.cachePolicy = .reloadIgnoringLocalCacheData
                  request.networkServiceType = .background
                  request.setValue(
                      "audio/*, application/octet-stream;q=0.9, */*;q=0.1",
                      forHTTPHeaderField: "Accept"
                  )
                  request.setValue("identity", forHTTPHeaderField: "Accept-Encoding")
              }

              /// Full-file/offline transfers share the media headers but must not
              /// compete with the active AVPlayer stream for responsive/AV bandwidth.
              static func prepareBackgroundMediaRequest(_ request: inout URLRequest) {
                  prepareTransport(&request, assumesHTTP3Capable: true)
                  request.cachePolicy = .reloadIgnoringLocalCacheData
                  request.networkServiceType = .background
                  request.setValue(
                      "audio/*, application/octet-stream;q=0.9, */*;q=0.1",
                      forHTTPHeaderField: "Accept"
                  )
                  request.setValue("identity", forHTTPHeaderField: "Accept-Encoding")
              }

              static func prepareMediaRequest(_ request: inout URLRequest) {
''',
              'background media transport policy'
          )

          offline = Path('BuFi/Core/OfflineStore.swift')
          replace_once(
              offline,
              '            ModernNetworkPolicy.prepareMediaRequest(&request)\n',
              '            ModernNetworkPolicy.prepareBackgroundMediaRequest(&request)\n',
              'offline transfer network priority'
          )

          subsonic = Path('BuFi/Core/OpenSubsonicClient.swift')
          replace_once(
              subsonic,
              '''        request.timeoutInterval = 24
                  ModernNetworkPolicy.prepareMediaRequest(&request)
''',
              '''        request.timeoutInterval = 24
                  ModernNetworkPolicy.prepareAnalysisMediaRequest(&request)
''',
              'analysis sample network priority'
          )
          PY

      - name: Verify patch shape
        run: |
          git diff --check
          git diff --stat
          grep -n "startupForwardBuffer\|successorLeadIn\|prepareBackgroundMediaRequest" BuFi/Playback/AudioEngine.swift BuFi/Core/ModernNetworkPolicy.swift

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/backend-streaming-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Playback/AudioEngine.swift BuFi/Core/ModernNetworkPolicy.swift BuFi/Core/OfflineStore.swift BuFi/Core/OpenSubsonicClient.swift
          git diff --cached --check
          git commit -m 'Harden lossless streaming and background network traffic'
          git push origin HEAD:backend-core-lightweight
