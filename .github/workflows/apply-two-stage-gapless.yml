name: Apply Two Stage Gapless

on:
  push:
    branches:
      - agent/swift6-playback-stability
    paths:
      - .github/scripts/apply-two-stage-gapless.py
      - .github/workflows/apply-two-stage-gapless.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-two-stage-gapless
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift6-playback-stability
          fetch-depth: 0
      - name: Apply two-stage gapless patch
        run: python3 .github/scripts/apply-two-stage-gapless.py
      - name: Validate patch shape
        run: |
          git diff --check
          test "$(grep -c --fixed-strings 'playImmediately(atRate: 1)' BuFi/Playback/AudioEngine.swift)" -eq 1
          grep -n --fixed-strings 'PlaybackGaplessPreparationPolicy.shouldStage' BuFi/Playback/AudioEngine.swift
          grep -n --fixed-strings 'prioritizing active stream recovery' BuFi/Playback/AudioEngine.swift
      - name: Commit gapless stability
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Playback/AudioEngine.swift BuFiTests/PlaybackPrefetchPlanTests.swift
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage gapless playback only near track end'
          git push origin HEAD:agent/swift6-playback-stability
