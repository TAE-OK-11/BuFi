name: One-shot lyric prompt and editor upgrade

on:
  push:
    branches: [agent/smarter-recommendations]
    paths: [.github/workflows/one-shot-lyric-prompt-editor.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/smarter-recommendations
      - name: Upgrade lyric prompt, schema and editor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # 1) Persist deeper semantic fields while keeping old JSON decodable.
          path = Path('BuFi/Core/LyricDetailProfile.swift')
          text = path.read_text()
          text = text.replace(
              '    var moods: [String] = []\n    var themes: [String] = []\n',
              '    var moods: [String] = []\n    var themes: [String] = []\n    var primaryMoods: [String] = []\n    var secondaryMoods: [String] = []\n'
          )
          text = text.replace(
              '    var content: String = ""\n    var setting: String = ""\n',
              '    var content: String = ""\n    var explicitContent: String = ""\n    var interpretation: String = ""\n    var emotionalArc: String = ""\n    var relationship: String = ""\n    var setting: String = ""\n'
          )
          text = text.replace(
              '        case moods, themes, energy, valence, summary, season, dayparts\n        case style, content, setting, tempo, intimacy, narrative, weather\n',
              '        case moods, themes, primaryMoods, secondaryMoods\n        case energy, valence, summary, season, dayparts\n        case style, content, explicitContent, interpretation, emotionalArc, relationship\n        case setting, tempo, intimacy, narrative, weather\n'
          )
          text = text.replace(
              '        if value.moods.isEmpty { value.moods = moods }\n        if value.themes.isEmpty { value.themes = themes }\n',
              '        if value.moods.isEmpty { value.moods = moods }\n        if value.themes.isEmpty { value.themes = themes }\n        if value.primaryMoods.isEmpty {\n            value.primaryMoods = Array(moods.prefix(3))\n        }\n        if value.secondaryMoods.isEmpty, moods.count > value.primaryMoods.count {\n            value.secondaryMoods = Array(moods.dropFirst(value.primaryMoods.count).prefix(2))\n        }\n'
          )
          text = text.replace(
              '        !season.isEmpty\n            || !dayparts.isEmpty\n            || !style.isEmpty\n            || !content.isEmpty\n            || !listenContext.isEmpty\n',
              '        !season.isEmpty\n            || !dayparts.isEmpty\n            || !style.isEmpty\n            || !content.isEmpty\n            || !explicitContent.isEmpty\n            || !interpretation.isEmpty\n            || !emotionalArc.isEmpty\n            || !relationship.isEmpty\n            || !listenContext.isEmpty\n'
          )
          old_tag = '''        [\n            moods, themes, dayparts,\n            [season, style, content, setting, narrative, weather, social, color, vocal, vocalGender, genre, language, listenContext]\n        ]\n        .flatMap { $0 }\n        .joined(separator: " ")\n'''
          new_tag = '''        [\n            primaryMoods, secondaryMoods, moods, themes, dayparts,\n            [\n                season, style, content, explicitContent, interpretation,\n                emotionalArc, relationship, setting, narrative, weather, social,\n                color, vocal, vocalGender, genre, language, listenContext\n            ]\n        ]\n        .flatMap { $0 }\n        .joined(separator: " ")\n'''
          if old_tag not in text:
              raise SystemExit('LyricDetailProfile tagBlob block not found')
          text = text.replace(old_tag, new_tag, 1)
          text = text.replace(
              '        moods = try container.decodeIfPresent([String].self, forKey: .moods) ?? []\n        themes = try container.decodeIfPresent([String].self, forKey: .themes) ?? []\n',
              '        moods = try container.decodeIfPresent([String].self, forKey: .moods) ?? []\n        themes = try container.decodeIfPresent([String].self, forKey: .themes) ?? []\n        primaryMoods = try container.decodeIfPresent([String].self, forKey: .primaryMoods)\n            ?? Array(moods.prefix(3))\n        secondaryMoods = try container.decodeIfPresent([String].self, forKey: .secondaryMoods)\n            ?? Array(moods.dropFirst(primaryMoods.count).prefix(2))\n'
          )
          text = text.replace(
              '        content = try container.decodeIfPresent(String.self, forKey: .content) ?? ""\n        setting = try container.decodeIfPresent(String.self, forKey: .setting) ?? ""\n',
              '        content = try container.decodeIfPresent(String.self, forKey: .content) ?? ""\n        explicitContent = try container.decodeIfPresent(String.self, forKey: .explicitContent) ?? ""\n        interpretation = try container.decodeIfPresent(String.self, forKey: .interpretation) ?? ""\n        emotionalArc = try container.decodeIfPresent(String.self, forKey: .emotionalArc) ?? ""\n        relationship = try container.decodeIfPresent(String.self, forKey: .relationship) ?? ""\n        setting = try container.decodeIfPresent(String.self, forKey: .setting) ?? ""\n'
          )
          path.write_text(text)

          # 2) Refine GPT-OSS 120B extraction without bloating the smaller-model prompts.
          path = Path('BuFi/Core/LyricModelFamily.swift')
          text = path.read_text()
          pattern = re.compile(r'''        case \.gptOSS:\n            return """\n.*?\n            """\n        case \.generic:''', re.S)
          replacement = '''        case .gptOSS:\n            return """\n            Role: senior lyric analyst for a music recommender. Read the excerpt as one narrative, then return exactly one JSON object and nothing else.\n            {"primaryMoods":[],"secondaryMoods":[],"themes":[],"energy":0.0,"valence":0.0,"emotion":0.0,"summary":"","explicitContent":"","interpretation":"","emotionalArc":"","relationship":"","season":"","dayparts":[],"content":"","setting":"","narrative":"","social":"","language":"","context":"","style":"","tempo":0.0,"intimacy":0.0,"weather":"","color":"","vocal":"","vocalGender":"","genre":""}\n            primaryMoods: 1-3 emotions that define the narrator's core state. secondaryMoods: 0-2 real but less central emotions. Rank both by importance; prefer precise labels such as yearning, resentful, obsessive, nostalgic, anxious, euphoric over generic sad/happy/angry when the lyrics support them.\n            themes are recurring ideas or conflicts, not duplicate mood words. energy=lyrical intensity, valence=emotional positivity, emotion=emotional intensity, tempo=narrative pace. These describe the words, never the recording.\n            explicitContent contains only events, situations or desires directly stated or strongly evidenced by the lyrics. interpretation is the higher-level meaning inferred from that evidence. emotionalArc describes how the narrator's state changes from beginning to end. relationship names the relationship only when supported.\n            summary: 2-4 concise sentences that paraphrase the speaker, desire/conflict, important turn and ending. Do not quote or reproduce lyric lines. Do not call the narrator the artist. Distinguish fantasies, threats, irony, metaphor and hyperbole from literal actions when the text does.\n            Never invent biography, production, instrumentation, genre, singer identity or vocal gender. Leave audio-only fields vocal/vocalGender/genre empty unless explicitly stated in the words. Leave season/daypart/weather/setting empty when unsupported.\n            Lyrics:\n            \\(body)\n            """\n        case .generic:'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'GPT-OSS prompt replacement count={count}')
          path.write_text(text)

          # 3) Parse the deeper schema, mark manual corrections, and persist user edits.
          path = Path('BuFi/Core/LyricIntelligence.swift')
          text = path.read_text()

          old_source = '''    var sourceTitle: String {\n        switch source {\n        case "apple-intelligence-tagging+default":\n            String(localized: "Apple Intelligence (태깅+기본)")\n        case "apple-intelligence-tagging":\n            String(localized: "Apple Intelligence (태깅)")\n        case "apple-intelligence":\n            String(localized: "Apple Intelligence")\n        case "apple-privacy-cloud":\n            String(localized: "Apple Privacy Cloud")\n        case "apple-intelligence-3b":\n            String(localized: "Apple Intelligence 3B (로컬)")\n        case "gemma-3-270m":\n            "Gemma 3 270M"\n        case "openai":\n            "OpenAI"\n        case "openrouter":\n            "OpenRouter"\n        case "groq":\n            "Groq"\n        case "cerebras":\n            "Cerebras"\n        case "lexical":\n            String(localized: "이전 로컬 결과 (LLM 재분석 필요)")\n        default:\n            source\n        }\n    }\n'''
          new_source = '''    var sourceTitle: String {\n        let manualPrefix = "manual:"\n        if source.hasPrefix(manualPrefix) {\n            let original = String(source.dropFirst(manualPrefix.count))\n            let originalTitle = Self.displaySourceTitle(original)\n            return originalTitle.isEmpty\n                ? String(localized: "사용자 수정")\n                : String(localized: "사용자 수정") + " · " + originalTitle\n        }\n        return Self.displaySourceTitle(source)\n    }\n\n    private static func displaySourceTitle(_ raw: String) -> String {\n        switch raw {\n        case "apple-intelligence-tagging+default":\n            String(localized: "Apple Intelligence (태깅+기본)")\n        case "apple-intelligence-tagging":\n            String(localized: "Apple Intelligence (태깅)")\n        case "apple-intelligence":\n            String(localized: "Apple Intelligence")\n        case "apple-privacy-cloud":\n            String(localized: "Apple Privacy Cloud")\n        case "apple-intelligence-3b":\n            String(localized: "Apple Intelligence 3B (로컬)")\n        case "gemma-3-270m":\n            "Gemma 3 270M"\n        case "openai":\n            "OpenAI"\n        case "openrouter":\n            "OpenRouter"\n        case "groq":\n            "Groq"\n        case "cerebras":\n            "Cerebras"\n        case "manual":\n            String(localized: "사용자 수정")\n        case "lexical":\n            String(localized: "이전 로컬 결과 (LLM 재분석 필요)")\n        default:\n            raw\n        }\n    }\n'''
          if old_source not in text:
              raise SystemExit('sourceTitle block not found')
          text = text.replace(old_source, new_source, 1)

          parse_pattern = re.compile(r'''    static func parse\(_ raw: String\) -> ParsedLyricAnalysis\? \{.*?\n    private static func token\(_ value: Any\?\) -> String \{''', re.S)
          new_parse = '''    static func parse(_ raw: String) -> ParsedLyricAnalysis? {\n        let trimmed = raw.trimmingCharacters(in: .whitespacesAndNewlines)\n        let json = extractJSONObject(from: trimmed) ?? trimmed\n        guard let data = json.data(using: .utf8),\n              let object = try? JSONSerialization.jsonObject(with: data),\n              let dictionary = object as? [String: Any] else {\n            return nil\n        }\n\n        let primaryMoods = normalizedTags(\n            dictionary["primaryMoods"] ?? dictionary["primary_moods"],\n            limit: 3\n        )\n        let secondaryMoods = normalizedTags(\n            dictionary["secondaryMoods"] ?? dictionary["secondary_moods"],\n            limit: 2\n        )\n        let legacyMoods = normalizedTags(dictionary["moods"], limit: 5)\n        let moods = uniqueTags(primaryMoods + secondaryMoods + legacyMoods, limit: 5)\n        let themes = uniqueTags(stringList(dictionary["themes"]), limit: 5)\n        let energy = numeric(dictionary["energy"]) ?? 0.5\n        let valence = numeric(dictionary["valence"]) ?? 0.5\n        let summary = normalizedSummary(dictionary["summary"] as? String ?? "")\n        if moods.isEmpty,\n           dictionary["energy"] == nil,\n           dictionary["valence"] == nil,\n           summary.isEmpty,\n           dictionary["season"] == nil,\n           dictionary["style"] == nil {\n            return nil\n        }\n        var parsed = ParsedLyricAnalysis(\n            moods: moods,\n            themes: themes,\n            energy: min(max(energy, 0), 1),\n            valence: min(max(valence, 0), 1),\n            summary: summary\n        )\n        var details = LyricDetailProfile(\n            moods: moods,\n            themes: themes,\n            energy: min(max(energy, 0), 1),\n            valence: min(max(valence, 0), 1),\n            summary: summary,\n            season: token(dictionary["season"]),\n            dayparts: normalizedTags(dictionary["dayparts"], limit: 4),\n            style: token(dictionary["style"]),\n            content: clipped(dictionary["content"] as? String, 160),\n            setting: token(dictionary["setting"]),\n            tempo: min(max(numeric(dictionary["tempo"]) ?? 0.5, 0), 1),\n            intimacy: min(max(numeric(dictionary["intimacy"]) ?? 0.5, 0), 1),\n            narrative: token(dictionary["narrative"]),\n            weather: token(dictionary["weather"]),\n            social: token(dictionary["social"]),\n            color: token(dictionary["color"]),\n            vocal: token(dictionary["vocal"]),\n            vocalGender: token(dictionary["vocalGender"] ?? dictionary["vocal_gender"]),\n            genre: token(dictionary["genre"]),\n            language: token(dictionary["language"]),\n            emotionIntensity: min(max(numeric(dictionary["emotion"]) ?? 0.5, 0), 1),\n            listenContext: token(dictionary["context"])\n        )\n        details.primaryMoods = primaryMoods.isEmpty ? Array(moods.prefix(3)) : primaryMoods\n        details.secondaryMoods = secondaryMoods.isEmpty\n            ? Array(moods.dropFirst(details.primaryMoods.count).prefix(2))\n            : secondaryMoods\n        details.explicitContent = clipped(\n            dictionary["explicitContent"] as? String\n                ?? dictionary["explicit_content"] as? String,\n            320\n        )\n        details.interpretation = clipped(dictionary["interpretation"] as? String, 420)\n        details.emotionalArc = clipped(\n            dictionary["emotionalArc"] as? String\n                ?? dictionary["emotional_arc"] as? String,\n            320\n        )\n        details.relationship = clipped(dictionary["relationship"] as? String, 80)\n        parsed.details = details\n        return parsed\n    }\n\n    private static func normalizedTags(_ value: Any?, limit: Int) -> [String] {\n        uniqueTags(\n            stringList(value).map { LyricLexicalEmbedding.normalized($0) },\n            limit: limit\n        )\n    }\n\n    private static func uniqueTags(_ values: [String], limit: Int) -> [String] {\n        var seen = Set<String>()\n        var result: [String] = []\n        for value in values {\n            let trimmed = value.trimmingCharacters(in: .whitespacesAndNewlines)\n            guard !trimmed.isEmpty else { continue }\n            let key = LyricLexicalEmbedding.normalized(trimmed)\n            guard seen.insert(key).inserted else { continue }\n            result.append(trimmed)\n            if result.count >= limit { break }\n        }\n        return result\n    }\n\n    private static func token(_ value: Any?) -> String {'''
          text, count = parse_pattern.subn(new_parse, text, count=1)
          if count != 1:
              raise SystemExit(f'parse replacement count={count}')

          anchor = '''    func signature(for songID: String) async -> LyricSignature? {\n        await loadIfNeeded()\n        return signatures[songID]\n    }\n\n'''
          method = '''    func signature(for songID: String) async -> LyricSignature? {\n        await loadIfNeeded()\n        return signatures[songID]\n    }\n\n    func saveManualEdit(\n        song: Song,\n        lyrics: String,\n        accountScope: String,\n        moods: [String],\n        themes: [String],\n        energy: Double,\n        valence: Double,\n        summary: String,\n        details: LyricDetailProfile\n    ) async -> LyricSignature? {\n        await activate(accountScope: accountScope)\n        guard var current = signatures[song.id], current.hasStoredLyricAnalysis else {\n            return nil\n        }\n        let cleanedMoods = Array(moods.prefix(5)).map {\n            LyricLexicalEmbedding.normalized(\n                $0.trimmingCharacters(in: .whitespacesAndNewlines)\n            )\n        }.filter { !$0.isEmpty }\n        let cleanedThemes = Array(themes.prefix(5)).map {\n            $0.trimmingCharacters(in: .whitespacesAndNewlines)\n        }.filter { !$0.isEmpty }\n        let cleanSummary = summary.trimmingCharacters(in: .whitespacesAndNewlines)\n        let baseSource = current.source.hasPrefix("manual:")\n            ? String(current.source.dropFirst("manual:".count))\n            : current.source\n\n        current.lyricsHash = LyricLexicalEmbedding.hash(lyrics)\n        current.moods = cleanedMoods\n        current.themes = cleanedThemes\n        current.energy = min(max(energy, 0), 1)\n        current.valence = min(max(valence, 0), 1)\n        current.summary = cleanSummary\n        current.source = "manual:" + baseSource\n        if current.embedding.count == LyricLexicalEmbedding.dimensions {\n            current.embedding = LyricLexicalEmbedding.merge(\n                moods: cleanedMoods,\n                energy: current.energy,\n                valence: current.valence,\n                lyrics: lyrics\n            )\n        }\n        var revisedDetails = details\n        revisedDetails.moods = cleanedMoods\n        revisedDetails.themes = cleanedThemes\n        revisedDetails.energy = current.energy\n        revisedDetails.valence = current.valence\n        revisedDetails.summary = cleanSummary\n        if revisedDetails.primaryMoods.isEmpty {\n            revisedDetails.primaryMoods = Array(cleanedMoods.prefix(3))\n        }\n        current.details = revisedDetails\n        signatures[song.id] = current\n        await persist(current)\n        return current\n    }\n\n'''
          if anchor not in text:
              raise SystemExit('signature anchor not found')
          text = text.replace(anchor, method, 1)
          path.write_text(text)

          # 4) Add current-track analysis viewer/editor to the real-device test section.
          path = Path('BuFi/UI/SettingsView.swift')
          text = path.read_text()
          text = text.replace(
              '    @State private var currentSignature: LyricSignature?\n    @State private var probe: LyricIntelligenceProbe?\n',
              '    @State private var currentSignature: LyricSignature?\n    @State private var showCurrentAnalysisEditor = false\n    @State private var probe: LyricIntelligenceProbe?\n'
          )

          sheet_anchor = '''        .confirmationDialog(\n            "기존 분석을 모두 지우고 새로 분석할까요?",\n            isPresented: $confirmFullLyricReanalysis,\n            titleVisibility: .visible\n        ) {\n            Button("모두 지우고 새로 분석", role: .destructive) {\n                startFullLyricReanalysis()\n            }\n            Button("취소", role: .cancel) {}\n        } message: {\n            Text("저장된 가사 요약·분위기·임베딩·음향 분석을 초기화하고 현재 라이브러리를 선택한 엔진으로 처음부터 다시 분석합니다. 원격 엔진은 API 사용량이 발생할 수 있습니다.")\n        }\n'''
          sheet_new = sheet_anchor + '''        .sheet(isPresented: $showCurrentAnalysisEditor) {\n            if let song = playbackState.currentSong {\n                CurrentLyricAnalysisEditor(\n                    song: song,\n                    signature: currentSignature,\n                    onSave: { draft in\n                        await saveCurrentAnalysisEdit(draft)\n                    },\n                    onReanalyze: {\n                        await reanalyzeCurrentSong()\n                    }\n                )\n            } else {\n                ContentUnavailableView(\n                    "재생 중인 곡 없음",\n                    systemImage: "music.note",\n                    description: Text("곡을 재생한 뒤 다시 열어주세요.")\n                )\n            }\n        }\n'''
          if sheet_anchor not in text:
              raise SystemExit('sheet anchor not found')
          text = text.replace(sheet_anchor, sheet_new, 1)

          test_button_anchor = '''            if let probe {\n                settingsDescription(probeResultText(probe))\n            }\n            Button(isProbing ? "분석 중…" : "샘플 가사로 시험") {\n'''
          test_button_new = '''            if let probe {\n                settingsDescription(probeResultText(probe))\n            }\n            Button("현재 재생곡 분석 데이터") {\n                showCurrentAnalysisEditor = true\n            }\n            .buttonStyle(SettingsActionButtonStyle())\n            .disabled(playbackState.currentSong == nil)\n            Button(isProbing ? "분석 중…" : "샘플 가사로 시험") {\n'''
          if test_button_anchor not in text:
              raise SystemExit('test button anchor not found')
          text = text.replace(test_button_anchor, test_button_new, 1)

          old_reanalyze = '''    private func startCurrentSongReanalysis() {\n        batchTask?.cancel()\n        batchTask = Task {\n            guard let song = playbackState.currentSong,\n                  let client = model.client else {\n                return\n            }\n            let lyrics = await Self.lyricsText(for: song, client: client)\n            guard lyrics.count >= 24 else { return }\n            await LyricIntelligence.shared.reanalyze(\n                song: song,\n                lyrics: lyrics,\n                accountScope: client.accountScope\n            )\n            if let fileURL = await SoundAnalysisSample.resolve(\n                for: song,\n                client: client\n            ) {\n                await LyricIntelligence.shared.scheduleSoundAnalysis(\n                    song: song,\n                    fileURL: fileURL,\n                    audioRevision: song.audioResourceRevision.isEmpty\n                        ? song.id\n                        : song.audioResourceRevision,\n                    accountScope: client.accountScope\n                )\n            }\n            await refreshCoverage()\n            currentSignature = await currentSongSignature()\n            model.rebuildRecommendations()\n        }\n    }\n'''
          new_reanalyze = '''    private func startCurrentSongReanalysis() {\n        batchTask?.cancel()\n        batchTask = Task {\n            _ = await reanalyzeCurrentSong()\n        }\n    }\n\n    private func reanalyzeCurrentSong() async -> LyricSignature? {\n        guard let song = playbackState.currentSong,\n              let client = model.client else {\n            return nil\n        }\n        let lyrics = await Self.lyricsText(for: song, client: client)\n        guard lyrics.count >= 24 else { return nil }\n        await LyricIntelligence.shared.reanalyze(\n            song: song,\n            lyrics: lyrics,\n            accountScope: client.accountScope\n        )\n        if let fileURL = await SoundAnalysisSample.resolve(\n            for: song,\n            client: client\n        ) {\n            await LyricIntelligence.shared.scheduleSoundAnalysis(\n                song: song,\n                fileURL: fileURL,\n                audioRevision: song.audioResourceRevision.isEmpty\n                    ? song.id\n                    : song.audioResourceRevision,\n                accountScope: client.accountScope\n            )\n        }\n        await refreshCoverage()\n        currentSignature = await currentSongSignature()\n        model.rebuildRecommendations()\n        return currentSignature\n    }\n\n    private func saveCurrentAnalysisEdit(\n        _ draft: LyricAnalysisEditDraft\n    ) async -> LyricSignature? {\n        guard let song = playbackState.currentSong,\n              let client = model.client,\n              let currentSignature else {\n            return nil\n        }\n        let lyrics = await Self.lyricsText(for: song, client: client)\n        guard lyrics.count >= 24 else { return nil }\n        let updated = await LyricIntelligence.shared.saveManualEdit(\n            song: song,\n            lyrics: lyrics,\n            accountScope: client.accountScope,\n            moods: draft.combinedMoods,\n            themes: draft.themeTags,\n            energy: draft.energy,\n            valence: draft.valence,\n            summary: draft.summary,\n            details: draft.makeDetails(base: currentSignature.details)\n        )\n        if let updated {\n            self.currentSignature = updated\n            await refreshCoverage()\n            model.rebuildRecommendations()\n        }\n        return updated\n    }\n'''
          if old_reanalyze not in text:
              raise SystemExit('reanalyze block not found')
          text = text.replace(old_reanalyze, new_reanalyze, 1)

          old_now = '''        if !signature.moods.isEmpty {\n            parts.append(String(localized: "분위기: \\(signature.moods.joined(separator: ", "))"))\n        }\n        if signature.hasStoredSummary {\n'''
          new_now = '''        if !signature.details.primaryMoods.isEmpty {\n            parts.append(\n                String(localized: "핵심 분위기: \\(signature.details.primaryMoods.joined(separator: ", "))")\n            )\n        } else if !signature.moods.isEmpty {\n            parts.append(String(localized: "분위기: \\(signature.moods.joined(separator: ", "))"))\n        }\n        if !signature.details.secondaryMoods.isEmpty {\n            parts.append(\n                String(localized: "보조 분위기: \\(signature.details.secondaryMoods.joined(separator: ", "))")\n            )\n        }\n        if !signature.themes.isEmpty {\n            parts.append(String(localized: "테마: \\(signature.themes.joined(separator: ", "))"))\n        }\n        if !signature.details.emotionalArc.isEmpty {\n            parts.append(String(localized: "감정 흐름: \\(signature.details.emotionalArc)"))\n        }\n        if signature.hasStoredSummary {\n'''
          if old_now not in text:
              raise SystemExit('now-playing analysis block not found')
          text = text.replace(old_now, new_now, 1)

          editor_marker = '\nprivate struct OpenSourceNoticesView: View {'
          if editor_marker not in text:
              raise SystemExit('editor insertion marker not found')
          editor_code = r'''

private struct LyricAnalysisEditDraft {
    var primaryMoods: String
    var secondaryMoods: String
    var themes: String
    var energy: Double
    var valence: Double
    var emotionIntensity: Double
    var summary: String
    var explicitContent: String
    var interpretation: String
    var emotionalArc: String
    var relationship: String
    var content: String
    var narrative: String
    var setting: String
    var social: String
    var season: String
    var dayparts: String
    var listenContext: String

    init(signature: LyricSignature?) {
        let details = signature?.details ?? .empty
        let allMoods = signature?.moods ?? []
        let primary = details.primaryMoods.isEmpty
            ? Array(allMoods.prefix(3))
            : details.primaryMoods
        let secondary = details.secondaryMoods.isEmpty
            ? Array(allMoods.dropFirst(primary.count).prefix(2))
            : details.secondaryMoods
        primaryMoods = primary.joined(separator: ", ")
        secondaryMoods = secondary.joined(separator: ", ")
        themes = (signature?.themes ?? details.themes).joined(separator: ", ")
        energy = signature?.energy ?? details.energy
        valence = signature?.valence ?? details.valence
        emotionIntensity = details.emotionIntensity
        summary = signature?.summary ?? details.summary
        explicitContent = details.explicitContent
        interpretation = details.interpretation
        emotionalArc = details.emotionalArc
        relationship = details.relationship
        content = details.content
        narrative = details.narrative
        setting = details.setting
        social = details.social
        season = details.season
        dayparts = details.dayparts.joined(separator: ", ")
        listenContext = details.listenContext
    }

    var combinedMoods: [String] {
        Self.tags(primaryMoods, limit: 3) + Self.tags(secondaryMoods, limit: 2)
    }

    var themeTags: [String] {
        Self.tags(themes, limit: 5)
    }

    func makeDetails(base: LyricDetailProfile) -> LyricDetailProfile {
        var details = base
        details.primaryMoods = Self.tags(primaryMoods, limit: 3)
        details.secondaryMoods = Self.tags(secondaryMoods, limit: 2)
        details.moods = combinedMoods
        details.themes = themeTags
        details.energy = energy
        details.valence = valence
        details.emotionIntensity = emotionIntensity
        details.summary = summary.trimmingCharacters(in: .whitespacesAndNewlines)
        details.explicitContent = explicitContent.trimmingCharacters(in: .whitespacesAndNewlines)
        details.interpretation = interpretation.trimmingCharacters(in: .whitespacesAndNewlines)
        details.emotionalArc = emotionalArc.trimmingCharacters(in: .whitespacesAndNewlines)
        details.relationship = relationship.trimmingCharacters(in: .whitespacesAndNewlines)
        details.content = content.trimmingCharacters(in: .whitespacesAndNewlines)
        details.narrative = narrative.trimmingCharacters(in: .whitespacesAndNewlines)
        details.setting = setting.trimmingCharacters(in: .whitespacesAndNewlines)
        details.social = social.trimmingCharacters(in: .whitespacesAndNewlines)
        details.season = season.trimmingCharacters(in: .whitespacesAndNewlines)
        details.dayparts = Self.tags(dayparts, limit: 4)
        details.listenContext = listenContext.trimmingCharacters(in: .whitespacesAndNewlines)
        return details
    }

    private static func tags(_ raw: String, limit: Int) -> [String] {
        var seen = Set<String>()
        var result: [String] = []
        for piece in raw.split(separator: ",") {
            let value = piece.trimmingCharacters(in: .whitespacesAndNewlines)
            guard !value.isEmpty else { continue }
            let key = LyricLexicalEmbedding.normalized(value)
            guard seen.insert(key).inserted else { continue }
            result.append(value)
            if result.count >= limit { break }
        }
        return result
    }
}

private struct CurrentLyricAnalysisEditor: View {
    @Environment(\.dismiss) private var dismiss
    let song: Song
    let signature: LyricSignature?
    let onSave: (LyricAnalysisEditDraft) async -> LyricSignature?
    let onReanalyze: () async -> LyricSignature?

    @State private var draft: LyricAnalysisEditDraft
    @State private var isSaving = false
    @State private var isReanalyzing = false
    @State private var statusMessage = ""

    init(
        song: Song,
        signature: LyricSignature?,
        onSave: @escaping (LyricAnalysisEditDraft) async -> LyricSignature?,
        onReanalyze: @escaping () async -> LyricSignature?
    ) {
        self.song = song
        self.signature = signature
        self.onSave = onSave
        self.onReanalyze = onReanalyze
        _draft = State(initialValue: LyricAnalysisEditDraft(signature: signature))
    }

    var body: some View {
        NavigationStack {
            ScrollView {
                VStack(alignment: .leading, spacing: 18) {
                    VStack(alignment: .leading, spacing: 5) {
                        Text(song.title)
                            .font(.system(size: 24, weight: .bold))
                        Text(song.artist)
                            .foregroundStyle(.secondary)
                        Text("엔진: \(signature?.sourceTitle ?? String(localized: "분석 없음"))")
                            .font(.system(size: 13, weight: .semibold))
                            .foregroundStyle(.secondary)
                    }

                    if signature == nil {
                        Text("저장된 LLM 분석이 없습니다. 아래 ‘현재 엔진으로 다시 분석’을 눌러 새 분석을 만들 수 있습니다.")
                            .font(.system(size: 13))
                            .foregroundStyle(.secondary)
                    } else {
                        editorField("핵심 분위기", text: $draft.primaryMoods, prompt: "yearning, obsessive, melancholic")
                        editorField("보조 분위기", text: $draft.secondaryMoods, prompt: "resentful, anxious")
                        editorField("테마", text: $draft.themes, prompt: "lost relationship, memory")

                        metricSlider("가사 에너지", value: $draft.energy)
                        metricSlider("감정 긍정도", value: $draft.valence)
                        metricSlider("감정 강도", value: $draft.emotionIntensity)

                        editorTextArea("요약", text: $draft.summary, minHeight: 120)
                        editorTextArea("가사에 직접 드러난 내용", text: $draft.explicitContent)
                        editorTextArea("AI 해석", text: $draft.interpretation)
                        editorTextArea("감정 흐름", text: $draft.emotionalArc)
                        editorField("관계", text: $draft.relationship, prompt: "former lovers")

                        DisclosureGroup("세부 데이터") {
                            VStack(alignment: .leading, spacing: 12) {
                                editorField("내용 태그", text: $draft.content, prompt: "longing")
                                editorField("서사", text: $draft.narrative, prompt: "first-person recollection")
                                editorField("장소", text: $draft.setting, prompt: "city")
                                editorField("사회적 상태", text: $draft.social, prompt: "alone")
                                editorField("계절", text: $draft.season, prompt: "winter")
                                editorField("시간대", text: $draft.dayparts, prompt: "night, evening")
                                editorField("추천 상황", text: $draft.listenContext, prompt: "late night")
                            }
                            .padding(.top, 10)
                        }

                        if let signature, signature.hasStoredSoundAnalysis {
                            VStack(alignment: .leading, spacing: 4) {
                                Text("음향 분석 · 읽기 전용")
                                    .font(.system(size: 14, weight: .semibold))
                                Text(signature.soundLabels.joined(separator: ", "))
                                    .font(.system(size: 12.5))
                                    .foregroundStyle(.secondary)
                            }
                        }

                        Button(isSaving ? "저장 중…" : "수정 내용 저장") {
                            Task { @MainActor in
                                isSaving = true
                                defer { isSaving = false }
                                if let updated = await onSave(draft) {
                                    draft = LyricAnalysisEditDraft(signature: updated)
                                    statusMessage = String(localized: "수정한 분석을 저장하고 추천에 반영했습니다.")
                                } else {
                                    statusMessage = String(localized: "수정 내용을 저장하지 못했습니다.")
                                }
                            }
                        }
                        .buttonStyle(SettingsActionButtonStyle())
                        .disabled(isSaving || isReanalyzing)
                    }

                    Button(isReanalyzing ? "다시 분석 중…" : "현재 엔진으로 다시 분석") {
                        Task { @MainActor in
                            isReanalyzing = true
                            defer { isReanalyzing = false }
                            if let updated = await onReanalyze() {
                                draft = LyricAnalysisEditDraft(signature: updated)
                                statusMessage = String(localized: "새 LLM 분석으로 교체했습니다.")
                            } else {
                                statusMessage = String(localized: "LLM 분석에 실패했습니다. 기존 데이터는 유지됩니다.")
                            }
                        }
                    }
                    .buttonStyle(SettingsActionButtonStyle())
                    .disabled(isSaving || isReanalyzing)

                    if !statusMessage.isEmpty {
                        Text(statusMessage)
                            .font(.system(size: 12.5))
                            .foregroundStyle(.secondary)
                    }
                }
                .padding(18)
            }
            .background(BuFiScreenBackground())
            .navigationTitle("현재 곡 분석 데이터")
            .navigationBarTitleDisplayMode(.inline)
            .toolbar {
                ToolbarItem(placement: .topBarTrailing) {
                    Button("완료") { dismiss() }
                }
            }
        }
        .presentationDetents([.large])
    }

    private func editorField(
        _ title: LocalizedStringKey,
        text: Binding<String>,
        prompt: String
    ) -> some View {
        VStack(alignment: .leading, spacing: 6) {
            Text(title)
                .font(.system(size: 14, weight: .semibold))
            TextField(prompt, text: text)
                .settingsTextField()
        }
    }

    private func editorTextArea(
        _ title: LocalizedStringKey,
        text: Binding<String>,
        minHeight: CGFloat = 86
    ) -> some View {
        VStack(alignment: .leading, spacing: 6) {
            Text(title)
                .font(.system(size: 14, weight: .semibold))
            TextEditor(text: text)
                .font(.system(size: 14))
                .frame(minHeight: minHeight)
                .padding(10)
                .background(
                    Color.primary.opacity(0.055),
                    in: RoundedRectangle(cornerRadius: 14, style: .continuous)
                )
                .overlay {
                    RoundedRectangle(cornerRadius: 14, style: .continuous)
                        .stroke(BuFiTheme.separator.opacity(0.30), lineWidth: 0.7)
                }
        }
    }

    private func metricSlider(
        _ title: LocalizedStringKey,
        value: Binding<Double>
    ) -> some View {
        VStack(alignment: .leading, spacing: 6) {
            HStack {
                Text(title)
                    .font(.system(size: 14, weight: .semibold))
                Spacer()
                Text(value.wrappedValue, format: .percent.precision(.fractionLength(0)))
                    .foregroundStyle(.secondary)
                    .monospacedDigit()
            }
            Slider(value: value, in: 0...1, step: 0.05)
                .tint(BuFiTheme.accent)
        }
    }
}
