name: BuFi Streaming Audit PR Patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-streaming-audit:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: backend-core-lightweight
          fetch-depth: 1

      - name: Reuse the audited patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/backend-streaming-audit-once.yml').read_text().splitlines()
          start = source.index("          python3 - <<'PY'") + 1
          end = source.index("          PY", start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/bufi_streaming_patch.py').write_text(script)
          PY
          python3 /tmp/bufi_streaming_patch.py

      - name: Verify and commit audited fixes
        run: |
          git diff --check
          grep -n "startupForwardBuffer\|successorLeadIn\|prepareBackgroundMediaRequest" BuFi/Playback/AudioEngine.swift BuFi/Core/ModernNetworkPolicy.swift
          git rm .github/workflows/backend-streaming-audit-once.yml .github/workflows/backend-streaming-audit-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Playback/AudioEngine.swift BuFi/Core/ModernNetworkPolicy.swift BuFi/Core/OfflineStore.swift BuFi/Core/OpenSubsonicClient.swift
          git diff --cached --check
          git commit -m 'Harden lossless streaming and background network traffic'
          git push origin HEAD:backend-core-lightweight
