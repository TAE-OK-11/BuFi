name: Apply Managed Buffering Grace

on:
  push:
    branches:
      - agent/swift6-playback-stability
    paths:
      - .github/scripts/apply-managed-buffering-grace.py
      - .github/workflows/apply-managed-buffering-grace.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-managed-buffering-grace
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift6-playback-stability
          fetch-depth: 0
      - name: Apply managed buffering grace
        run: python3 .github/scripts/apply-managed-buffering-grace.py
      - name: Validate patch shape
        run: |
          git diff --check
          test "$(grep -c --fixed-strings 'playImmediately(atRate: 1)' BuFi/Playback/AudioEngine.swift)" -eq 1
          grep -n --fixed-strings 'isManagedBufferingWait' BuFi/Playback/AudioEngine.swift
          grep -n --fixed-strings 'try await Task.sleep(for: .seconds(4))' BuFi/Playback/AudioEngine.swift
      - name: Commit buffering grace
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Playback/AudioEngine.swift BuFiTests/PlaybackPrefetchPlanTests.swift
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Respect AVPlayer managed buffering grace'
          git push origin HEAD:agent/swift6-playback-stability
