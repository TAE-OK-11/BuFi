name: Roll back player artwork UI once

on:
  push:
    branches:
      - fix/player-artwork-reopen-position

permissions:
  contents: write

jobs:
  rollback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-artwork-reopen-position
          fetch-depth: 0

      - name: Restore previous player artwork presentation
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- BuFi/UI/PlayerView.swift BuFi/UI/RootView.swift
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/UI/PlayerView.swift BuFi/UI/RootView.swift
          git commit -m "Restore previous player artwork presentation"
          git push origin HEAD:fix/player-artwork-reopen-position
