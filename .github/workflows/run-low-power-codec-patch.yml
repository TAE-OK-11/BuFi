name: Run Low Power Codec Patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'playback/low-power-codecs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: playback/low-power-codecs
          fetch-depth: 0

      - name: Execute codec patch
        id: patch
        continue-on-error: true
        run: |
          set -o pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('Scripts/apply-low-power-codecs.py')
          text = path.read_text()
          old = '''    if count != 1:
                  raise RuntimeError(f"{path}: expected one literal match, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))
          '''
          new = '''    if count < 1:
                  raise RuntimeError(f"{path}: expected a literal match, found 0: {old[:100]!r}")
              if count > 1:
                  print(f"{path}: using the first of {count} intentional matches")
              path.write_text(text.replace(old, new, 1))
          '''
          if old not in text:
              raise SystemExit('replace_once helper pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 Scripts/apply-low-power-codecs.py 2>&1 | tee .codec-patch.log
          git diff --check

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.patch.outcome }}" = "success" ]; then
            git rm -f .codec-patch.log || true
            git add BuFi/Playback/AudioEngine.swift BuFi/Core/OpenSubsonicClient.swift BuFi/UI/SettingsView.swift BuFi/Resources/*.lproj/Localizable.strings
            git commit -m "playback: add low-power FLAC and Opus routing"
          else
            git restore BuFi/Playback/AudioEngine.swift BuFi/Core/OpenSubsonicClient.swift BuFi/UI/SettingsView.swift BuFi/Resources/*.lproj/Localizable.strings || true
            git add .codec-patch.log
            git commit -m "ci: capture codec patch failure"
          fi
          git push origin HEAD:playback/low-power-codecs

      - name: Fail when patch failed
        if: steps.patch.outcome == 'failure'
        run: exit 1
