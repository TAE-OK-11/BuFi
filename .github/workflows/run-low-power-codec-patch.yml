name: Run Low Power Codec Patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'playback/low-power-codecs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: playback/low-power-codecs
          fetch-depth: 0

      - name: Execute embedded patch
        id: patch
        continue-on-error: true
        run: |
          set -o pipefail
          python3 <<'PY' 2>&1 | tee .codec-patch.log
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-low-power-codecs.yml').read_text()
          marker = "python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'low-power-codec-patch.py', 'exec'), {})
          PY
          git diff --check

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.patch.outcome }}" = "success" ]; then
            rm -f .codec-patch.log
            git add BuFi/Playback/AudioEngine.swift BuFi/Core/OpenSubsonicClient.swift BuFi/UI/SettingsView.swift BuFi/Resources/*.lproj/Localizable.strings
            git commit -m "playback: add low-power FLAC and Opus routing"
          else
            git restore BuFi/Playback/AudioEngine.swift BuFi/Core/OpenSubsonicClient.swift BuFi/UI/SettingsView.swift BuFi/Resources/*.lproj/Localizable.strings || true
            git add .codec-patch.log
            git commit -m "ci: capture codec patch failure"
          fi
          git push origin HEAD:playback/low-power-codecs

      - name: Fail when patch failed
        if: steps.patch.outcome == 'failure'
        run: exit 1
