name: Apply UI Energy Refinement

on:
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - .github/scripts/apply-ui-energy-refinement.py
      - .github/workflows/apply-ui-energy-refinement.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ui-energy-refinement
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 0
      - name: Apply refinement
        run: python3 .github/scripts/apply-ui-energy-refinement.py
      - name: Validate
        run: |
          git diff --check
          ! grep -R --line-number --fixed-strings 'Task.detached' BuFi --include='*.swift'
          grep -n --fixed-strings 'LazyVStack(spacing: 0)' BuFi/UI/LibraryView.swift
          grep -n --fixed-strings 'lastMeasuredAt' BuFi/UI/ServerLatencyBadge.swift
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reduce remaining UI and network wakeups'
          git push origin HEAD:agent/swift-6-concurrency
