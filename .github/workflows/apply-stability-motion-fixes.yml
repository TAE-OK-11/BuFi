name: Apply Stability and Motion Fixes

on:
  push:
    branches:
      - fix/playback-time-motion-stability

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/playback-time-motion-stability
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 Scripts/apply-stability-motion-fixes.py
          git diff --check
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_LTO=NO \
            LLVM_LTO=NO \
            build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi
          git commit -m "fix: stabilize playback timing and refine motion"
          git push origin HEAD:fix/playback-time-motion-stability
