name: Apply BuFi Actions fix

on:
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - .github/workflows/apply-bufi-actions-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 1

      - name: Apply verified fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if expected is None:
                  if count < 1:
                      raise SystemExit(f"{path}: expected at least 1 match, found 0")
              elif count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              p.write_text(text.replace(old, new))

          db = "BuFi/Core/AppDatabase.swift"
          replace_exact(
              db,
              '''            DELETE FROM artwork_palette_cache WHERE rowid IN (\n                SELECT rowid FROM artwork_palette_cache\n                WHERE account_scope = ?\n                ORDER BY last_accessed_at DESC, artwork_key ASC,\n                         engine_version DESC\n                LIMIT -1 OFFSET ?\n            )''',
              '''            DELETE FROM artwork_palette_cache\n            WHERE (account_scope, artwork_key, engine_version) IN (\n                SELECT account_scope, artwork_key, engine_version\n                FROM artwork_palette_cache\n                WHERE account_scope = ?\n                ORDER BY last_accessed_at DESC, artwork_key ASC,\n                         engine_version DESC\n                LIMIT -1 OFFSET ?\n            )'''
          )
          replace_exact(
              db,
              '''            DELETE FROM artwork_palette_cache WHERE rowid IN (\n                SELECT rowid FROM artwork_palette_cache\n                ORDER BY last_accessed_at DESC, account_scope ASC,\n                         artwork_key ASC, engine_version DESC\n                LIMIT -1 OFFSET ?\n            )''',
              '''            DELETE FROM artwork_palette_cache\n            WHERE (account_scope, artwork_key, engine_version) IN (\n                SELECT account_scope, artwork_key, engine_version\n                FROM artwork_palette_cache\n                ORDER BY last_accessed_at DESC, account_scope ASC,\n                         artwork_key ASC, engine_version DESC\n                LIMIT -1 OFFSET ?\n            )'''
          )

          replace_exact(
              "BuFi/Core/OfflineStore.swift",
              '''        guard let values = try? url.resourceValues(\n            forKeys: [.isRegularFileKey, .fileSizeKey]\n        ), values.isRegularFile == true,\n           let fileSize = values.fileSize,\n           fileSize > 0 else {\n            return false\n        }\n        guard let expectedByteCount else { return true }\n        return expectedByteCount > 0 && Int64(fileSize) == expectedByteCount''',
              '''        guard let attributes = try? FileManager.default.attributesOfItem(\n            atPath: url.path\n        ),\n        let fileType = attributes[.type] as? FileAttributeType,\n        fileType == .typeRegular,\n        let fileSizeNumber = attributes[.size] as? NSNumber else {\n            return false\n        }\n        let fileSize = fileSizeNumber.int64Value\n        guard fileSize > 0 else { return false }\n        guard let expectedByteCount else { return true }\n        return expectedByteCount > 0 && fileSize == expectedByteCount'''
          )

          for workflow in [
              ".github/workflows/verify-bufi-pr.yml",
              ".github/workflows/ios.yml",
          ]:
              replace_exact(
                  workflow,
                  '''          xcrun simctl spawn "$SIMULATOR_UDID" launchctl procinfo "$APP_PID"''',
                  '''          PROCINFO="$(xcrun simctl spawn "$SIMULATOR_UDID" launchctl procinfo "$APP_PID" 2>&1 || true)"\n          printf '%s\\n' "$PROCINFO"\n          printf '%s\\n' "$PROCINFO" | grep -q 'job state = running' '''.rstrip(),
                  expected=None
              )
          PY

          rm -f patches/bufi-actions-fix.patch
          rm -f .github/workflows/apply-bufi-actions-fix.yml
          git diff --check

      - name: Commit fixes to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix failing Actions regressions"
          git push origin HEAD:agent/swift-6-concurrency
