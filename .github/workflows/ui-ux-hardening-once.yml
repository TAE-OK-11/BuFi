name: Apply UI UX hardening once

on:
  push:
    branches:
      - fix/player-artwork-reopen-position

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-artwork-reopen-position
          fetch-depth: 0

      - name: Apply UI and lifecycle fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch target in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          # Home: never show a blank personalized tab while its presentation is being prepared.
          path = "BuFi/UI/HomeView.swift"
          replace_once(path,
              '    @State private var hasLoadedPresentation = false\n',
              '    @State private var hasLoadedPresentation = false\n    @State private var resolvedPresentationIdentity: HomePresentationTaskIdentity?\n')
          replace_once(path,
              '''                    filterBar\n                    ForEach(visibleSections, id: \\.self) { section in\n                        homeSection(section)\n                            .padding(.top, section == visibleSections.first ? 0 : 6)\n                            .transition(.opacity)\n                    }\n''',
              '''                    filterBar\n                    if filter == .personalized,\n                       resolvedPresentationIdentity != presentationTaskIdentity {\n                        HStack {\n                            Spacer()\n                            ProgressView("맞춤 믹스 준비 중…")\n                            Spacer()\n                        }\n                        .padding(.top, 48)\n                    } else if filter == .personalized, visibleSections.isEmpty {\n                        ContentUnavailableView(\n                            "아직 만들 수 있는 맞춤 믹스가 없습니다",\n                            systemImage: "sparkles"\n                        )\n                        .frame(maxWidth: .infinity)\n                        .padding(.top, 44)\n                    } else {\n                        ForEach(visibleSections, id: \\.self) { section in\n                            homeSection(section)\n                                .padding(.top, section == visibleSections.first ? 0 : 6)\n                                .transition(.opacity)\n                        }\n                    }\n''')
          replace_once(path,
              '''    private func updatePresentation() async {\n        let revision = library.revision\n''',
              '''    private func updatePresentation() async {\n        let taskIdentity = presentationTaskIdentity\n        let revision = library.revision\n''')
          replace_once(path,
              '''        presentation = next\n        hasLoadedPresentation = true\n''',
              '''        presentation = next\n        hasLoadedPresentation = true\n        resolvedPresentationIdentity = taskIdentity\n''')

          # Search: distinguish mix loading from true empty and size grids from the actual window.
          path = "BuFi/UI/SearchView.swift"
          replace_once(path,
              '    @State private var personalizedMixes: [PersonalizedMix] = []\n',
              '    @State private var personalizedMixes: [PersonalizedMix] = []\n    @State private var resolvedPersonalizedMixIdentity: SearchMixTaskIdentity?\n    @State private var viewportWidth: CGFloat = 0\n')
          replace_once(path,
              '''            .task(id: personalizedMixTaskIdentity) {\n                await updatePersonalizedMixesIfNeeded()\n            }\n        }\n''',
              '''            .task(id: personalizedMixTaskIdentity) {\n                await updatePersonalizedMixesIfNeeded()\n            }\n        }\n        .onGeometryChange(for: CGFloat.self) { proxy in\n            proxy.size.width\n        } action: { width in\n            guard width.isFinite, width > 0, abs(viewportWidth - width) > 0.5 else { return }\n            viewportWidth = width\n        }\n''')
          replace_once(path,
              '''    private var collectionCardWidth: CGFloat {\n        max(132, (UIScreen.main.bounds.width - 52) / 2)\n    }\n''',
              '''    private var collectionCardWidth: CGFloat {\n        let width = viewportWidth > 0 ? viewportWidth : 390\n        return max(132, (width - 52) / 2)\n    }\n''')
          replace_once(path,
              '''    private func algorithmPlaylistGrid(_ mixes: [PersonalizedMix]) -> some View {\n        if mixes.isEmpty {\n''',
              '''    private func algorithmPlaylistGrid(_ mixes: [PersonalizedMix]) -> some View {\n        if resolvedPersonalizedMixIdentity != personalizedMixTaskIdentity {\n            HStack {\n                Spacer()\n                ProgressView("맞춤 믹스 준비 중…")\n                Spacer()\n            }\n            .padding(.top, 32)\n        } else if mixes.isEmpty {\n''')
          replace_once(path,
              '''    private func updatePersonalizedMixesIfNeeded() async {\n        guard browseMode == .algorithmPlaylists else { return }\n        let revision = library.revision\n''',
              '''    private func updatePersonalizedMixesIfNeeded() async {\n        guard browseMode == .algorithmPlaylists else { return }\n        let taskIdentity = personalizedMixTaskIdentity\n        let revision = library.revision\n''')
          replace_once(path,
              '''        personalizedMixes = next\n    }\n''',
              '''        personalizedMixes = next\n        resolvedPersonalizedMixIdentity = taskIdentity\n    }\n''')

          # Library: distinguish artist preparation from true empty and size album cards from viewport.
          path = "BuFi/UI/LibraryView.swift"
          replace_once(path,
              '    @State private var artistPresentation = LibraryArtistPresentation.empty\n',
              '    @State private var artistPresentation = LibraryArtistPresentation.empty\n    @State private var artistPresentationRevision: HomeSnapshotRevision?\n    @State private var viewportWidth: CGFloat = 0\n')
          replace_once(path,
              '''        .task(id: artistPresentationTaskIdentity) {\n            await updateArtistPresentation()\n        }\n    }\n''',
              '''        .task(id: artistPresentationTaskIdentity) {\n            await updateArtistPresentation()\n        }\n        .onGeometryChange(for: CGFloat.self) { proxy in\n            proxy.size.width\n        } action: { width in\n            guard width.isFinite, width > 0, abs(viewportWidth - width) > 0.5 else { return }\n            viewportWidth = width\n        }\n    }\n''')
          replace_once(path,
              '''        case .artists:\n            if artistPresentation.allArtists.isEmpty {\n                return [.artistsEmpty]\n            }\n''',
              '''        case .artists:\n            if artistPresentationRevision != library.revision {\n                return [.artistsLoading]\n            }\n            if artistPresentation.allArtists.isEmpty {\n                return [.artistsEmpty]\n            }\n''')
          replace_once(path,
              '''        case .artistsEmpty:\n            empty("아티스트가 없습니다", icon: "person.2")\n''',
              '''        case .artistsLoading:\n            HStack {\n                Spacer()\n                ProgressView("아티스트 정리 중…")\n                Spacer()\n            }\n            .padding(.top, 48)\n        case .artistsEmpty:\n            empty("아티스트가 없습니다", icon: "person.2")\n''')
          replace_once(path,
              '''    private var libraryAlbumWidth: CGFloat {\n        max(132, (UIScreen.main.bounds.width - 46) / 2)\n    }\n''',
              '''    private var libraryAlbumWidth: CGFloat {\n        let width = viewportWidth > 0 ? viewportWidth : 390\n        return max(132, (width - 46) / 2)\n    }\n''')
          replace_once(path,
              '''        artistPresentation = next\n    }\n''',
              '''        artistPresentation = next\n        artistPresentationRevision = revision\n    }\n''')
          replace_once(path,
              '''private enum LibrarySurface: Hashable {\n    case playlists\n    case albums\n    case songs\n    case artistsEmpty\n''',
              '''private enum LibrarySurface: Hashable {\n    case playlists\n    case albums\n    case songs\n    case artistsLoading\n    case artistsEmpty\n''')

          # Login: use the actual SwiftUI container height instead of physical UIScreen bounds.
          path = "BuFi/UI/LoginView.swift"
          replace_once(path,
              '    @State private var loginTask: Task<Void, Never>?\n',
              '    @State private var loginTask: Task<Void, Never>?\n    @State private var containerHeight: CGFloat = 0\n')
          replace_once(path,
              '                .frame(minHeight: UIScreen.main.bounds.height - 30)\n',
              '                .frame(minHeight: max(0, containerHeight - 30))\n')
          replace_once(path,
              '''            .scrollDismissesKeyboard(.interactively)\n        }\n    }\n''',
              '''            .scrollDismissesKeyboard(.interactively)\n        }\n        .onGeometryChange(for: CGFloat.self) { proxy in\n            proxy.size.height\n        } action: { height in\n            guard height.isFinite, height > 0, abs(containerHeight - height) > 0.5 else { return }\n            containerHeight = height\n        }\n    }\n''')

          # Detail UI: separate loading/error/empty, make retry deterministic, keep user-started downloads alive.
          path = "BuFi/UI/MusicDetailView.swift"
          replace_once(path,
              '''struct MusicDetailView: View {\n''',
              '''private struct DetailLoadTaskIdentity: Hashable {\n    let route: MusicRoute\n    let attempt: Int\n}\n\nstruct MusicDetailView: View {\n''')
          replace_once(path,
              '    @State private var isLoading = true\n',
              '    @State private var isLoading = true\n    @State private var loadErrorMessage: String?\n    @State private var loadAttempt = 0\n')
          replace_once(path,
              '''                if isLoading {\n                    ProgressView("불러오는 중…")\n                        .frame(maxWidth: .infinity)\n                        .padding(.top, 60)\n                        .transition(.opacity)\n                } else {\n                    controls\n''',
              '''                if isLoading {\n                    ProgressView("불러오는 중…")\n                        .frame(maxWidth: .infinity)\n                        .padding(.top, 60)\n                        .transition(.opacity)\n                } else if let loadErrorMessage {\n                    detailLoadError(loadErrorMessage)\n                } else {\n                    controls\n''')
          replace_once(path,
              '        .task(id: route) { await load() }\n',
              '        .task(id: DetailLoadTaskIdentity(route: route, attempt: loadAttempt)) { await load() }\n')
          replace_once(path,
              '''        .onDisappear {\n            downloadAllTask?.cancel()\n            downloadAllTask = nil\n            isDownloadingAll = false\n            model.cancelDetailRequest(for: route)\n        }\n''',
              '''        .onDisappear {\n            // A user-requested offline download owns its own lifetime. Leaving\n            // this screen must not silently cancel a transfer already started.\n            model.cancelDetailRequest(for: route)\n        }\n''')
          replace_once(path,
              '''    @ViewBuilder\n    private var hero: some View {\n''',
              '''    private func detailLoadError(_ message: String) -> some View {\n        VStack(spacing: 14) {\n            Image(systemName: "exclamationmark.triangle.fill")\n                .font(.system(size: 34, weight: .semibold))\n                .foregroundStyle(.secondary)\n            Text("불러오지 못했습니다")\n                .font(.system(size: 20, weight: .bold))\n            Text(message)\n                .font(.system(size: 14))\n                .foregroundStyle(.secondary)\n                .multilineTextAlignment(.center)\n            Button("다시 시도") {\n                loadAttempt &+= 1\n            }\n            .font(.system(size: 15, weight: .semibold))\n            .padding(.horizontal, 18)\n            .frame(height: 42)\n            .buFiGlass(cornerRadius: 21, interactive: true)\n            .buttonStyle(BuFiPressStyle())\n        }\n        .frame(maxWidth: .infinity)\n        .padding(.horizontal, 24)\n        .padding(.top, 52)\n    }\n\n    @ViewBuilder\n    private var hero: some View {\n''')
          replace_once(path,
              '                hasCurrentArtistMix ? "Artist Mix Added" : "Create Artist Mix",\n',
              '                hasCurrentArtistMix ? "아티스트 믹스 추가됨" : "아티스트 믹스 만들기",\n')
          replace_once(path,
              '''        .buttonStyle(BuFiPressStyle())\n        .padding(.horizontal, 20)\n        .padding(.bottom, 12)\n        .accessibilityLabel(\n            hasCurrentArtistMix\n''',
              '''        .buttonStyle(BuFiPressStyle())\n        .disabled(hasCurrentArtistMix)\n        .padding(.horizontal, 20)\n        .padding(.bottom, 12)\n        .accessibilityLabel(\n            hasCurrentArtistMix\n''')
          replace_once(path,
              '''        isLoading = true\n        palette = .fallback\n''',
              '''        isLoading = true\n        loadErrorMessage = nil\n        palette = .fallback\n''')
          replace_once(path,
              '''        } catch {\n            guard !Task.isCancelled else { return }\n            model.errorMessage = error.localizedDescription\n        }\n''',
              '''        } catch {\n            guard !Task.isCancelled else { return }\n            loadErrorMessage = error.localizedDescription\n        }\n''')

          # Settings/offline storage: live accounting and visible deletion failures.
          path = "BuFi/UI/SettingsView.swift"
          replace_once(path,
              '''    @EnvironmentObject private var session: AppSessionState\n''',
              '''    @EnvironmentObject private var session: AppSessionState\n    @Environment(\\.scenePhase) private var scenePhase\n''')
          replace_once(path,
              '    @State private var isLoggingOut = false\n',
              '    @State private var isLoggingOut = false\n    @State private var storageErrorMessage: String?\n')
          replace_once(path,
              '''            .task {\n                offlineBytes = await OfflineStore.shared.totalBytes()\n            }\n''',
              '''            .task {\n                await observeOfflineStorageChanges()\n            }\n            .onChange(of: scenePhase) { _, phase in\n                guard phase == .active else { return }\n                Task { @MainActor in\n                    await refreshOfflineBytes()\n                }\n            }\n            .alert(\n                "저장 공간 오류",\n                isPresented: Binding(\n                    get: { storageErrorMessage != nil },\n                    set: { if !$0 { storageErrorMessage = nil } }\n                )\n            ) {\n                Button("확인", role: .cancel) { storageErrorMessage = nil }\n            } message: {\n                Text(storageErrorMessage ?? "")\n            }\n''')
          replace_once(path,
              '''                Button("모두 삭제", role: .destructive) {\n                    Task {\n                        try? await OfflineStore.shared.removeAll()\n                        offlineBytes = await OfflineStore.shared.totalBytes()\n                    }\n                }\n''',
              '''                Button("모두 삭제", role: .destructive) {\n                    Task { @MainActor in\n                        do {\n                            try await OfflineStore.shared.removeAll()\n                        } catch {\n                            storageErrorMessage = error.localizedDescription\n                        }\n                        await refreshOfflineBytes()\n                    }\n                }\n''')
          replace_once(path,
              '''extension SettingsView {\n    private var offlineSection: some View {\n''',
              '''extension SettingsView {\n    @MainActor\n    private func refreshOfflineBytes() async {\n        offlineBytes = await OfflineStore.shared.totalBytes()\n    }\n\n    @MainActor\n    private func observeOfflineStorageChanges() async {\n        await refreshOfflineBytes()\n        for await _ in NotificationCenter.default.notifications(\n            named: OfflineStore.storageDidChangeNotification\n        ) {\n            guard !Task.isCancelled else { return }\n            await refreshOfflineBytes()\n        }\n    }\n\n    private var offlineSection: some View {\n''')

          # OfflineStore broadcasts byte-accounting changes to the long-lived Settings tab.
          path = "BuFi/Core/OfflineStore.swift"
          replace_once(path,
              '''actor OfflineStore {\n    static let shared = OfflineStore()\n''',
              '''actor OfflineStore {\n    static let shared = OfflineStore()\n    static let storageDidChangeNotification = Notification.Name(\n        "BuFi.OfflineStore.storageDidChange"\n    )\n''')
          replace_once(path,
              '''            scheduleIndexPersistence()\n            return destination\n''',
              '''            scheduleIndexPersistence()\n            NotificationCenter.default.post(\n                name: Self.storageDidChangeNotification,\n                object: nil\n            )\n            return destination\n''')
          replace_once(path,
              '''        scheduleIndexPersistence(immediate: true)\n        if let firstError { throw firstError }\n''',
              '''        scheduleIndexPersistence(immediate: true)\n        NotificationCenter.default.post(\n            name: Self.storageDidChangeNotification,\n            object: nil\n        )\n        if let firstError { throw firstError }\n''')

          # Empty personalized mixes must not expose controls that appear tappable but do nothing.
          path = "BuFi/UI/PersonalizedMixView.swift"
          replace_once(path,
              '''            .buttonStyle(BuFiPressStyle())\n            .accessibilityLabel("셔플 재생")\n\n            Button {\n''',
              '''            .buttonStyle(BuFiPressStyle())\n            .disabled(mix.songs.isEmpty)\n            .accessibilityLabel("셔플 재생")\n\n            Button {\n''')
          replace_once(path,
              '''            .buttonStyle(BuFiPressStyle())\n            .accessibilityLabel("전체 재생")\n''',
              '''            .buttonStyle(BuFiPressStyle())\n            .disabled(mix.songs.isEmpty)\n            .accessibilityLabel("전체 재생")\n''')
          PY

          git diff --check
          if grep -R "UIScreen.main.bounds" BuFi/UI/SearchView.swift BuFi/UI/LibraryView.swift BuFi/UI/LoginView.swift; then
            echo "UIScreen-based layout dependency remains" >&2
            exit 1
          fi

      - name: Commit hardened UI state handling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/UI/HomeView.swift BuFi/UI/SearchView.swift BuFi/UI/LibraryView.swift BuFi/UI/LoginView.swift BuFi/UI/MusicDetailView.swift BuFi/UI/SettingsView.swift BuFi/UI/PersonalizedMixView.swift BuFi/Core/OfflineStore.swift
          git commit -m "fix: harden app-wide UI state and lifecycle"
          git push origin HEAD:fix/player-artwork-reopen-position
