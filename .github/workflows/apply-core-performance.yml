name: Apply Core Swift 6 Performance Refactor

on:
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - .github/scripts/apply-core-performance.py
      - .github/workflows/apply-core-performance.yml

permissions:
  contents: write

concurrency:
  group: apply-core-swift6-performance
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 0

      - name: Apply Core Swift 6 and performance refactor
        run: python3 .github/scripts/apply-core-performance.py

      - name: Validate migration
        run: |
          git diff --check
          if grep -R -n 'Task\.detached' BuFi/Core BuFi/App; then
            echo 'Detached task remains in Core/App' >&2
            exit 1
          fi
          grep -q 'LLVM_LTO: YES' project.yml
          grep -q 'PlaybackTimelineRefreshPolicy' BuFi/Playback/AudioEngine.swift
          test -f BuFiTests/CorePerformancePolicyTests.swift

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            BuFi/App/AppModel.swift \
            BuFi/Core/AppDatabase.swift \
            BuFi/Core/ArtworkStore.swift \
            BuFi/Core/OfflineStore.swift \
            BuFi/Core/RecommendationEngine.swift \
            BuFi/Playback/AudioEngine.swift \
            BuFiTests/CorePerformancePolicyTests.swift \
            Scripts/verify-swift6-language-mode.sh \
            project.yml
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No migration changes produced' >&2; exit 1; }
          git commit -m 'Optimize BuFi Core for Swift 6 and energy efficiency'
          git push origin HEAD:agent/swift-6-concurrency
