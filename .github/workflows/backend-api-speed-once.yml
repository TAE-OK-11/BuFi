          # On servers that support topSongsByArtistId, getArtist/getArtistInfo/
          # getTopSongs are independent. Run all three in parallel and retain
          # the existing sequential name fallback for older servers.
          artist_block = '''    func artist(id: String, name: String) async throws -> ArtistDetail {
              let usesArtistID = await supportsExtension("topSongsByArtistId")
              if usesArtistID {
                  async let albumsPayload: ArtistAlbumsPayload = readRequest(
                      "getArtist",
                      parameters: ["id": id]
                  )
                  async let infoPayload: ArtistInfoPayload? = bestEffortRequest(
                      "getArtistInfo2",
                      parameters: [
                          "id": id,
