              let info = try await infoPayload
              return ArtistDetail(
                  artist: artist.artistValue,
                  albums: artist.album ?? [],
                  topSongs: Self.uniqueSongsByIdentity(top.topSongs?.song ?? []),
                  info: info?.artistInfo2
              )
          }

'''
