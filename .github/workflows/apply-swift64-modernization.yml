name: Apply Swift 6.4 Modernization

on:
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - .github/scripts/apply-swift64-modernization.py
      - .github/workflows/apply-swift64-modernization.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-swift64-modernization
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 0

      - name: Apply audited modernization patch
        run: python3 .github/scripts/apply-swift64-modernization.py

      - name: Validate patch structure
        run: |
          git diff --check
          ! grep -R --line-number --fixed-strings 'Task.detached' BuFi --include='*.swift'
          ! grep -n --fixed-strings 'import Combine' BuFi/UI/RootView.swift
          ! grep -n --fixed-strings '.receive(on: DispatchQueue.main)' BuFi/UI/RootView.swift
          grep -n --fixed-strings 'ArtworkLoadRequestIdentity' BuFi/UI/Components.swift
          grep -n --fixed-strings 'ContinuousClock' BuFi/App/AppModel.swift
          grep -n --fixed-strings 'notifications(' BuFi/UI/RootView.swift

      - name: Commit modernization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi BuFiTests
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Modernize remaining Swift 6.4 runtime paths'
          git push origin HEAD:agent/swift-6-concurrency
