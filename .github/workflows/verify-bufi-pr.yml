name: Verify BuFi PR

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  BUFI_BUILD_NUMBER: ${{ github.run_number }}

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-bufi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unified-ios:
    name: Swift 6.4 unified iOS build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/player-artwork-reopen-position
          fetch-depth: 0

      - name: Apply restored artwork pager fix
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          root = 'BuFi/UI/RootView.swift'
          player = 'BuFi/UI/PlayerView.swift'
          components = 'BuFi/UI/Components.swift'

          replace_once(
              root,
              '''private struct PlayerPresentationSession: Identifiable {
              let id: UUID
          }
''',
              '''private struct PlayerPresentationSession: Identifiable {
              let id: UUID
              let initialArtworkPage: PlayerArtworkPageID?
          }
'''
          )
          replace_once(
              root,
              '''            NavigationStack {
              PlayerView()
                  .navigationDestination(for: MusicRoute.self) { route in
''',
              '''            NavigationStack {
              PlayerView(
                  initialArtworkPage: presentation.initialArtworkPage
              )
                  .navigationDestination(for: MusicRoute.self) { route in
'''
          )
          replace_once(
              root,
              '''                return PlayerPresentationSession(
                  id: playerPresentation.presentationID
              )
''',
              '''                return PlayerPresentationSession(
                  id: playerPresentation.presentationID,
                  initialArtworkPage: currentArtworkPageID
              )
'''
          )
          replace_once(
              root,
              '''    private var effectiveMotion: Bool {
''',
              '''    private var currentArtworkPageID: PlayerArtworkPageID? {
              guard let item = currentPlayback.item else { return nil }
              return PlayerArtworkPageID(
                  queueEntryID: item.queueEntryID,
                  songID: item.song.id,
                  coverArtID: item.song.artworkID,
                  artworkRevision: item.song.artworkRevision,
                  accountScope: item.accountScope
              )
          }

          private var effectiveMotion: Bool {
'''
          )
          replace_once(
              player,
              '''    private let audio = AudioEngine.shared

              var body: some View {
''',
              '''    private let audio = AudioEngine.shared

              init(initialArtworkPage: PlayerArtworkPageID? = nil) {
                  // Seed the horizontal pager before its first layout. On a
                  // restored process, waiting until onAppear can let SwiftUI
                  // reuse a stale/leading content offset for the first frame.
                  _artworkPage = State(initialValue: initialArtworkPage)
              }

              var body: some View {
'''
          )
          replace_once(
              components,
              '''                Image(uiImage: loadedArtwork.image)
                  .resizable()
                  .scaledToFill()
                  .transition(
''',
              '''                Image(uiImage: loadedArtwork.image)
                  .resizable()
                  .scaledToFill()
                  .frame(width: size, height: size)
                  .clipped()
                  .transition(
'''
          )
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/UI/RootView.swift BuFi/UI/PlayerView.swift BuFi/UI/Components.swift
          if ! git diff --cached --quiet; then
            git commit -m 'Fix restored full-player artwork position'
            git push origin HEAD:fix/player-artwork-reopen-position
          fi

      - name: Show build toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/BuFiSourcePackages
          key: ${{ runner.os }}-xcode27-swift6.4-spm-${{ hashFiles('project.yml', 'Package.resolved') }}

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Prepare generated assets
        run: sh Scripts/prepare-assets.sh

      - name: Generate project
        run: |
          plutil -lint BuFi/Resources/PrivacyInfo.xcprivacy
          xcodegen generate
          sh Scripts/apply-package-lock.sh

      - name: Verify Swift 6.4 unified configuration
        run: Scripts/verify-swift6-language-mode.sh

      - name: Build unsigned app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -disableAutomaticPackageResolution \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFiSourcePackages" \
            -parallelizeTargets \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            STRIP_SWIFT_SYMBOLS=NO \
            STRIP_STYLE=non-global \
            CURRENT_PROJECT_VERSION="$BUFI_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcode.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-swift6.4-failure-logs
          path: |
            build/xcode.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'BuFi.app' -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")" = "17.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$BUFI_BUILD_NUMBER"
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/BuFi.app
          cd build
          /usr/bin/zip -qry "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa" Payload
          shasum -a 256 "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa" > "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-build${{ github.run_number }}-unsigned
          path: |
            build/BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa
            build/BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
