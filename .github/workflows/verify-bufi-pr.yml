name: Verify BuFi PR

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  BUFI_BUILD_NUMBER: ${{ github.run_number }}

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-bufi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: unsigned-ipa
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select stable Xcode 26.6
        run: |
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/BuFiSourcePackages
          key: ${{ runner.os }}-xcode26.6-spm-${{ hashFiles('project.yml') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare generated assets
        run: sh Scripts/prepare-assets.sh
      - name: Generate project
        run: |
          plutil -lint BuFi/Resources/PrivacyInfo.xcprivacy
          xcodegen generate
      - name: Verify Swift 6 language mode
        run: Scripts/verify-swift6-language-mode.sh
      - name: Boot an available iPhone simulator
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in reversed(list(data["devices"].values())) for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Build unsigned app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFiSourcePackages" \
            -parallelizeTargets \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            STRIP_SWIFT_SYMBOLS=NO \
            STRIP_STYLE=non-global \
            CURRENT_PROJECT_VERSION="$BUFI_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcode26.log
      - name: Compile unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData-Tests \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFiSourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee build/xcode26-tests.log
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData-Tests \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFiSourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee build/xcode26-test-run.log
      - name: Launch smoke test
        run: |
          APP_PATH="build/DerivedData-Tests/Build/Products/Debug-iphonesimulator/BuFi.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          LAUNCH_OUTPUT="$(xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" cloud.tae00217.BuFi)"
          APP_PID="${LAUNCH_OUTPUT##*: }"
          test -n "$APP_PID"
          sleep 5
          xcrun simctl spawn "$SIMULATOR_UDID" launchctl procinfo "$APP_PID"
      - name: Upload Xcode 26 failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-xcode26-failure-logs
          path: |
            build/xcode26.log
            build/xcode26-tests.log
            build/xcode26-test-run.log
          if-no-files-found: warn
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'BuFi.app' -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$BUFI_BUILD_NUMBER"
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/BuFi.app
          cd build
          /usr/bin/zip -qry "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa" Payload
          shasum -a 256 "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa" > "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa.sha256"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-build${{ github.run_number }}-unsigned
          path: |
            build/BuFi-1.0.0-build${{ github.run_number }}-unsigned.ipa
            build/BuFi-1.0.0-build${{ github.run_number }}-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Shut down simulator
        if: always()
        run: |
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          fi

  ios-27-compatibility:
    name: iOS 27 beta 4 Release launch
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/BuFi27SourcePackages
          key: ${{ runner.os }}-xcode27-spm-${{ hashFiles('project.yml') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare generated assets
        run: sh Scripts/prepare-assets.sh
      - name: Generate project
        run: xcodegen generate
      - name: Verify Swift 6 language mode
        run: Scripts/verify-swift6-language-mode.sh
      - name: Boot an iOS 27 simulator
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime,devices in reversed(list(data["devices"].items())) if "iOS-27" in runtime for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Build with iOS 27 SDK
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-27 \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFi27SourcePackages" \
            -parallelizeTargets \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            STRIP_SWIFT_SYMBOLS=NO \
            STRIP_STYLE=non-global \
            CURRENT_PROJECT_VERSION="$BUFI_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcode27.log
      - name: Build and launch Release on iOS 27
        run: |
          set -o pipefail
          xcodebuild \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/DerivedData-27-Simulator \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFi27SourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CURRENT_PROJECT_VERSION="$BUFI_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcode27-simulator.log
          APP_PATH="build/DerivedData-27-Simulator/Build/Products/Release-iphonesimulator/BuFi.app"
          test -d "$APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          LAUNCH_OUTPUT="$(xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" cloud.tae00217.BuFi)"
          APP_PID="${LAUNCH_OUTPUT##*: }"
          test -n "$APP_PID"
          sleep 8
          xcrun simctl spawn "$SIMULATOR_UDID" launchctl procinfo "$APP_PID"
          DATA_CONTAINER="$(xcrun simctl get_app_container "$SIMULATOR_UDID" cloud.tae00217.BuFi data)"
          PREFS="$DATA_CONTAINER/Library/Preferences/cloud.tae00217.BuFi.plist"
          test -f "$PREFS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :launch-diagnostics-last-phase' "$PREFS")" = "application-bootstrap-ready"
      - name: Package iOS 27 beta 4 unsigned IPA
        run: |
          APP_PATH="build/DerivedData-27/Build/Products/Release-iphoneos/BuFi.app"
          test -d "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$BUFI_BUILD_NUMBER"
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          mkdir -p build/iOS27/Payload
          ditto "$APP_PATH" build/iOS27/Payload/BuFi.app
          cp Docs/IOS27_BETA_INSTALLATION.md build/IOS27_INSTALLATION.txt
          cd build/iOS27
          /usr/bin/zip -qry "../BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-ios27-beta4-unsigned.ipa" Payload
          cd ..
          shasum -a 256 "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-ios27-beta4-unsigned.ipa" > "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-ios27-beta4-unsigned.ipa.sha256"
      - name: Upload iOS 27 beta 4 unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-build${{ github.run_number }}-ios27-beta4-unsigned
          path: |
            build/BuFi-1.0.0-build${{ github.run_number }}-ios27-beta4-unsigned.ipa
            build/BuFi-1.0.0-build${{ github.run_number }}-ios27-beta4-unsigned.ipa.sha256
            build/IOS27_INSTALLATION.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Xcode 27 preview log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-xcode27-preview-log
          path: |
            build/xcode27.log
            build/xcode27-simulator.log
          if-no-files-found: warn
          retention-days: 14
      - name: Shut down simulator
        if: always()
        run: |
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          fi
