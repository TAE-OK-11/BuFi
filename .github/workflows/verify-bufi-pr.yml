name: Verify BuFi PR

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  BUFI_BUILD_NUMBER: ${{ github.run_number }}

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-bufi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unified-ios:
    name: Swift 6.4 unified iOS build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: backend-core-lightweight
          fetch-depth: 2

      - name: Apply final backend audit hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          subsonic = Path('BuFi/Core/OpenSubsonicClient.swift')
          replace_once(
              subsonic,
              '''    private static let responseCacheLimit = 128
              private static let responseCacheByteLimit = 16 * 1_024 * 1_024
              private static let maximumCachedResponseBytes = 2 * 1_024 * 1_024
''',
              '''    private static let responseCacheLimit = 128
              private static let responseCacheByteLimit = 16 * 1_024 * 1_024
              private static let maximumCachedResponseBytes = 2 * 1_024 * 1_024
              private static let coverURLCacheLimit = 512
''',
              'cover URL cache limit'
          )
          replace_once(
              subsonic,
              '''        let fetchedPayload: OpenSubsonicExtensionsPayload? = try? await withEnrichmentPermit(
                  limiter
              ) { [self] in
                  try await readRequest("getOpenSubsonicExtensions")
              }
              guard let payload = fetchedPayload else {
                  supportedExtensions = []
                  return false
              }
''',
              '''        let payload: OpenSubsonicExtensionsPayload
              do {
                  payload = try await withEnrichmentPermit(limiter) { [self] in
                      try await readRequest("getOpenSubsonicExtensions")
                  }
              } catch {
                  // A transient/auth/cancellation failure is not an authoritative
                  // statement that the server supports no extensions. Leave the
                  // cache unresolved so a later healthy request can recover.
                  return false
              }
''',
              'extension capability cache poisoning'
          )
          replace_once(
              subsonic,
              '''        coverURLCache[cacheKey] = url
              return url
''',
              '''        if coverURLCache.count >= Self.coverURLCacheLimit {
                  coverURLCache.removeAll(keepingCapacity: true)
              }
              coverURLCache[cacheKey] = url
              return url
''',
              'bounded cover URL cache'
          )

          offline = Path('BuFi/Core/OfflineStore.swift')
          replace_once(
              offline,
              '''            } catch is CancellationError {
                      throw CancellationError()
                  } catch {
                      guard retryCount < ReadRequestRetryPolicy.maximumRetryCount,
''',
              '''            } catch is CancellationError {
                      throw CancellationError()
                  } catch let error as OpenSubsonicError {
                      // HTTP status handling above already consumed the bounded
                      // retry decision, including Retry-After. Do not catch the
                      // terminal status again as a headerless transport retry.
                      throw error
                  } catch {
                      guard retryCount < ReadRequestRetryPolicy.maximumRetryCount,
''',
              'offline Retry-After double retry'
          )
          PY
          git diff --check
          git checkout HEAD^ -- .github/workflows/verify-bufi-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Core/OpenSubsonicClient.swift BuFi/Core/OfflineStore.swift .github/workflows/verify-bufi-pr.yml
          git diff --cached --check
          git commit -m 'Finish backend capability and download retry hardening'
          git push origin HEAD:backend-core-lightweight

      - name: Show build toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/BuFiSourcePackages
          key: ${{ runner.os }}-xcode27-swift6.4-spm-${{ hashFiles('project.yml', 'Package.resolved') }}

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Prepare generated assets
        run: sh Scripts/prepare-assets.sh

      - name: Generate project
        run: |
          plutil -lint BuFi/Resources/PrivacyInfo.xcprivacy
          xcodegen generate
          sh Scripts/apply-package-lock.sh

      - name: Verify Swift 6.4 unified configuration
        run: Scripts/verify-swift6-language-mode.sh

      - name: Build unsigned app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -disableAutomaticPackageResolution \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFiSourcePackages" \
            -parallelizeTargets \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            STRIP_SWIFT_SYMBOLS=NO \
            STRIP_STYLE=non-global \
            CURRENT_PROJECT_VERSION="$BUFI_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcode.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-swift6.4-failure-logs
          path: |
            build/xcode.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'BuFi.app' -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")" = "17.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$BUFI_BUILD_NUMBER"
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/BuFi.app
          cd build
          /usr/bin/zip -qry "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa" Payload
          shasum -a 256 "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa" > "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-build${{ github.run_number }}-unsigned
          path: |
            build/BuFi-1.0.0-build${{ github.run_number }}-unsigned.ipa
            build/BuFi-1.0.0-build${{ github.run_number }}-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
