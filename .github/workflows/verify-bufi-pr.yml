name: Verify BuFi PR

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-bufi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: unsigned-ipa
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select stable Xcode 26.6
        run: |
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/BuFiSourcePackages
          key: ${{ runner.os }}-xcode26.6-spm-${{ hashFiles('project.yml') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare generated assets
        run: sh Scripts/prepare-assets.sh
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFiSourcePackages" \
            -parallelizeTargets \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcode26.log
      - name: Compile recommendation tests
        run: |
          set -o pipefail
          xcodebuild \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-Tests \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFiSourcePackages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee build/xcode26-tests.log
      - name: Upload Xcode 26 failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.4.0-xcode26-failure-log
          path: build/xcode26.log
          if-no-files-found: warn
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'BuFi.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/BuFi.app
          cd build
          /usr/bin/zip -qry BuFi-1.4.0-build15-unsigned.ipa Payload
          shasum -a 256 BuFi-1.4.0-build15-unsigned.ipa > BuFi-1.4.0-build15-unsigned.ipa.sha256
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.4.0-build15-unsigned
          path: |
            build/BuFi-1.4.0-build15-unsigned.ipa
            build/BuFi-1.4.0-build15-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  ios-27-compatibility:
    name: iOS 27 preview (advisory)
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/BuFi27SourcePackages
          key: ${{ runner.os }}-xcode27-spm-${{ hashFiles('project.yml') }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare generated assets
        run: sh Scripts/prepare-assets.sh
      - name: Generate project
        run: xcodegen generate
      - name: Build with iOS 27 SDK
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-27 \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFi27SourcePackages" \
            -parallelizeTargets \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcode27.log
      - name: Upload Xcode 27 preview log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.4.0-xcode27-preview-log
          path: build/xcode27.log
          if-no-files-found: warn
          retention-days: 14
