name: Verify BuFi PR

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  BUFI_BUILD_NUMBER: ${{ github.run_number }}

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-bufi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-alac:
    name: Apply ALAC background hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - name: Apply patch once
        run: |
          python3 Scripts/apply-alac-background-hardening.py
          if git diff --quiet -- BuFi/Playback/AudioEngine.swift; then
            echo "ALAC background hardening already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/Playback/AudioEngine.swift
          git commit -m "Harden ALAC playback across background transitions"
          git push origin HEAD:${{ github.head_ref }}

  unified-ios:
    name: Swift 6.4 unified iOS build
    needs: patch-alac
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Show build toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/BuFiSourcePackages
          key: ${{ runner.os }}-xcode27-swift6.4-spm-${{ hashFiles('project.yml', 'Package.resolved') }}

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Prepare generated assets
        run: sh Scripts/prepare-assets.sh

      - name: Generate project
        run: |
          plutil -lint BuFi/Resources/PrivacyInfo.xcprivacy
          xcodegen generate
          sh Scripts/apply-package-lock.sh

      - name: Verify Swift 6.4 unified configuration
        run: Scripts/verify-swift6-language-mode.sh

      - name: Build unsigned app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -disableAutomaticPackageResolution \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/BuFiSourcePackages" \
            -parallelizeTargets \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            STRIP_SWIFT_SYMBOLS=NO \
            STRIP_STYLE=non-global \
            CURRENT_PROJECT_VERSION="$BUFI_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcode.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-swift6.4-failure-logs
          path: |
            build/xcode.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'BuFi.app' -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")" = "17.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$BUFI_BUILD_NUMBER"
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/BuFi.app
          cd build
          /usr/bin/zip -qry "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa" Payload
          shasum -a 256 "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa" > "BuFi-1.0.0-build${BUFI_BUILD_NUMBER}-unsigned.ipa.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: BuFi-1.0.0-build${{ github.run_number }}-unsigned
          path: |
            build/BuFi-1.0.0-build${{ github.run_number }}-unsigned.ipa
            build/BuFi-1.0.0-build${{ github.run_number }}-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
