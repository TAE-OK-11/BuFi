name: One-shot LLM fallback cleanup

on:
  push:
    branches:
      - agent/smarter-recommendations
    paths:
      - .github/workflows/one-shot-llm-only-fallback-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/smarter-recommendations
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 Scripts/finish_llm_only_lyrics_patch.py
      - name: Commit cleanup
        run: |
          rm -f Scripts/finish_llm_only_lyrics_patch.py
          rm -f .github/workflows/one-shot-llm-only-fallback-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Avoid duplicate lyric LLM fallbacks"
          git push origin HEAD:agent/smarter-recommendations
