name: Apply network cache safety

on:
  push:
    branches:
      - codex/network-performance-pass

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/network-performance-pass
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply cache safety changes
        run: python Scripts/apply-network-cache-safety.py
      - name: Remove one-shot files
        run: rm -f Scripts/apply-network-cache-safety.py .github/workflows/apply-network-cache-safety.yml
      - name: Commit cache safety changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bound API response cache and invalidate after mutations"
          git push
