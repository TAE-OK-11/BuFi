name: Apply Core Stability Patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'core/stability-optimization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: core/stability-optimization
          fetch-depth: 0

      - name: Apply atomic offline commit fix
        id: patch
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python3 Scripts/apply-offline-commit-fix.py
            git diff --check
          } 2>&1 | tee .core-patch.log

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.patch.outcome }}" = "success" ]; then
            rm -f .core-patch.log
            git add BuFi/App/AppModel.swift BuFi/Core/OfflineStore.swift
            git commit -m "core: commit offline downloads atomically"
          else
            git restore BuFi/App/AppModel.swift BuFi/Core/OfflineStore.swift || true
            git add .core-patch.log
            git commit -m "ci: capture offline commit patch failure"
          fi
          git push origin HEAD:core/stability-optimization

      - name: Fail when patch failed
        if: steps.patch.outcome == 'failure'
        run: exit 1
