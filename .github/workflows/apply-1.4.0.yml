name: Apply BuFi 1.4.0 architecture

on:
  push:
    branches:
      - feat/light-mode-contrast-1.3.1
    paths:
      - .github/scripts/apply_light_contrast.py
      - .github/scripts/apply_architecture_1_4.py
      - .github/workflows/apply-1.4.0.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/light-mode-contrast-1.3.1
          fetch-depth: 0
      - name: Apply light mode and architecture patches
        run: |
          python3 .github/scripts/apply_light_contrast.py
          python3 .github/scripts/apply_architecture_1_4.py
      - name: Static validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('BuFi').rglob('*.swift'):
              text = path.read_text()
              assert '\\r' not in text, path
          project = Path('project.yml').read_text()
          assert 'CFBundleShortVersionString: "1.4.0"' in project
          assert 'CFBundleVersion: "15"' in project
          assert 'product: SwiftSonic' in project
          assert 'product: Nuke' in project
          print('static validation ok')
          PY
          git diff --check
      - name: Remove one-shot patch files
        run: |
          rm -f .github/scripts/apply_light_contrast.py
          rm -f .github/scripts/apply_architecture_1_4.py
          rm -f .github/workflows/apply-1.4.0.yml
      - name: Commit generated source changes
        run: |
          git config user.name "BuFi Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Adopt SwiftSonic, Nuke and resilient offline caching"
          git push origin HEAD:feat/light-mode-contrast-1.3.1
