name: Trigger one-shot network upgrade

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  trigger-network-upgrade:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply modern network patch
        run: python3 Scripts/apply-modern-network.py

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable modern network transport across BuFi"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
