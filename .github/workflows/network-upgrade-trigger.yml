name: Trigger one-shot network upgrade

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  trigger-network-upgrade:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Execute staged upgrade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/network-upgrade.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          exec(compile(script, 'network-upgrade.py', 'exec'))
          Path('.github/workflows/network-upgrade-trigger.yml').unlink()
          PY

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable modern network transport across BuFi"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
