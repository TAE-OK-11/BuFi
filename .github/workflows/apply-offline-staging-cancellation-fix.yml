name: Apply offline staging cancellation fix

on:
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - Scripts/apply_offline_staging_cancellation_fix.py
      - .github/workflows/apply-offline-staging-cancellation-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 0
      - name: Apply cancellation cleanup fix
        run: python3 Scripts/apply_offline_staging_cancellation_fix.py
      - name: Validate patch
        run: git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Core/OfflineStore.swift
          git commit -m 'Clean staged downloads on cancellation'
          git push origin HEAD:agent/swift-6-concurrency
