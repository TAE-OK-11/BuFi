              .frame(width: viewportWidth)''')

          replace_exact(path, '''    private func artworkPages(fallback item: PlaybackMediaItem) -> [PlayerArtworkPage] {
              let accountScope = playback.snapshot.accountScope
              let entries = playback.entries
              if entries.isEmpty {''', '''    private func artworkPages(
              in snapshot: PlaybackSnapshot,
              fallback item: PlaybackMediaItem
          ) -> [PlayerArtworkPage] {
              let accountScope = snapshot.accountScope
              let entries = snapshot.entries
              if entries.isEmpty {''')

          replace_exact(path, '''    private func indexForArtworkPage(_ page: PlayerArtworkPageID) -> Int? {
              playback.entries.firstIndex { entry in''', '''    private func indexForArtworkPage(
              _ page: PlayerArtworkPageID,
              in snapshot: PlaybackSnapshot
          ) -> Int? {
              snapshot.entries.firstIndex { entry in''')

          replace_exact(path, '''    private func syncArtworkPage(to snapshot: PlaybackSnapshot, animated: Bool) {
              guard let currentPage = currentArtworkPageID(in: snapshot) else {
                  artworkPage = nil
                  if palette != .fallback { palette = .fallback }
                  return
              }
              let update = {
                  artworkPage = currentPage
              }''', '''    private func syncArtworkPage(to snapshot: PlaybackSnapshot, animated: Bool) {
              guard let currentPage = currentArtworkPageID(in: snapshot) else {
                  pagerSelectionGate.beginProgrammaticMove(to: nil)
                  artworkPage = nil
                  if palette != .fallback { palette = .fallback }
                  return
              }
              if artworkPage != currentPage {
                  pagerSelectionGate.beginProgrammaticMove(to: currentPage)
              }
              let update = {
                  artworkPage = currentPage
              }''')

          replace_exact(path, '''    private func pruneArtworkPalettes(using snapshot: PlaybackSnapshot) {
              let validPages = Set(snapshot.entries.map { entry in
                  PlayerArtworkPageID(
                      queueEntryID: entry.id,
