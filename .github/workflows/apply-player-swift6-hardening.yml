name: Apply Swift 6 player hardening

on:
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - .github/workflows/apply-player-swift6-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 1

      - name: Apply player hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              print(f"{label}: {count} match(es)")
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              p.write_text(text.replace(old, new, 1))

          player = "BuFi/UI/PlayerView.swift"

          replace_once(
              player,
              "private struct PlayerArtworkPage: Identifiable {",
              '''struct PlayerPagerSelectionGate {
              private(set) var programmaticDestination: PlayerArtworkPageID?

              mutating func beginProgrammaticMove(to destination: PlayerArtworkPageID?) {
                  programmaticDestination = destination
              }

              mutating func beginUserInteraction() {
                  programmaticDestination = nil
              }

              mutating func shouldStartPlayback(for selection: PlayerArtworkPageID?) -> Bool {
                  guard let destination = programmaticDestination else {
                      return selection != nil
                  }
                  if selection == destination {
                      programmaticDestination = nil
                  }
                  return false
              }
          }

          private struct PlayerArtworkQueueCacheIdentity: Equatable {
              let entriesRevision: UInt64
              let accountScope: String?
          }

          private struct PlayerArtworkPage: Identifiable {''',
              "insert pager coordination types",
          )

          replace_once(
              player,
              "    @State private var artworkPage: PlayerArtworkPageID?\n",
              "    @State private var artworkPage: PlayerArtworkPageID?\n    @State private var pagerSelectionGate = PlayerPagerSelectionGate()\n",
              "add pager gate state",
          )

          replace_once(
              player,
              "        .onChange(of: playback.snapshot) { _, next in\n",
              "        .onChange(of: artworkQueueCacheIdentity) { _, _ in\n            let next = playback.snapshot\n",
              "use lightweight queue cache identity",
          )

          replace_once(
              player,
              "                guard artworkPage != page else { return }\n",
              "                let shouldStartPlayback = pagerSelectionGate.shouldStartPlayback(for: page)\n                guard artworkPage != page else { return }\n",
              "classify pager selection",
          )

          replace_once(
              player,
              "                guard let page,\n                      let destination = indexForArtworkPage(page),\n",
              "                guard shouldStartPlayback,\n                      let page,\n                      let destination = indexForArtworkPage(page),\n",
              "suppress programmatic playback",
          )

          replace_once(
              player,
              "        .scrollPosition(id: pagerPosition, anchor: .center)\n",
              '''        .scrollPosition(id: pagerPosition, anchor: .center)
              .simultaneousGesture(
                  DragGesture(minimumDistance: 5)
                      .onChanged { _ in
                          pagerSelectionGate.beginUserInteraction()
                      }
              )
          ''',
              "track user pager interaction",
          )

          replace_once(
              player,
              '''        guard let currentPage = currentArtworkPageID(in: snapshot) else {
                  artworkPage = nil
          ''',
              '''        guard let currentPage = currentArtworkPageID(in: snapshot) else {
                  pagerSelectionGate.beginProgrammaticMove(to: nil)
                  artworkPage = nil
          ''',
              "clear programmatic destination with empty queue",
          )

          replace_once(
              player,
              '''        let update = {
                  artworkPage = currentPage
              }
          ''',
              '''        if artworkPage != currentPage {
                  pagerSelectionGate.beginProgrammaticMove(to: currentPage)
              }
              let update = {
                  artworkPage = currentPage
              }
          ''',
              "mark programmatic pager movement",
          )

          replace_once(
              player,
              "    private func pruneArtworkPalettes(using snapshot: PlaybackSnapshot) {\n",
              '''    private var artworkQueueCacheIdentity: PlayerArtworkQueueCacheIdentity {
              let snapshot = playback.snapshot
              return PlayerArtworkQueueCacheIdentity(
                  entriesRevision: playback.entriesRevision,
                  accountScope: snapshot.accountScope
              )
          }

          private func pruneArtworkPalettes(using snapshot: PlaybackSnapshot) {
          ''',
              "add queue revision identity",
          )

          replace_once(
              player,
              "        artworkPalettes = artworkPalettes.filter { validPages.contains($0.key) }\n",
              '''        let filtered = artworkPalettes.filter { validPages.contains($0.key) }
              if filtered.count != artworkPalettes.count {
                  artworkPalettes = filtered
              }
          ''',
              "avoid no-op palette cache publication",
          )

          replace_once(
              player,
              "    var body: some View {\n        NavigationStack {\n            Group {\n",
              "    var body: some View {\n        let currentQueueEntryID = playback.currentItem?.queueEntryID\n        NavigationStack {\n            Group {\n",
              "cache current queue occurrence in QueueView",
          )

          replace_once(
              player,
              "                            let isCurrent = entry.id == playback.currentItem?.queueEntryID\n",
              "                            let isCurrent = entry.id == currentQueueEntryID\n",
              "reuse current queue occurrence",
          )

          tests = "BuFiTests/PlayerPresentationStateTests.swift"
          replace_once(
              tests,
              "    private func song(id: String, coverArt: String?) -> Song {\n",
              '''    func testPagerGateSuppressesProgrammaticScrollUntilDestination() {
              let intermediate = artworkPageID(songID: "intermediate")
              let destination = artworkPageID(songID: "destination")
              var gate = PlayerPagerSelectionGate()

              gate.beginProgrammaticMove(to: destination)

              XCTAssertFalse(gate.shouldStartPlayback(for: intermediate))
              XCTAssertEqual(gate.programmaticDestination, destination)
              XCTAssertFalse(gate.shouldStartPlayback(for: destination))
              XCTAssertNil(gate.programmaticDestination)
          }

          func testPagerGateLetsUserTakeOverProgrammaticScroll() {
              let destination = artworkPageID(songID: "destination")
              let userSelection = artworkPageID(songID: "user-selection")
              var gate = PlayerPagerSelectionGate()

              gate.beginProgrammaticMove(to: destination)
              gate.beginUserInteraction()

              XCTAssertNil(gate.programmaticDestination)
              XCTAssertTrue(gate.shouldStartPlayback(for: userSelection))
          }

          private func artworkPageID(songID: String) -> PlayerArtworkPageID {
              PlayerArtworkPageID(
                  queueEntryID: UUID(),
                  songID: songID,
                  coverArtID: "cover-" + songID,
                  artworkRevision: "revision-" + songID,
                  accountScope: "account"
              )
          }

          private func song(id: String, coverArt: String?) -> Song {
          ''',
              "add pager gate regression tests",
          )
          PY

          git diff --check

      - name: Commit player hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/UI/PlayerView.swift BuFiTests/PlayerPresentationStateTests.swift
          git commit -m "Harden Swift 6 player state transitions"
          git push origin HEAD:agent/swift-6-concurrency
