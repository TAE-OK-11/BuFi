name: Apply streaming latency Swift 6 patch

on:
  push:
    branches:
      - agent/streaming-latency-swift6

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/streaming-latency-swift6
          fetch-depth: 0
      - name: Apply exact source patches
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          audio_path = Path('BuFi/Playback/AudioEngine.swift')
          audio = audio_path.read_text()

          audio = replace_once(
              audio,
              '''enum PlaybackRecoveryPolicy {\n    static func startupNudgeTarget(''',
              '''enum PlaybackRecoveryPolicy {\n    static let initialRecoveryDelay: Duration = .milliseconds(900)\n    static let progressObservationDelay: Duration = .milliseconds(1_600)\n    static let managedBufferingGrace: Duration = .milliseconds(1_200)\n\n    static func startupNudgeTarget(''',
              'recovery timing constants'
          )

          audio = replace_once(
              audio,
              '''enum PlaybackGaplessPreparationPolicy {\n    static func shouldPrepare(''',
              '''enum PlaybackSuccessorWarmupPolicy {\n    static let stablePlaybackDelay: Duration = .milliseconds(900)\n\n    static func shouldWarm(\n        isBuffering: Bool,\n        isActivelyPlaying: Bool,\n        isLikelyToKeepUp: Bool\n    ) -> Bool {\n        isActivelyPlaying && !isBuffering && isLikelyToKeepUp\n    }\n}\n\nenum PlaybackGaplessPreparationPolicy {\n    static func shouldPrepare(''',
              'successor warmup policy'
          )

          # Restore latency-first playback on all normal start/resume paths.
          self_play_count = audio.count('self.player.play()')
          if self_play_count != 4:
              raise SystemExit(f'self.player.play(): expected 4, found {self_play_count}')
          audio = audio.replace('self.player.play()', 'self.playLatencyOptimized()', 4)

          audio = replace_once(
              audio,
              '''        if !needsReload {\n            player.play()\n        }''',
              '''        if !needsReload {\n            playLatencyOptimized()\n        }''',
              'resume latency start'
          )
          audio = replace_once(
              audio,
              '''        player.volume = 1\n        player.play()\n        recomputeTimelineFromPlayer()''',
              '''        player.volume = 1\n        playLatencyOptimized()\n        recomputeTimelineFromPlayer()''',
              'secondary latency start'
          )

          audio = replace_once(
              audio,
              '''    func resumePlayback() {''',
              '''    private func playLatencyOptimized() {\n        // Keep AVPlayer's stall-management enabled globally, but do not pay its\n        // startup buffering tax for explicit starts, resumes, seeks, or a\n        // ready-to-play item. Mid-stream recovery still gets a bounded managed\n        // buffering grace before this fast path is used.\n        player.playImmediately(atRate: 1)\n    }\n\n    func resumePlayback() {''',
              'latency helper'
          )

          audio = replace_once(
              audio,
              '''    private static let preparedPlaybackAssetLimit = 1''',
              '''    private static let preparedPlaybackAssetLimit = 2''',
              'prepared asset cache limit'
          )

          old_prepare = '''                let asset = Self.makeURLAsset(\n                    url: resource.url,\n                    mimeType: resource.mimeType\n                )\n                do {\n                    // This opens the transport, validates the stream response,\n                    // and loads enough AVFoundation metadata that a skip can\n                    // reuse the same asset during the page transition.\n                    _ = try await asset.load(.isPlayable)\n                    guard !Task.isCancelled else { return }\n                    let prepared = PreparedPlaybackAsset(\n                        key: key,\n                        queueEntryID: entry.id,\n                        songID: song.id,\n                        streamRevision: song.audioResourceRevision,\n                        compatibilityFormat: compatibilityFormat,\n                        asset: asset\n                    )\n                    self.storePreparedPlaybackAsset(prepared)\n                    self.stagePreparedSuccessorIfPossible(prepared)\n                } catch {}'''
          new_prepare = '''                let asset = Self.makeURLAsset(\n                    url: resource.url,\n                    mimeType: resource.mimeType\n                )\n                let prepared = PreparedPlaybackAsset(\n                    key: key,\n                    queueEntryID: entry.id,\n                    songID: song.id,\n                    streamRevision: song.audioResourceRevision,\n                    compatibilityFormat: compatibilityFormat,\n                    asset: asset\n                )\n                // Publish the exact AVURLAsset before transport warmup finishes.\n                // If the user skips while `load(.isPlayable)` is still running,\n                // active playback can take over this partially warmed asset\n                // instead of opening a duplicate request for the same song.\n                self.storePreparedPlaybackAsset(prepared)\n                do {\n                    _ = try await asset.load(.isPlayable)\n                    guard !Task.isCancelled else { return }\n                    self.stagePreparedSuccessorIfPossible(prepared)\n                } catch {\n                    // A failed speculative asset must not remain reusable. If\n                    // active playback already took ownership, the token was\n                    // cleared and AVPlayer's normal failure/fallback path owns it.\n                    if self.preparedPlaybackWarmupTokens[key] == warmupToken {\n                        self.preparedPlaybackAssets[key] = nil\n                        self.preparedPlaybackAssetOrder.removeAll { $0 == key }\n                    }\n                }'''
          audio = replace_once(audio, old_prepare, new_prepare, 'in-flight prepared asset reuse')

          audio = replace_once(
              audio,
              '''    private func scheduleNetworkPrefetch() {''',
              '''    private func warmImmediateSuccessorAfterStablePlayback(\n        currentPlaybackID: UUID?,\n        entry: PlaybackQueueEntry?\n    ) async {\n        guard let currentPlaybackID, let entry else { return }\n        do {\n            try await Task.sleep(\n                for: PlaybackSuccessorWarmupPolicy.stablePlaybackDelay\n            )\n        } catch {\n            return\n        }\n        guard !Task.isCancelled,\n              allowsSpeculativeNetworkPrefetch,\n              currentPlaybackItem?.id == currentPlaybackID,\n              PlaybackSuccessorWarmupPolicy.shouldWarm(\n                isBuffering: isBuffering,\n                isActivelyPlaying: wantsPlayback\n                    && player.timeControlStatus == .playing,\n                isLikelyToKeepUp: player.currentItem?.isPlaybackLikelyToKeepUp == true\n              ) else {\n            return\n        }\n        preparePlaybackAsset(for: entry)\n    }\n\n    private func scheduleNetworkPrefetch() {''',
              'structured successor warmup method'
          )

          old_prefetch = '''        guard lastNetworkPrefetchKey != plan.key else { return }\n        cancelNetworkPrefetch(resetKey: false)\n        lastNetworkPrefetchKey = plan.key\n\n        // Keep speculative work light while the active stream is playing.\n        // Opening/staging the next AVURLAsset starts a second media transport and\n        // can compete with the current stream. Gapless media preparation is now\n        // deferred to the final playback window by scheduleGaplessSuccessor().\n\n        let token = UUID()\n        networkPrefetchToken = token\n        networkPrefetchTask = Task(priority: .utility) { [weak self] in'''
          new_prefetch = '''        guard lastNetworkPrefetchKey != plan.key else { return }\n        cancelNetworkPrefetch(resetKey: false)\n        lastNetworkPrefetchKey = plan.key\n\n        // Warm only the deterministic immediate successor, and only after the\n        // active item has demonstrated stable playback. The warmup is a\n        // structured child of this prefetch task, so queue/account cancellation\n        // tears it down with the rest of the speculative work.\n        let currentPlaybackID = currentPlaybackItem?.id\n        let successorEntry: PlaybackQueueEntry? = GaplessSuccessorPlan.make(\n            queueCount: queue.count,\n            currentIndex: queueIndex,\n            shuffleEnabled: isShuffleEnabled,\n            repeatMode: repeatMode\n        ).flatMap { plan in\n            playbackState.entries.indices.contains(plan.queueIndex)\n                ? playbackState.entries[plan.queueIndex]\n                : nil\n        }\n\n        let token = UUID()\n        networkPrefetchToken = token\n        networkPrefetchTask = Task(priority: .utility) { [weak self] in'''
          audio = replace_once(audio, old_prefetch, new_prefetch, 'prefetch successor context')

          audio = replace_once(
              audio,
              '''            async let lyricsPrefetch: Void = client.prefetchLyrics(\n                songIDs: plan.upcomingSongs.map(\\.id)\n            )''',
              '''            async let successorWarmup: Void = self.warmImmediateSuccessorAfterStablePlayback(\n                currentPlaybackID: currentPlaybackID,\n                entry: successorEntry\n            )\n            async let lyricsPrefetch: Void = client.prefetchLyrics(\n                songIDs: plan.upcomingSongs.map(\\.id)\n            )''',
              'structured warmup child'
          )
          audio = replace_once(
              audio,
              '''            await lyricsPrefetch\n            guard !Task.isCancelled else { return }''',
              '''            await lyricsPrefetch\n            await successorWarmup\n            guard !Task.isCancelled else { return }''',
              'await structured warmup'
          )

          old_recovery = '''    private func schedulePlaybackRecovery() {\n        guard wantsPlayback,\n              currentSong != nil,\n              recoveryTask == nil,\n              !isSeekInFlight,\n              pendingSeekPosition == nil else { return }\n        if player.timeControlStatus != .playing {\n            isBuffering = true\n        }\n        guard networkPathIsSatisfied else { return }\n        let recoveryStartPosition = currentPlayerPosition()\n        let token = UUID()\n        recoveryToken = token\n        recoveryTask = Task { [weak self] in\n            do {\n                try await Task.sleep(for: .milliseconds(1_250))\n            } catch {\n                return\n            }\n            guard let self else { return }\n            defer {\n                if self.recoveryToken == token {\n                    self.recoveryToken = nil\n                    self.recoveryTask = nil\n                }\n            }\n            guard !Task.isCancelled, self.wantsPlayback,\n                  !self.isSeekInFlight,\n                  self.pendingSeekPosition == nil,\n                  let item = self.player.currentItem else { return }\n            var progressBaseline = recoveryStartPosition\n            let positionBeforeAttempt = self.currentPlayerPosition()\n            if self.player.timeControlStatus == .playing,\n               PlaybackRecoveryPolicy.hasMeaningfulProgress(\n                    from: recoveryStartPosition,\n                    to: positionBeforeAttempt\n               ) {\n                return\n            }\n\n            if PlaybackRecoveryPolicy.shouldForceImmediatePlayback(\n                timeControlStatus: self.player.timeControlStatus,\n                waitingReason: self.player.reasonForWaitingToPlay\n            ) {\n                self.configureAudioSession()\n                self.player.playImmediately(atRate: 1)\n                self.recomputeTimelineFromPlayer()\n                self.installNextLyricBoundary(after: self.elapsed)\n            }\n\n            if item.status == .readyToPlay,\n               self.currentSong?.externalStreamURL == nil,\n               !self.isSeekInFlight,\n               self.pendingSeekPosition == nil,\n               !PlaybackRecoveryPolicy.isManagedBufferingWait(\n                    timeControlStatus: self.player.timeControlStatus,\n                    waitingReason: self.player.reasonForWaitingToPlay\n               ),\n               let target = PlaybackRecoveryPolicy.startupNudgeTarget(\n                    elapsed: positionBeforeAttempt,\n                    duration: self.duration,\n                    alreadyAttempted: self.startupNudgedItem === item\n               ),\n               self.canSeek(item, to: target) {\n                self.startupNudgedItem = item\n                progressBaseline = target\n                self.seekPlayer(\n                    to: target,\n                    persistsQueue: false,\n                    resumesPlayback: true,\n                    exactly: true\n                )\n            }\n\n            do {\n                try await Task.sleep(for: .seconds(3))\n            } catch {\n                return\n            }\n            guard !Task.isCancelled, self.wantsPlayback,\n                  self.networkPathIsSatisfied,\n                  !self.isSeekInFlight,\n                  self.pendingSeekPosition == nil,\n                  self.player.currentItem === item else { return }\n            if self.player.timeControlStatus == .playing,\n               PlaybackRecoveryPolicy.hasMeaningfulProgress(\n                    from: progressBaseline,\n                    to: self.currentPlayerPosition()\n               ) {\n                return\n            }\n\n            if PlaybackRecoveryPolicy.isManagedBufferingWait(\n                timeControlStatus: self.player.timeControlStatus,\n                waitingReason: self.player.reasonForWaitingToPlay\n            ) {\n                // AVPlayer has deliberately paused to build a safer buffer.\n                // Give that buffer time to fill instead of throwing away the\n                // partially loaded item and restarting the HTTP media request.\n                do {\n                    try await Task.sleep(for: .seconds(4))\n                } catch {\n                    return\n                }\n                guard !Task.isCancelled, self.wantsPlayback,\n                      self.networkPathIsSatisfied,\n                      !self.isSeekInFlight,\n                      self.pendingSeekPosition == nil,\n                      self.player.currentItem === item else { return }\n                if self.player.timeControlStatus == .playing,\n                   PlaybackRecoveryPolicy.hasMeaningfulProgress(\n                        from: progressBaseline,\n                        to: self.currentPlayerPosition()\n                   ) {\n                    return\n                }\n            }\n'''
          new_recovery = '''    private func schedulePlaybackRecovery() {\n        guard wantsPlayback,\n              currentSong != nil,\n              recoveryTask == nil,\n              !isSeekInFlight,\n              pendingSeekPosition == nil else { return }\n        if player.timeControlStatus != .playing {\n            isBuffering = true\n        }\n        guard networkPathIsSatisfied else { return }\n        let recoveryStartPosition = currentPlayerPosition()\n        let token = UUID()\n        recoveryToken = token\n        recoveryTask = Task { [weak self] in\n            do {\n                try await Task.sleep(\n                    for: PlaybackRecoveryPolicy.initialRecoveryDelay\n                )\n            } catch {\n                return\n            }\n            guard let self else { return }\n            defer {\n                if self.recoveryToken == token {\n                    self.recoveryToken = nil\n                    self.recoveryTask = nil\n                }\n            }\n            guard !Task.isCancelled, self.wantsPlayback,\n                  !self.isSeekInFlight,\n                  self.pendingSeekPosition == nil,\n                  let item = self.player.currentItem else { return }\n            var progressBaseline = recoveryStartPosition\n            let positionBeforeAttempt = self.currentPlayerPosition()\n            if self.player.timeControlStatus == .playing,\n               PlaybackRecoveryPolicy.hasMeaningfulProgress(\n                    from: recoveryStartPosition,\n                    to: positionBeforeAttempt\n               ) {\n                return\n            }\n\n            let wasManagedBuffering = PlaybackRecoveryPolicy.isManagedBufferingWait(\n                timeControlStatus: self.player.timeControlStatus,\n                waitingReason: self.player.reasonForWaitingToPlay\n            )\n            if wasManagedBuffering {\n                // Managed buffering gets a short chance to fill, not the old\n                // multi-second startup penalty. If it still has not progressed,\n                // switch to the latency-first path before considering a reload.\n                do {\n                    try await Task.sleep(\n                        for: PlaybackRecoveryPolicy.managedBufferingGrace\n                    )\n                } catch {\n                    return\n                }\n                guard !Task.isCancelled, self.wantsPlayback,\n                      self.networkPathIsSatisfied,\n                      !self.isSeekInFlight,\n                      self.pendingSeekPosition == nil,\n                      self.player.currentItem === item else { return }\n                if self.player.timeControlStatus == .playing,\n                   PlaybackRecoveryPolicy.hasMeaningfulProgress(\n                        from: progressBaseline,\n                        to: self.currentPlayerPosition()\n                   ) {\n                    return\n                }\n            }\n\n            self.configureAudioSession()\n            self.playLatencyOptimized()\n            self.recomputeTimelineFromPlayer()\n            self.installNextLyricBoundary(after: self.elapsed)\n\n            if item.status == .readyToPlay,\n               self.currentSong?.externalStreamURL == nil,\n               !self.isSeekInFlight,\n               self.pendingSeekPosition == nil,\n               let target = PlaybackRecoveryPolicy.startupNudgeTarget(\n                    elapsed: positionBeforeAttempt,\n                    duration: self.duration,\n                    alreadyAttempted: self.startupNudgedItem === item\n               ),\n               self.canSeek(item, to: target) {\n                self.startupNudgedItem = item\n                progressBaseline = target\n                self.seekPlayer(\n                    to: target,\n                    persistsQueue: false,\n                    resumesPlayback: true,\n                    exactly: true\n                )\n            }\n\n            do {\n                try await Task.sleep(\n                    for: PlaybackRecoveryPolicy.progressObservationDelay\n                )\n            } catch {\n                return\n            }\n            guard !Task.isCancelled, self.wantsPlayback,\n                  self.networkPathIsSatisfied,\n                  !self.isSeekInFlight,\n                  self.pendingSeekPosition == nil,\n                  self.player.currentItem === item else { return }\n            if self.player.timeControlStatus == .playing,\n               PlaybackRecoveryPolicy.hasMeaningfulProgress(\n                    from: progressBaseline,\n                    to: self.currentPlayerPosition()\n               ) {\n                return\n            }\n'''
          audio = replace_once(audio, old_recovery, new_recovery, 'bounded low-latency recovery')

          audio_path.write_text(audio)

          rec_path = Path('BuFi/Core/RecommendationEngine.swift')
          rec = rec_path.read_text()

          rec = replace_once(
              rec,
              '''private final class RecommendationMixCache: @unchecked Sendable {''',
              '''private struct RecommendationSourceSignals: Sendable {\n    var server = 0.0\n    var sonic = 0.0\n    var similar = 0.0\n    var genre = 0.0\n    var topArtist = 0.0\n    var recent = 0.0\n    var popular = 0.0\n    var playlist = 0.0\n    var discovery = 0.0\n    var lastFM = 0.0\n    var listenBrainz = 0.0\n}\n\nprivate struct RecommendationSourceIndex: Sendable {\n    private var values: [String: RecommendationSourceSignals] = [:]\n\n    init(snapshot: HomeSnapshot) {\n        ingest(snapshot.serverRecommendedSongs, at: \\.server)\n        ingest(snapshot.sonicRecommendedSongs, at: \\.sonic)\n        ingest(snapshot.similarArtistSongs, at: \\.similar)\n        ingest(snapshot.genreRecommendedSongs, at: \\.genre)\n        ingest(snapshot.topArtistSongs, at: \\.topArtist)\n        ingest(snapshot.recentlyAddedSongs, at: \\.recent)\n        ingest(\n            [snapshot.popularSongs, snapshot.mostPlayedSongs],\n            at: \\.popular\n        )\n        ingest(snapshot.playlistAffinitySongs, at: \\.playlist)\n        ingest(snapshot.randomSongs, at: \\.discovery)\n        ingest(snapshot.lastFMRecommendedSongs, at: \\.lastFM)\n        ingest(snapshot.listenBrainzRecommendedSongs, at: \\.listenBrainz)\n    }\n\n    subscript(songID: String) -> RecommendationSourceSignals {\n        values[songID] ?? RecommendationSourceSignals()\n    }\n\n    private mutating func ingest(\n        _ songs: [Song],\n        at keyPath: WritableKeyPath<RecommendationSourceSignals, Double>\n    ) {\n        ingest([songs], at: keyPath)\n    }\n\n    private mutating func ingest(\n        _ sources: [[Song]],\n        at keyPath: WritableKeyPath<RecommendationSourceSignals, Double>\n    ) {\n        let capacity = sources.reduce(into: 0) { $0 += $1.count }\n        var seen = Set<String>()\n        seen.reserveCapacity(capacity)\n        var orderedIDs: [String] = []\n        orderedIDs.reserveCapacity(capacity)\n        var visited = 0\n        for source in sources {\n            for song in source {\n                if visited.isMultiple(of: 64), Task.isCancelled { return }\n                visited += 1\n                if seen.insert(song.id).inserted {\n                    orderedIDs.append(song.id)\n                }\n            }\n        }\n        let count = orderedIDs.count\n        guard count > 0 else { return }\n        for (rank, songID) in orderedIDs.enumerated() {\n            var signals = values[songID] ?? RecommendationSourceSignals()\n            signals[keyPath: keyPath] = count == 1\n                ? 1\n                : 1 - Double(rank) / Double(count)\n            values[songID] = signals\n        }\n    }\n}\n\nprivate final class RecommendationMixCache: @unchecked Sendable {''',
              'source signal index structs'
          )

          old_rank_maps = '''        let serverRanks = rankMap(snapshot.serverRecommendedSongs)\n        let sonicRanks = rankMap(snapshot.sonicRecommendedSongs)\n        let similarRanks = rankMap(snapshot.similarArtistSongs)\n        let genreRanks = rankMap(snapshot.genreRecommendedSongs)\n        let topArtistRanks = rankMap(snapshot.topArtistSongs)\n        let recentRanks = rankMap(snapshot.recentlyAddedSongs)\n        let popularRanks = rankMap(snapshot.popularSongs + snapshot.mostPlayedSongs)\n        let playlistRanks = rankMap(snapshot.playlistAffinitySongs)\n        let discoveryRanks = rankMap(snapshot.randomSongs)\n        let lastFMRanks = rankMap(snapshot.lastFMRecommendedSongs)\n        let listenBrainzRanks = rankMap(snapshot.listenBrainzRecommendedSongs)\n        guard !Task.isCancelled else { return [] }'''
          rec = replace_once(
              rec,
              old_rank_maps,
              '''        let sourceIndex = RecommendationSourceIndex(snapshot: snapshot)\n        guard !Task.isCancelled else { return [] }''',
              'single source index'
          )

          rec = replace_once(
              rec,
              '''            let serverScore = consensusScore(\n                rankScore(song.id, in: serverRanks),\n                rankScore(song.id, in: sonicRanks),\n                rankScore(song.id, in: similarRanks),\n                rankScore(song.id, in: genreRanks),\n                rankScore(song.id, in: topArtistRanks)\n            )''',
              '''            let sourceSignals = sourceIndex[song.id]\n            let serverScore = consensusScore(\n                sourceSignals.server,\n                sourceSignals.sonic,\n                sourceSignals.similar,\n                sourceSignals.genre,\n                sourceSignals.topArtist\n            )''',
              'server signal lookup'
          )
          rec = replace_once(
              rec,
              '''                rankScore(song.id, in: recentRanks)''',
              '''                sourceSignals.recent''',
              'recent signal lookup'
          )
          rec = replace_once(
              rec,
              '''                rankScore(song.id, in: playlistRanks),''',
              '''                sourceSignals.playlist,''',
              'playlist signal lookup'
          )
          rec = replace_once(
              rec,
              '''                rankScore(song.id, in: popularRanks),''',
              '''                sourceSignals.popular,''',
              'popular signal lookup'
          )
          rec = replace_once(
              rec,
              '''                score: rankScore(song.id, in: discoveryRanks)''',
              '''                score: sourceSignals.discovery''',
              'discovery signal lookup'
          )
          rec = replace_once(
              rec,
              '''                score: rankScore(song.id, in: lastFMRanks)''',
              '''                score: sourceSignals.lastFM''',
              'lastfm signal lookup'
          )
          rec = replace_once(
              rec,
              '''                score: rankScore(song.id, in: listenBrainzRanks)''',
              '''                score: sourceSignals.listenBrainz''',
              'listenbrainz signal lookup'
          )

          old_conf_call = '''            let sourceConfidence = sourceConfidence(\n                song: song,\n                metadata: metadata,\n                lastFMRanks: lastFMRanks,\n                listenBrainzRanks: listenBrainzRanks,\n                sonicRanks: sonicRanks,\n                similarRanks: similarRanks,\n                favoriteGenres: favoriteGenres\n            )'''
          new_conf_call = '''            let sourceConfidence = sourceConfidence(\n                metadata: metadata,\n                signals: sourceSignals,\n                favoriteGenres: favoriteGenres\n            )'''
          rec = replace_once(rec, old_conf_call, new_conf_call, 'source confidence call')

          old_conf_func = '''    private static func sourceConfidence(\n        song: Song,\n        metadata: RecommendationCandidateMetadata,\n        lastFMRanks: [String: Int],\n        listenBrainzRanks: [String: Int],\n        sonicRanks: [String: Int],\n        similarRanks: [String: Int],\n        favoriteGenres: Set<String>\n    ) -> Double {\n        let lastFM = lastFMRanks[song.id] != nil\n        let listenBrainz = listenBrainzRanks[song.id] != nil\n        if lastFM, listenBrainz {\n            if metadata.genreKeys.contains(where: favoriteGenres.contains) {\n                return 0.90\n            }\n            return 0.75\n        }\n        if lastFM || listenBrainz { return 0.45 }\n        if sonicRanks[song.id] != nil { return 0.88 }\n        if similarRanks[song.id] != nil { return 0.80 }\n        return 0.62\n    }'''
          new_conf_func = '''    private static func sourceConfidence(\n        metadata: RecommendationCandidateMetadata,\n        signals: RecommendationSourceSignals,\n        favoriteGenres: Set<String>\n    ) -> Double {\n        let lastFM = signals.lastFM > 0\n        let listenBrainz = signals.listenBrainz > 0\n        if lastFM, listenBrainz {\n            if metadata.genreKeys.contains(where: favoriteGenres.contains) {\n                return 0.90\n            }\n            return 0.75\n        }\n        if lastFM || listenBrainz { return 0.45 }\n        if signals.sonic > 0 { return 0.88 }\n        if signals.similar > 0 { return 0.80 }\n        return 0.62\n    }'''
          rec = replace_once(rec, old_conf_func, new_conf_func, 'source confidence function')

          old_rank_helpers = '''    private static func rankMap(_ values: [Song]) -> [String: Int] {\n        var result: [String: Int] = [:]\n        result.reserveCapacity(values.count)\n        for (index, song) in values.enumerated() {\n            if index.isMultiple(of: 64), Task.isCancelled { return [:] }\n            if result[song.id] == nil { result[song.id] = result.count }\n        }\n        return result\n    }\n\n    private static func rankScore(_ id: String, in ranks: [String: Int]) -> Double {\n        guard let rank = ranks[id] else { return 0 }\n        guard !ranks.isEmpty else { return 0 }\n        if ranks.count == 1 { return 1 }\n        return 1 - Double(rank) / Double(ranks.count)\n    }\n\n'''
          rec = replace_once(rec, old_rank_helpers, '', 'remove rank map helpers')

          rec_path.write_text(rec)

          test_path = Path('BuFiTests/PlaybackPrefetchPlanTests.swift')
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              '''    func testGaplessPreparationDoesNotOpenSecondStreamEarly() {''',
              '''    func testStableSuccessorWarmupRequiresHealthyPlayback() {\n        XCTAssertTrue(PlaybackSuccessorWarmupPolicy.shouldWarm(\n            isBuffering: false,\n            isActivelyPlaying: true,\n            isLikelyToKeepUp: true\n        ))\n        XCTAssertFalse(PlaybackSuccessorWarmupPolicy.shouldWarm(\n            isBuffering: true,\n            isActivelyPlaying: true,\n            isLikelyToKeepUp: true\n        ))\n        XCTAssertFalse(PlaybackSuccessorWarmupPolicy.shouldWarm(\n            isBuffering: false,\n            isActivelyPlaying: true,\n            isLikelyToKeepUp: false\n        ))\n    }\n\n    func testGaplessPreparationDoesNotOpenSecondStreamEarly() {''',
              'successor warmup regression test'
          )
          test_path.write_text(tests)
          PY

          git diff --check
          git status --short
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/Playback/AudioEngine.swift BuFi/Core/RecommendationEngine.swift BuFiTests/PlaybackPrefetchPlanTests.swift
          git diff --cached --quiet && exit 0
          git commit -m "Reduce playback latency and recommendation overhead"
          git push origin HEAD:agent/streaming-latency-swift6
