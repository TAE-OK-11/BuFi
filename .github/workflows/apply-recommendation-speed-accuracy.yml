        let negative =
            Double(value.earlySkipCount) * 0.8
            + Double(value.repeatedSkipCount)
            + Double(value.queueRemovalCount) * 0.65
        let positive =
            Double(value.completedCount) * 0.45
            + Double(value.favoriteCount) * 1.5
            + Double(value.playlistAddCount) * 1.2
            + Double(value.manualPlayCount) * 0.18
        let saturation = 1 - exp(-negative / 3)
