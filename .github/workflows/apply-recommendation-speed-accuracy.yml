name: Apply Recommendation Speed Accuracy

on:
  push:
    branches:
      - agent/recommendation-accuracy-speed

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/recommendation-accuracy-speed
          fetch-depth: 0

      - name: Apply recommendation optimization
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('BuFi/Core/RecommendationEngine.swift')
          text = path.read_text()

          def replace(old, new, count=1):
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} matches, found {actual}: {old[:120]!r}')
              text = text.replace(old, new, count)

