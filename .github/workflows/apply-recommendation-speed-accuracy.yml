    let artistKey: String
    let albumKey: String
    let genreKeys: [String]
    let moodKeys: [String]
    let timeText: String
    let deduplicationKey: String

    init(song: Song) {
        artistKey = Self.artistKey(for: song)
        albumKey = RecommendationMixer.normalized(song.albumId ?? song.album)
        genreKeys = Self.genreKeys(for: song)
