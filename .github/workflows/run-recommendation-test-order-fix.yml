name: Run Recommendation Test Order Fix

on:
  push:
    branches:
      - agent/recommendation-accuracy-speed

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply test fixture fix
        run: python3 .github/scripts/fix_recommendation_test_order.py
      - name: Commit test fixture fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFiTests/RecommendationEngineTests.swift
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix recommendation test snapshot ordering'
          git push origin HEAD:agent/recommendation-accuracy-speed
