name: BuFi API Audit PR Patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-api-audit:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: backend-core-lightweight
          fetch-depth: 1

      - name: Patch API cancellation and external retries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          subsonic = Path('BuFi/Core/OpenSubsonicClient.swift')
          replace_once(
              subsonic,
              '''    private func bestEffortWithFallback<Payload: Decodable & Sendable>(
                  _ endpoints: [String],
                  parameters: [String: String] = [:]
              ) async -> Payload? {
                  do {
                      return try await readWithFallback(endpoints, parameters: parameters)
                  } catch {
                      return nil
                  }
              }
''',
              '''    private func bestEffortWithFallback<Payload: Decodable & Sendable>(
                  _ endpoints: [String],
                  parameters: [String: String] = [:]
              ) async throws -> Payload? {
                  do {
                      return try await readWithFallback(endpoints, parameters: parameters)
                  } catch is CancellationError {
                      throw CancellationError()
                  } catch {
                      if TransientServiceFailurePolicy.isAuthenticationFailure(error) {
                          throw error
                      }
                      return nil
                  }
              }
''',
              'fallback cancellation/auth propagation'
          )
          replace_once(
              subsonic,
              '''    private func albumList(
                  _ type: String,
                  size: String
              ) async throws -> AlbumListPayload? {
                  await bestEffortWithFallback(
''',
              '''    private func albumList(
                  _ type: String,
                  size: String
              ) async throws -> AlbumListPayload? {
                  try await bestEffortWithFallback(
''',
              'album list throwing fallback'
          )

          recommendation = Path('BuFi/Core/RecommendationEngine.swift')
          old = '''    private func responseData(
                  url: URL,
                  token: String?,
                  allowsCaching: Bool,
                  acceptsZstandard: Bool
              ) async throws -> Data {
                  var request = URLRequest(url: url)
                  ModernNetworkPolicy.prepareExternalAPIRequest(
                      &request,
                      acceptsZstandard: acceptsZstandard
                  )
                  if !acceptsZstandard {
                      // Do not let a malformed zstd response cached by an intermediary
                      // satisfy the compatibility retry with the same bytes.
                      request.cachePolicy = .reloadIgnoringLocalCacheData
                  }
                  if !allowsCaching {
                      request.cachePolicy = .reloadIgnoringLocalCacheData
                  }
                  request.setValue("BuFi/1.0.0", forHTTPHeaderField: "User-Agent")
                  if let token, !token.isEmpty {
                      request.setValue("Token \\(token)", forHTTPHeaderField: "Authorization")
                  }
                  try Task.checkCancellation()
                  let session = allowsCaching ? publicSession : privateSession
                  let (data, response) = try await session.data(for: request)
                  try Task.checkCancellation()
                  guard let http = response as? HTTPURLResponse,
                        (200..<300).contains(http.statusCode) else {
                      throw URLError(.badServerResponse)
                  }
                  guard data.count <= 4 * 1_024 * 1_024 else {
                      throw URLError(.dataLengthExceedsMaximum)
                  }
                  let decoded = try await HTTPContentDecoder.decodeAsync(
                      data,
                      contentEncoding: http.value(forHTTPHeaderField: "Content-Encoding")
                  )
                  guard decoded.count <= 4 * 1_024 * 1_024 else {
                      throw URLError(.dataLengthExceedsMaximum)
                  }
                  return decoded
              }
'''
          new = '''    private func responseData(
                  url: URL,
                  token: String?,
                  allowsCaching: Bool,
                  acceptsZstandard: Bool
              ) async throws -> Data {
                  var request = URLRequest(url: url)
                  ModernNetworkPolicy.prepareExternalAPIRequest(
                      &request,
                      acceptsZstandard: acceptsZstandard
                  )
                  if !acceptsZstandard {
                      // Do not let a malformed zstd response cached by an intermediary
                      // satisfy the compatibility retry with the same bytes.
                      request.cachePolicy = .reloadIgnoringLocalCacheData
                  }
                  if !allowsCaching {
                      request.cachePolicy = .reloadIgnoringLocalCacheData
                  }
                  request.setValue("BuFi/1.0.0", forHTTPHeaderField: "User-Agent")
                  if let token, !token.isEmpty {
                      request.setValue("Token \\(token)", forHTTPHeaderField: "Authorization")
                  }

                  let session = allowsCaching ? publicSession : privateSession
                  let retryPolicy = ReadRequestRetryPolicy()
                  var retryCount = 0
                  while true {
                      try Task.checkCancellation()
                      let data: Data
                      let response: URLResponse
                      do {
                          (data, response) = try await session.data(for: request)
                      } catch {
                          if Task.isCancelled { throw CancellationError() }
                          guard retryCount < ReadRequestRetryPolicy.maximumRetryCount,
                                retryPolicy.shouldRetry(error: error),
                                let delay = retryPolicy.delay(
                                  retryNumber: retryCount + 1,
                                  retryAfterHeader: nil,
                                  jitter: Double.random(in: 0.75...1.25)
                                ) else {
                              throw error
                          }
                          retryCount += 1
                          try await Task.sleep(
                              nanoseconds: UInt64(delay * 1_000_000_000)
                          )
                          continue
                      }

                      try Task.checkCancellation()
                      guard let http = response as? HTTPURLResponse else {
                          throw URLError(.badServerResponse)
                      }
                      guard (200..<300).contains(http.statusCode) else {
                          guard retryCount < ReadRequestRetryPolicy.maximumRetryCount,
                                retryPolicy.shouldRetry(statusCode: http.statusCode),
                                let delay = retryPolicy.delay(
                                  retryNumber: retryCount + 1,
                                  retryAfterHeader: http.value(
                                      forHTTPHeaderField: "Retry-After"
                                  ),
                                  jitter: Double.random(in: 0.75...1.25)
                                ) else {
                              throw URLError(.badServerResponse)
                          }
                          retryCount += 1
                          try await Task.sleep(
                              nanoseconds: UInt64(delay * 1_000_000_000)
                          )
                          continue
                      }
                      guard data.count <= 4 * 1_024 * 1_024 else {
                          throw URLError(.dataLengthExceedsMaximum)
                      }
                      let decoded = try await HTTPContentDecoder.decodeAsync(
                          data,
                          contentEncoding: http.value(forHTTPHeaderField: "Content-Encoding")
                      )
                      guard decoded.count <= 4 * 1_024 * 1_024 else {
                          throw URLError(.dataLengthExceedsMaximum)
                      }
                      return decoded
                  }
              }
'''
          replace_once(recommendation, old, new, 'external recommendation retries')
          PY

      - name: Verify and commit API audit fixes
        run: |
          git diff --check
          grep -n "bestEffortWithFallback\|retryPolicy.shouldRetry(statusCode" BuFi/Core/OpenSubsonicClient.swift BuFi/Core/RecommendationEngine.swift
          git rm .github/workflows/backend-api-audit-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Core/OpenSubsonicClient.swift BuFi/Core/RecommendationEngine.swift
          git diff --cached --check
          git commit -m 'Harden API cancellation and external recommendation retries'
          git push origin HEAD:backend-core-lightweight
