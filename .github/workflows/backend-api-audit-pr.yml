name: BuFi Offline Retry Final Patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-placeholder:
    runs-on: ubuntu-latest
    steps:
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          offline = Path('BuFi/Core/OfflineStore.swift')
          lines = offline.read_text().splitlines()
          function_index = next(
              (i for i, line in enumerate(lines) if 'private static func downloadFileWithRetry' in line),
              None
          )
          if function_index is None:
              raise SystemExit('downloadFileWithRetry missing')
          cancellation_index = next(
              (
                  i for i in range(function_index, min(len(lines), function_index + 120))
                  if lines[i].strip() == '} catch is CancellationError {'
              ),
              None
          )
          if cancellation_index is None:
              raise SystemExit('download cancellation catch missing')
          generic_index = next(
              (
                  i for i in range(cancellation_index + 1, min(len(lines), cancellation_index + 8))
                  if lines[i].strip() == '} catch {'
              ),
              None
          )
          if generic_index is None:
              raise SystemExit('download generic catch missing')
          lines[generic_index:generic_index] = [
              '            } catch let error as OpenSubsonicError {',
              '                // HTTP status handling above already consumed the bounded',
              '                // retry decision, including Retry-After. Do not catch the',
              '                // terminal status again as a headerless transport retry.',
              '                throw error'
          ]
          offline.write_text('\n'.join(lines) + '\n')
          subprocess.run(['git', 'add', 'BuFi/Core/OfflineStore.swift'], check=True)
          PY
