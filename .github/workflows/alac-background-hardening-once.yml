name: Apply ALAC background playback hardening once

on:
  push:
    branches:
      - fix/player-artwork-reopen-position
    paths:
      - .github/workflows/alac-background-hardening-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-artwork-reopen-position
          fetch-depth: 0

      - name: Harden ALAC background playback transition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('BuFi/Playback/AudioEngine.swift')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''        case constrained
                  case successor
          ''',
          '''        case constrained
                  case background
                  case successor
          ''',
          'buffer phase enum')

          replace_once(
          '''        case .constrained:
                      return switch profile {
                      case .aac: 10
                      case .compressed: 9
                      case .unknown: 9
                      case .lossless: 10
                      }
                  case .successor:
          ''',
          '''        case .constrained:
                      return switch profile {
                      case .aac: 10
                      case .compressed: 9
                      case .unknown: 9
                      case .lossless: 10
                      }
                  case .background:
                      // Background transitions are most fragile for progressive
                      // high-bitrate ALAC. Keep compressed formats at their normal
                      // steady-state targets, but give lossless a longer runway
                      // before iOS deprioritizes foreground work.
                      return switch profile {
                      case .aac: 20
                      case .compressed: 18
                      case .unknown: 18
                      case .lossless: 32
                      }
                  case .successor:
          ''',
          'background buffer values')

          replace_once(
          '''    private var backgroundTaskID: UIBackgroundTaskIdentifier = .invalid
          ''',
          '''    private var backgroundTaskID: UIBackgroundTaskIdentifier = .invalid
              private var backgroundBridgeBaselinePosition: TimeInterval?
              private var backgroundBridgePlaybackID: UUID?
              private var backgroundTransitionVerificationTask: Task<Void, Never>?
              private var backgroundTransitionVerificationToken: UUID?
          ''',
          'background transition state')

          # Route every context-sensitive resume through one helper. In the
          # background, progressive lossless uses AVPlayer's managed waiting
          # instead of forcing playImmediately into a thin ALAC buffer.
          text = text.replace(
              'self.playLatencyOptimized()',
              'self.resumeTransportForCurrentContext()'
          )
          text = text.replace(
              '            playLatencyOptimized()\n',
              '            resumeTransportForCurrentContext()\n'
          )
          text = text.replace(
              '        playLatencyOptimized()\n',
              '        resumeTransportForCurrentContext()\n'
          )

          replace_once(
          '''    private func playLatencyOptimized() {
                  // Keep AVPlayer's stall-management enabled globally, but do not pay its
                  // startup buffering tax for explicit starts, resumes, seeks, or a
                  // ready-to-play item. Mid-stream recovery still gets a bounded managed
                  // buffering grace before this fast path is used.
                  player.playImmediately(atRate: 1)
              }
          ''',
          '''    private func playLatencyOptimized() {
                  // Keep AVPlayer's stall-management enabled globally, but do not pay its
                  // startup buffering tax for explicit starts, resumes, seeks, or a
                  // ready-to-play item. Mid-stream recovery still gets a bounded managed
                  // buffering grace before this fast path is used.
                  player.playImmediately(atRate: 1)
              }

              private func resumeTransportForCurrentContext() {
                  // Apple's managed stall avoidance is intentionally kept for
                  // progressive lossless while backgrounded. `playImmediately`
                  // can report `.playing` with only the currently available bytes,
                  // which is exactly the fragile state a high-bitrate ALAC stream
                  // can enter during a foreground -> background scheduling handoff.
                  if !applicationIsActive,
                     currentPlaybackAudioProfile() == .lossless {
                      player.play()
                      return
                  }
                  playLatencyOptimized()
              }
          ''',
          'context-sensitive resume helper')

          replace_once(
          '''    private func expandSettledForwardBufferIfNeeded() {
                  guard let item = player.currentItem ?? logicalCurrentItem else { return }
                  let isLocal = (item.asset as? AVURLAsset)?.url.isFileURL == true
                  let profile = currentPlaybackAudioProfile()
                  let settled = PlaybackBufferPolicy.forwardBufferDuration(
                      isLocalFile: isLocal,
                      profile: profile,
                      phase: .settled
                  )
                  guard item.preferredForwardBufferDuration + 0.01 < settled else { return }
                  PlaybackBufferPolicy.configure(
                      item,
                      isLocalFile: isLocal,
                      profile: profile,
                      phase: .settled
                  )
              }
          ''',
          '''    private func expandSettledForwardBufferIfNeeded() {
                  guard let item = player.currentItem ?? logicalCurrentItem else { return }
                  let isLocal = (item.asset as? AVURLAsset)?.url.isFileURL == true
                  let profile = currentPlaybackAudioProfile()
                  let phase: PlaybackBufferPolicy.Phase = applicationIsActive
                      ? .settled
                      : .background
                  let target = PlaybackBufferPolicy.forwardBufferDuration(
                      isLocalFile: isLocal,
                      profile: profile,
                      phase: phase
                  )
                  guard item.preferredForwardBufferDuration + 0.01 < target else { return }
                  PlaybackBufferPolicy.configure(
                      item,
                      isLocalFile: isLocal,
                      profile: profile,
                      phase: phase
                  )
              }
          ''',
          'background-aware settled buffer')

          replace_once(
          '''    private func scheduleGaplessSuccessor() {
                  let activelyPlaying = player.timeControlStatus == .playing
                  guard wantsPlayback,
          ''',
          '''    private func scheduleGaplessSuccessor() {
                  let activelyPlaying = player.timeControlStatus == .playing
                  let profile = currentPlaybackAudioProfile()
                  // Do not open a second progressive lossless transport while
                  // backgrounded. AAC/compressed gapless behavior is unchanged.
                  guard applicationIsActive || profile != .lossless else { return }
                  guard wantsPlayback,
          ''',
          'background lossless gapless gate')

          replace_once(
          '''                profile: currentPlaybackAudioProfile()
                    ),
          ''',
          '''                profile: profile
                    ),
          ''',
          'gapless profile reuse')

          replace_once(
          '''    private func scheduleNetworkPrefetch() {
                  let metadataPrefetchCount = currentPlaybackAudioProfile() == .lossless
          ''',
          '''    private func scheduleNetworkPrefetch() {
                  guard applicationIsActive else {
                      cancelNetworkPrefetch(resetKey: true)
                      return
                  }
                  let metadataPrefetchCount = currentPlaybackAudioProfile() == .lossless
          ''',
          'background network prefetch gate')

          replace_once(
          '''    private func scheduleOfflinePrefetch() {
                  let configured = UserDefaults.standard.integer(forKey: "offline-prefetch-count")
          ''',
          '''    private func scheduleOfflinePrefetch() {
                  guard applicationIsActive else {
                      cancelOfflinePrefetch(resetKey: true)
                      return
                  }
                  let configured = UserDefaults.standard.integer(forKey: "offline-prefetch-count")
          ''',
          'background offline prefetch gate')

          replace_once(
          '''                    self.endBackgroundBridge()
                          self.reportPlaybackState("playing")
          ''',
          '''                    self.completeBackgroundBridgeIfPlaybackProgressed()
                          self.reportPlaybackState("playing")
          ''',
          'do not end bridge from timeControl alone')

          replace_once(
          '''            if self.duration > 0 {
                          self.elapsed = min(self.elapsed, self.duration)
                      }
                      self.updateActiveLyric(at: lyricPosition)
          ''',
          '''            if self.duration > 0 {
                          self.elapsed = min(self.elapsed, self.duration)
                      }
                      self.completeBackgroundBridgeIfPlaybackProgressed()
                      self.updateActiveLyric(at: lyricPosition)
          ''',
          'complete bridge from actual clock progress')

          replace_once(
          '''    private func setApplicationActive(_ value: Bool) {
                  guard applicationIsActive != value else { return }
                  applicationIsActive = value
                  installPlaybackTimeObserver()
              }
          ''',
          '''    private func setApplicationActive(_ value: Bool) {
                  guard applicationIsActive != value else { return }
                  applicationIsActive = value
                  if value {
                      cancelBackgroundTransitionVerification()
                      endBackgroundBridge()
                  } else if wantsPlayback {
                      prepareForBackgroundTransition()
                  }
                  installPlaybackTimeObserver()
                  if value,
                     wantsPlayback,
                     player.timeControlStatus == .playing {
                      scheduleNetworkPrefetch()
                      scheduleOfflinePrefetch()
                      scheduleGaplessSuccessor()
                  }
              }
          ''',
          'application active transition')

          replace_once(
          '''                    self.setApplicationActive(false)
                              self.preserveActivePlayback()
          ''',
          '''                    self.setApplicationActive(false)
                              // Do not issue a new play command merely because the
                              // scene became inactive. The existing transport is the
                              // most stable path, especially for progressive ALAC.
          ''',
          'will resign active transport preservation')

          replace_once(
          '''    private func handleDidEnterBackground() {
                  scheduleQueueSave(immediate: true)
                  guard wantsPlayback else {
                      playerTaskLifecycle.cancelBackgroundRecovery()
                      scheduleAudioSessionDeactivation(immediate: true)
                      return
                  }
                  beginBackgroundBridge()
                  preserveActivePlayback()
                  guard let playbackItem = currentPlaybackItem else {
                      playerTaskLifecycle.cancelBackgroundRecovery()
                      endBackgroundBridge()
                      return
                  }
                  let sessionGeneration = playbackSessionGeneration
                  let accountScope = currentAccountScope
                  let playbackGenerationID = playbackItem.id
                  let queueEntryID = playbackItem.queueEntryID
                  playerTaskLifecycle.scheduleBackgroundRecovery(
                      after: .seconds(4)
                  ) { [weak self] in
                      guard let self,
                            sessionGeneration == self.playbackSessionGeneration,
                            accountScope == self.currentAccountScope,
                            self.currentPlaybackItem?.id == playbackGenerationID,
                            self.currentPlaybackItem?.queueEntryID == queueEntryID,
                            self.wantsPlayback else {
                          return
                      }
                      guard self.player.timeControlStatus != .playing else {
                          self.endBackgroundBridge()
                          return
                      }
                      self.schedulePlaybackRecovery()
                  }
              }

              private func preserveActivePlayback() {
                  guard wantsPlayback, currentSong != nil else { return }
                  if player.currentItem == nil || player.currentItem?.status == .failed {
                      restartPlaybackPlan(resumeFrom: elapsed)
                      updateNowPlaying()
                      return
                  }
                  configureAudioSession()
                  player.isMuted = false
                  player.volume = 1
                  resumeTransportForCurrentContext()
                  recomputeTimelineFromPlayer()
                  installNextLyricBoundary(after: elapsed)
                  updateNowPlaying()
              }

              private func beginBackgroundBridge() {
                  endBackgroundBridge()
                  backgroundTaskID = UIApplication.shared.beginBackgroundTask(
                      withName: "BuFiPlaybackTransition"
                  ) { @Sendable [weak self] in
                      Task { @MainActor in self?.endBackgroundBridge() }
                  }
              }

              private func endBackgroundBridge() {
                  guard backgroundTaskID != .invalid else { return }
                  UIApplication.shared.endBackgroundTask(backgroundTaskID)
                  backgroundTaskID = .invalid
              }
          ''',
          '''    private func handleDidEnterBackground() {
                  // Persist locally at the lifecycle boundary, but do not start a
                  // server queue write beside the active media request. The server
                  // snapshot is best-effort and can wait for the normal cadence.
                  scheduleQueueSave(immediate: true, syncServer: false)
                  guard wantsPlayback else {
                      cancelBackgroundTransitionVerification()
                      scheduleAudioSessionDeactivation(immediate: true)
                      return
                  }
                  prepareForBackgroundTransition()
                  guard let playbackItem = currentPlaybackItem else {
                      cancelBackgroundTransitionVerification()
                      endBackgroundBridge()
                      return
                  }
                  let baselinePosition = currentPlayerPosition()
                  beginBackgroundBridge(
                      playbackItem: playbackItem,
                      baselinePosition: baselinePosition
                  )
                  preserveActivePlayback()
                  scheduleBackgroundTransitionVerification(
                      playbackItem: playbackItem,
                      baselinePosition: baselinePosition
                  )
              }

              private func prepareForBackgroundTransition() {
                  guard wantsPlayback, currentSong != nil else { return }
                  // Foreground-only work must never contend with the media stream
                  // during the short scheduler/network handoff into background.
                  suspendSpeculativePrefetch()
                  if currentPlaybackAudioProfile() == .lossless,
                     let stagedSuccessorItem,
                     player.currentItem !== stagedSuccessorItem {
                      invalidateStagedSuccessor(removeFromPlayer: true)
                  }
                  expandSettledForwardBufferIfNeeded()
              }

              private func preserveActivePlayback() {
                  guard wantsPlayback, currentSong != nil else { return }
                  if player.currentItem == nil || player.currentItem?.status == .failed {
                      restartPlaybackPlan(resumeFrom: elapsed)
                      updateNowPlaying()
                      return
                  }

                  // If AVPlayer is already advancing, leave its audio session,
                  // decoder, rate, and progressive HTTP range request untouched.
                  // Reissuing playImmediately here was unnecessary churn exactly
                  // at the foreground/background boundary.
                  if player.timeControlStatus != .playing {
                      configureAudioSession()
                      player.isMuted = false
                      player.volume = 1
                      resumeTransportForCurrentContext()
                  }
                  if let item = player.currentItem {
                      ensurePlaybackClockLivenessWatchdog(for: item)
                  }
                  recomputeTimelineFromPlayer()
                  installNextLyricBoundary(after: elapsed)
                  updateNowPlaying()
              }

              private func scheduleBackgroundTransitionVerification(
                  playbackItem: PlaybackMediaItem,
                  baselinePosition: TimeInterval
              ) {
                  cancelBackgroundTransitionVerification()
                  let token = UUID()
                  backgroundTransitionVerificationToken = token
                  let sessionGeneration = playbackSessionGeneration
                  let accountScope = currentAccountScope
                  backgroundTransitionVerificationTask = Task { [weak self] in
                      do {
                          try await Task.sleep(for: .milliseconds(2_500))
                      } catch {
                          return
                      }
                      guard let self,
                            !Task.isCancelled,
                            self.backgroundTransitionVerificationToken == token else {
                          return
                      }
                      defer {
                          if self.backgroundTransitionVerificationToken == token {
                              self.backgroundTransitionVerificationToken = nil
                              self.backgroundTransitionVerificationTask = nil
                          }
                      }
                      guard sessionGeneration == self.playbackSessionGeneration,
                            accountScope == self.currentAccountScope,
                            self.wantsPlayback else {
                          return
                      }

                      guard self.currentPlaybackItem?.id == playbackItem.id,
                            self.currentPlaybackItem?.queueEntryID == playbackItem.queueEntryID else {
                          if self.player.timeControlStatus == .playing {
                              self.endBackgroundBridge()
                          }
                          return
                      }

                      let position = self.currentPlayerPosition()
                      if PlaybackRecoveryPolicy.hasMeaningfulProgress(
                          from: baselinePosition,
                          to: position
                      ) {
                          self.endBackgroundBridge()
                          return
                      }

                      guard self.networkPathIsSatisfied else {
                          self.isBuffering = true
                          return
                      }
                      self.isBuffering = true
                      guard let item = self.player.currentItem else {
                          self.loadCurrentItem(
                              compatibilityFormat: self.activeCompatibilityFormat,
                              resumeFrom: position
                          )
                          return
                      }
                      if item.status == .readyToPlay,
                         self.player.timeControlStatus == .playing {
                          self.recoverFrozenPlaybackClock(item: item, position: position)
                      } else {
                          self.configureAudioSession()
                          self.resumeTransportForCurrentContext()
                          self.schedulePlaybackRecovery(mode: .stall)
                      }
                  }
              }

              private func cancelBackgroundTransitionVerification() {
                  backgroundTransitionVerificationToken = nil
                  backgroundTransitionVerificationTask?.cancel()
                  backgroundTransitionVerificationTask = nil
              }

              private func beginBackgroundBridge(
                  playbackItem: PlaybackMediaItem,
                  baselinePosition: TimeInterval
              ) {
                  endBackgroundBridge()
                  backgroundBridgePlaybackID = playbackItem.id
                  backgroundBridgeBaselinePosition = baselinePosition
                  backgroundTaskID = UIApplication.shared.beginBackgroundTask(
                      withName: "BuFiPlaybackTransition"
                  ) { @Sendable [weak self] in
                      Task { @MainActor in self?.endBackgroundBridge() }
                  }
              }

              private func completeBackgroundBridgeIfPlaybackProgressed() {
                  guard !applicationIsActive,
                        backgroundTaskID != .invalid,
                        let bridgePlaybackID = backgroundBridgePlaybackID,
                        let baselinePosition = backgroundBridgeBaselinePosition,
                        let playbackItem = currentPlaybackItem else {
                      return
                  }
                  if playbackItem.id != bridgePlaybackID {
                      if player.timeControlStatus == .playing {
                          endBackgroundBridge()
                      }
                      return
                  }
                  if PlaybackRecoveryPolicy.hasMeaningfulProgress(
                      from: baselinePosition,
                      to: currentPlayerPosition()
                  ) {
                      endBackgroundBridge()
                  }
              }

              private func endBackgroundBridge() {
                  backgroundBridgePlaybackID = nil
                  backgroundBridgeBaselinePosition = nil
                  guard backgroundTaskID != .invalid else { return }
                  UIApplication.shared.endBackgroundTask(backgroundTaskID)
                  backgroundTaskID = .invalid
              }
          ''',
          'background lifecycle hardening')

          # A user pause or interruption should not leave a transition verifier
          # alive after playback intent has been cleared.
          replace_once(
          '''    private func pausePlayback(persistsQueue: Bool) {
                  wantsPlayback = false
                  cancelPlaybackRecovery()
          ''',
          '''    private func pausePlayback(persistsQueue: Bool) {
                  wantsPlayback = false
                  cancelBackgroundTransitionVerification()
                  cancelPlaybackRecovery()
          ''',
          'pause cancels background verification')

          replace_once(
          '''        case .began:
                      resumeAfterInterruption = isPlaying || wantsPlayback
                      wantsPlayback = false
                      cancelPlaybackRecovery()
          ''',
          '''        case .began:
                      resumeAfterInterruption = isPlaying || wantsPlayback
                      wantsPlayback = false
                      cancelBackgroundTransitionVerification()
                      cancelPlaybackRecovery()
          ''',
          'interruption cancels background verification')

          # Session reconfiguration invalidates any lifecycle verifier owned by
          # the previous account/client.
          replace_once(
          '''    ) {
                  playbackSessionGeneration &+= 1
                  let sessionGeneration = playbackSessionGeneration
          ''',
          '''    ) {
                  cancelBackgroundTransitionVerification()
                  playbackSessionGeneration &+= 1
                  let sessionGeneration = playbackSessionGeneration
          ''',
          'configure cancels background verifier')

          path.write_text(text)
          PY

          git diff --check
          git diff -- BuFi/Playback/AudioEngine.swift

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/Playback/AudioEngine.swift
          git commit -m "Harden ALAC playback across background transitions"
          git push origin HEAD:fix/player-artwork-reopen-position
