name: Apply Playback Stability ee0d

on:
  push:
    branches:
      - agent/swift6-playback-stability
    paths:
      - .github/scripts/apply-playback-stability-ee0d.py
      - .github/workflows/apply-playback-stability-ee0d.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-playback-stability-ee0d
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift6-playback-stability
          fetch-depth: 0
      - name: Apply playback stability patch
        run: python3 .github/scripts/apply-playback-stability-ee0d.py
      - name: Validate patch shape
        run: |
          git diff --check
          grep -n --fixed-strings 'preparedPlaybackAssetLimit = 1' BuFi/Playback/AudioEngine.swift
          grep -n --fixed-strings 'resumesPlayback: self.wantsPlayback' BuFi/Playback/AudioEngine.swift
          grep -n --fixed-strings 'PlaybackGaplessPreparationPolicy.shouldPrepare' BuFi/Playback/AudioEngine.swift
      - name: Commit playback fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Playback/AudioEngine.swift BuFiTests/PlaybackPrefetchPlanTests.swift
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stabilize AVPlayer streaming recovery'
          git push origin HEAD:agent/swift6-playback-stability
