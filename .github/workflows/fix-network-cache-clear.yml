name: Fix network cache clear

on:
  push:
    branches:
      - codex/network-performance-pass

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/network-performance-pass
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python Scripts/fix-network-cache-clear.py
      - run: rm -f Scripts/fix-network-cache-clear.py .github/workflows/fix-network-cache-clear.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix bounded response cache clearing"
          git push
