name: Icon Composer Probe

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Inspect Apple icon toolchain
        run: |
          set -eu
          echo "Xcode:"
          xcodebuild -version
          DEVELOPER_DIR="$(xcode-select -p)"
          XCODE_APP="$(dirname "$(dirname "$DEVELOPER_DIR")")"
          echo "Selected developer directory: $DEVELOPER_DIR"
          echo "Selected Xcode application: $XCODE_APP"
          echo "Icon Composer applications:"
          find "$XCODE_APP" -type d \
            \( -name 'Icon Composer.app' -o -name 'IconComposer.app' \) \
            -print
          echo "Asset compiler:"
          xcrun --find actool
          xcrun actool --help 2>&1 | head -160 || true
          echo "Icon Composer resources:"
          find "$XCODE_APP" -type f \
            \( -name '*.icon' -o -name '*.iconcomposer' -o -name '*IconComposer*' \) \
            -print | head -120
          while IFS= read -r app; do
            echo "Icon Composer bundle information: $app"
            plutil -p "$app/Contents/Info.plist" | head -120
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            echo "Executable: $app/Contents/MacOS/$executable"
            file "$app/Contents/MacOS/$executable"
            echo "Scripting dictionary:"
            sdef "$app" 2>&1 | head -200 || true
            echo "Potential command-line interfaces:"
            strings "$app/Contents/MacOS/$executable" \
              | grep -i -E 'command.?line|--export|--output|usage:|new.?document' \
              | head -160 || true
            echo "Bundled document templates and schemas:"
            find "$app/Contents/Resources" -maxdepth 4 -type f \
              \( -name '*.icon' -o -name '*.json' -o -name '*.plist' -o -name '*.momd' \) \
              -print | head -160
          done < <(find "$XCODE_APP" -type d \
            \( -name 'Icon Composer.app' -o -name 'IconComposer.app' \) \
            -print)
