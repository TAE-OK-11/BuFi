name: One-shot legacy lyric test update

on:
  push:
    branches:
      - agent/smarter-recommendations
    paths:
      - .github/workflows/one-shot-fix-legacy-lyric-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/smarter-recommendations
          fetch-depth: 0
      - name: Update test
        run: python3 Scripts/fix_legacy_lyric_test.py
      - name: Commit test update
        run: |
          rm -f Scripts/fix_legacy_lyric_test.py
          rm -f .github/workflows/one-shot-fix-legacy-lyric-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update legacy lyric cache expectation"
          git push origin HEAD:agent/smarter-recommendations
