      - name: Add thermal workload policy
        shell: bash
        run: |
          cat > BuFi/Core/LyricAnalysisWorkloadPolicy.swift <<'SWIFT'
          import Foundation

          enum LyricAnalysisWorkloadPolicy {
              static var shouldDeferSoundAnalysis: Bool {
                  if ProcessInfo.processInfo.isLowPowerModeEnabled { return true }
                  switch ProcessInfo.processInfo.thermalState {
                  case .serious, .critical:
                      return true
                  case .nominal, .fair:
                      return false
                  @unknown default:
                      return true
                  }
              }

              static var backgroundSweepDelay: Duration {
                  if ProcessInfo.processInfo.isLowPowerModeEnabled { return .seconds(12) }
                  switch ProcessInfo.processInfo.thermalState {
                  case .nominal: return .seconds(4)
                  case .fair: return .seconds(7)
                  case .serious: return .seconds(12)
                  case .critical: return .seconds(20)
                  @unknown default: return .seconds(12)
                  }
              }

              static func pauseBetweenSongs() async {
                  let milliseconds: Int
                  if ProcessInfo.processInfo.isLowPowerModeEnabled {
                      milliseconds = 260
                  } else {
                      switch ProcessInfo.processInfo.thermalState {
                      case .nominal: milliseconds = 40
                      case .fair: milliseconds = 140
                      case .serious: milliseconds = 500
                      case .critical: milliseconds = 1_000
                      @unknown default: milliseconds = 500
                      }
                  }
                  try? await Task.sleep(for: .milliseconds(milliseconds))
              }
          }
          SWIFT

