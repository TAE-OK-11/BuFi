name: Battery Optimization Verify

on:
  push:
    branches:
      - energy/battery-efficiency
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battery-optimization-verify
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-arm64
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build Release
        id: build
        continue-on-error: true
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -quiet \
            -project BuFi.xcodeproj \
            -scheme BuFi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build 2>&1 | tee build/full.log
      - name: Extract diagnostics
        if: always()
        run: |
          grep -E '(^|: )(error|warning):|^[^ ]+\.swift:[0-9]+:[0-9]+:' build/full.log > build/diagnostics.txt || true
          tail -n 300 build/full.log > build/tail.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-build-diagnostics
          path: |
            build/diagnostics.txt
            build/tail.txt
          if-no-files-found: error
          retention-days: 3
      - name: Fail on build error
        if: steps.build.outcome == 'failure'
        run: exit 1
