name: Fix streaming task capture

on:
  push:
    branches:
      - agent/streaming-latency-swift6

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/streaming-latency-swift6
      - name: Fix capture
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('BuFi/Playback/AudioEngine.swift')
          s = p.read_text()
          old = '''        networkPrefetchTask = Task(priority: .utility) { [weak self] in\n            defer {\n                if let self, self.networkPrefetchToken == token {\n                    self.networkPrefetchTask = nil\n                    self.networkPrefetchToken = nil\n                }\n            }\n            async let successorWarmup: Void = self.warmImmediateSuccessorAfterStablePlayback('''
          new = '''        networkPrefetchTask = Task(priority: .utility) { [weak self] in\n            guard let self else { return }\n            defer {\n                if self.networkPrefetchToken == token {\n                    self.networkPrefetchTask = nil\n                    self.networkPrefetchToken = nil\n                }\n            }\n            async let successorWarmup: Void = self.warmImmediateSuccessorAfterStablePlayback('''
          if s.count(old) != 1:
              raise SystemExit(f'capture block matches: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/Playback/AudioEngine.swift
          git commit -m "Fix structured prefetch task ownership"
          git push origin HEAD:agent/streaming-latency-swift6
