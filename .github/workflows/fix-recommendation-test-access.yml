name: Fix Recommendation Test Access

on:
  push:
    branches:
      - agent/recommendation-accuracy-speed

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Expose searchable text to test target
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('BuFi/Core/RecommendationEngine.swift')
          text = path.read_text()
          old = '    fileprivate static func searchableText(_ song: Song) -> String {'
          new = '    static func searchableText(_ song: Song) -> String {'
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('unexpected searchableText declaration')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Core/RecommendationEngine.swift
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Expose recommendation metadata text to tests'
          git push origin HEAD:agent/recommendation-accuracy-speed
