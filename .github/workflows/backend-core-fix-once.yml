name: BuFi Backend One-Time Fix

on:
  push:
    branches:
      - backend-core-lightweight

permissions:
  contents: write

jobs:
  patch-swift64-autoclosure:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: backend-core-lightweight
          fetch-depth: 1

      - name: Patch async boolean expression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('BuFi/Core/OpenSubsonicClient.swift')
          text = path.read_text()
          old = '''        let supportsSonic = similarEndpoints.contains("getSonicSimilarTracks")
              && await supportsExtension("sonicSimilarity", limiter: limiter)
'''
          new = '''        let supportsSonicExtension = await supportsExtension(
              "sonicSimilarity",
              limiter: limiter
          )
          let supportsSonic = similarEndpoints.contains("getSonicSimilarTracks")
              && supportsSonicExtension
'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Swift 6.4 autoclosure pattern')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit backend compile fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/Core/OpenSubsonicClient.swift
          git diff --cached --check
          git commit -m 'Fix Swift 6.4 async recommendation capability check'
          git push origin HEAD:backend-core-lightweight
