name: Apply Internal Stability Improvements

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'stability/oss-inspired-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stability/oss-inspired-core
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 Scripts/apply-internal-stability.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BuFi/Playback/AudioEngine.swift
          git commit -m "perf: harden adaptive playback recovery"
          git push origin HEAD:stability/oss-inspired-core
