name: Fix Monotonic Clock Reset

on:
  push:
    branches:
      - agent/swift-6-concurrency
    paths:
      - .github/scripts/fix-monotonic-reset.py
      - .github/workflows/fix-monotonic-reset.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/swift-6-concurrency
          fetch-depth: 0
      - run: python3 .github/scripts/fix-monotonic-reset.py
      - run: |
          git diff --check
          ! grep -n --fixed-strings 'lastFullRefresh = .distantPast' BuFi/App/AppModel.swift
          ! grep -n --fixed-strings 'lastHomeSnapshotSave = .distantPast' BuFi/App/AppModel.swift
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/App/AppModel.swift
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix monotonic refresh reset state'
          git push origin HEAD:agent/swift-6-concurrency
