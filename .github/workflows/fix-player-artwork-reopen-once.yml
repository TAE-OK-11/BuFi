name: Fix player artwork reopen once

on:
  push:
    branches:
      - fix/player-artwork-reopen-position

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/player-artwork-reopen-position
          fetch-depth: 0

      - name: Seed full-player artwork before first pager layout
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          root = 'BuFi/UI/RootView.swift'
          player = 'BuFi/UI/PlayerView.swift'

          replace_once(
              root,
              '''private struct PlayerPresentationSession: Identifiable {
              let id: UUID
          }
''',
              '''private struct PlayerPresentationSession: Identifiable {
              let id: UUID
              let initialArtworkPage: PlayerArtworkPageID?
          }
'''
          )

          replace_once(
              root,
              '''            NavigationStack {
              PlayerView()
                  .navigationDestination(for: MusicRoute.self) { route in
''',
              '''            NavigationStack {
              PlayerView(
                  initialArtworkPage: presentation.initialArtworkPage
              )
                  .navigationDestination(for: MusicRoute.self) { route in
'''
          )

          replace_once(
              root,
              '''                return PlayerPresentationSession(
                  id: playerPresentation.presentationID
              )
''',
              '''                return PlayerPresentationSession(
                  id: playerPresentation.presentationID,
                  initialArtworkPage: currentArtworkPageID
              )
'''
          )

          replace_once(
              root,
              '''    private var effectiveMotion: Bool {
''',
              '''    private var currentArtworkPageID: PlayerArtworkPageID? {
              guard let item = currentPlayback.item else { return nil }
              return PlayerArtworkPageID(
                  queueEntryID: item.queueEntryID,
                  songID: item.song.id,
                  coverArtID: item.song.artworkID,
                  artworkRevision: item.song.artworkRevision,
                  accountScope: item.accountScope
              )
          }

          private var effectiveMotion: Bool {
'''
          )

          replace_once(
              player,
              '''    private let audio = AudioEngine.shared

              var body: some View {
''',
              '''    private let audio = AudioEngine.shared

              init(initialArtworkPage: PlayerArtworkPageID? = nil) {
                  // Seed the horizontal pager before its first layout. Waiting for
                  // onAppear/onChange is too late after process restoration: SwiftUI
                  // can reuse the ScrollView's leading content offset for one frame
                  // (or keep it), which makes the current album art appear shifted
                  // or exposes a neighboring queue page.
                  _artworkPage = State(initialValue: initialArtworkPage)
              }

              var body: some View {
'''
          )

          # Keep the actual UIImage locked to the square artwork bounds. This is
          # intentionally redundant with the pager's outer frame: it prevents a
          # restored image's intrinsic size from participating in the first ZStack
          # layout before the parent ScrollView has resolved its target position.
          components = 'BuFi/UI/Components.swift'
          replace_once(
              components,
              '''                Image(uiImage: loadedArtwork.image)
                  .resizable()
                  .scaledToFill()
                  .transition(
''',
              '''                Image(uiImage: loadedArtwork.image)
                  .resizable()
                  .scaledToFill()
                  .frame(width: size, height: size)
                  .clipped()
                  .transition(
'''
          )
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuFi/UI/RootView.swift BuFi/UI/PlayerView.swift BuFi/UI/Components.swift
          git commit -m 'Fix restored full-player artwork position'
          git push origin HEAD:fix/player-artwork-reopen-position
